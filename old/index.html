<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/img/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Resource hints for external domains -->
  <link rel="dns-prefetch" href="https://github.com" />
  <link rel="dns-prefetch" href="https://linkedin.com" />
  <title>Rand Halasa — Software Engineer & SEO Specialist in Sydney</title>
  <meta name="description"
    content="Rand Halasa is a software engineering graduate and SEO specialist in Sydney. Full-stack web work with a specialty in SEO/GEO for the AI-search era. Available for freelance web and SEO projects." />
  <meta name="keywords"
    content="Rand Halasa, Software Engineer, SEO Specialist, GEO, Portfolio, Developer, Full Stack, Freelance Web Developer, Sydney" />
  <meta name="author" content="Rand Halasa" />
  <link rel="canonical" href="https://raaannndddd.github.io/portfolio/" />

  <!-- GEO Tags -->
  <meta name="geo.region" content="AU-NSW" />
  <meta name="geo.placename" content="Sydney" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://raaannndddd.github.io/portfolio/" />
  <meta property="og:title" content="Rand Halasa — Software Engineer & SEO Specialist" />
  <meta property="og:description"
    content="Full-stack web work with a specialty in SEO/GEO for the AI-search era. Client projects, honours research, and freelance web & SEO work." />
  <meta property="og:image" content="https://raaannndddd.github.io/portfolio/img/logo.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Rand Halasa — Software Engineer & SEO Specialist" />
  <meta name="twitter:description"
    content="Full-stack web work with a specialty in SEO/GEO for the AI-search era. Client projects, honours research, and freelance web & SEO work." />
  <meta name="twitter:image" content="https://raaannndddd.github.io/portfolio/img/logo.png" />

  <!-- JSON-LD Structured Data (Person) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rand Halasa",
    "url": "https://raaannndddd.github.io/portfolio/",
    "jobTitle": ["Software Engineer", "SEO Specialist"],
    "alumniOf": "University of Sydney",
    "description": "Software engineering graduate and SEO specialist in Sydney. Full-stack web work with a specialty in SEO/GEO for the AI-search era, available for freelance web and SEO projects.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Sydney",
      "addressRegion": "NSW",
      "addressCountry": "AU"
    },
    "sameAs": [
      "https://github.com/raaannndddd",
      "https://linkedin.com/in/randhalasa"
    ]
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    const theme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (theme === 'dark' || (!theme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</body>

</html>
