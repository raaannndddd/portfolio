const BLEND = {baseR:0.098, baseH:0.145, jugH:0.255, jugR0:0.088, jugR1:0.064};
function buildBlender(){
  const g = new THREE.Group();
  g.userData.name = 'Blender';
  g.userData.hoverable = true;
  const B = BLEND;

  /* motor housing: wider at the foot, control face angled to the room */
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(B.baseR*0.82, B.baseR, B.baseH, 28), M.plasticDark);
  base.position.y = B.baseH/2;
  base.castShadow = true; base.receiveShadow = true;
  g.add(base);
  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(B.jugR0*0.86, B.baseR*0.82, 0.022, 28), M.chrome);
  collar.position.y = B.baseH + 0.010;
  collar.castShadow = true;
  g.add(collar);

  /* control panel and two buttons */
  const panelFace = box(0.088, 0.062, 0.010, M.chrome, 0, B.baseH*0.52, B.baseR*0.94);
  panelFace.rotation.x = -0.12;
  g.add(panelFace);
  [-0.020, 0.020].forEach(function(x){
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.010, 14), M.plasticLight);
    b.rotation.x = Math.PI/2 - 0.12;
    b.position.set(x, B.baseH*0.52, B.baseR*0.99);
    g.add(b);
  });

  /* the jug: an open-ended tapered tube, so you see through both walls */
  const y0 = B.baseH + 0.021;
  const jug = new THREE.Mesh(
    new THREE.CylinderGeometry(B.jugR1, B.jugR0, B.jugH, 32, 1, true), M.glass);
  jug.position.y = y0 + B.jugH/2;
  jug.renderOrder = 4;
  g.add(jug);
  /* rim and a spout notch */
  const rim = new THREE.Mesh(new THREE.TorusGeometry(B.jugR1, 0.005, 8, 32), M.glass);
  rim.rotation.x = Math.PI/2;
  rim.position.y = y0 + B.jugH;
  rim.renderOrder = 4;
  g.add(rim);
  const spout = box(0.030, 0.014, 0.026, M.glass, 0, y0 + B.jugH - 0.004, B.jugR1 + 0.006);
  spout.renderOrder = 4;
  g.add(spout);

  /* blade assembly, sitting in the bottom of the jug. The two blades live on
     a group of their own so the jug can be spun without spinning the glass */
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.020, 0.028, 14), M.steelDark);
  hub.position.y = y0 + 0.016;
  g.add(hub);
  const blades = new THREE.Group();
  blades.position.y = y0 + 0.026;
  [0, Math.PI/2].forEach(function(r){
    const bl = box(0.086, 0.003, 0.014, M.chrome, 0, 0, 0);
    bl.rotation.y = r;
    bl.rotation.z = 0.22;
    blades.add(bl);
  });
  g.add(blades);
  g.userData.blades = blades;

  /* the juice. A tapered tube of its own that follows the jug's own taper,
     grown from the bottom by scaling in y — the top disc rides with it so
     the surface stays where the liquid actually ends. Both start at nothing
     and are hidden outright at rest, so an empty jug is properly empty. */
  const FILL_H = B.jugH*0.66;
  const fillR1 = B.jugR0 + (B.jugR1 - B.jugR0)*(FILL_H/B.jugH);
  const juice = new THREE.Group();
  juice.position.y = y0 + 0.004;
  const col = new THREE.Mesh(
    new THREE.CylinderGeometry(fillR1 - 0.004, B.jugR0 - 0.004, FILL_H, 32, 1, true), M.juice);
  col.position.y = FILL_H/2;
  col.renderOrder = 3;
  juice.add(col);
  const top = new THREE.Mesh(new THREE.CircleGeometry(fillR1 - 0.004, 32), M.juiceTop);
  top.rotation.x = -Math.PI/2;
  top.position.y = FILL_H;
  top.renderOrder = 3;
  juice.add(top);
  juice.scale.y = 0.0001;
  juice.visible = false;
  g.add(juice);
  g.userData.juice = juice;

  /* lid, and a handle standing off the side of the jug */
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(B.jugR1 + 0.008, B.jugR1 + 0.004, 0.026, 28),
                             M.plasticDark);
  lid.position.y = y0 + B.jugH + 0.013;
  lid.castShadow = true;
  g.add(lid);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.026, 0.016, 18), M.plasticDark);
  cap.position.set(0, y0 + B.jugH + 0.032, 0);
  g.add(cap);

  const handle = new THREE.Group();
  const grip = box(0.020, B.jugH*0.62, 0.030, M.plasticDark, 0, 0, 0);
  grip.position.set(B.jugR0 + 0.052, y0 + B.jugH*0.52, 0);
  handle.add(grip);
  [0.31, -0.31].forEach(function(f){
    const arm = box(0.062, 0.018, 0.026, M.plasticDark,
                    B.jugR0 + 0.022, y0 + B.jugH*0.52 + B.jugH*f, 0);
    handle.add(arm);
  });
  g.add(handle);

  g.add(applianceShadow(B.baseR*2 + 0.26, B.baseR*2 + 0.26, 0.36));
  return g;
}

/* ------------------------------------------------------------
   THE MENU ON THE COUNTER
   A card folded once and stood up, the way a menu stands on a
   table. The face is printed with the *shape* of a menu and
   nothing else — no letters are baked into the texture, because
   every word a visitor has to read lives in the DOM overlay this
   opens, where it can be selected, copied and read out.
   ------------------------------------------------------------ */
const MEN = {w:0.215, h:0.285, lean:0.17, t:0.004};

function menuCardCanvas(){
  const w = 320, h = Math.round(w * MEN.h / MEN.w);
  const c = cvs(w, h), g = c.getContext('2d');

  g.fillStyle = '#fbf7ec'; g.fillRect(0, 0, w, h);

  /* the hairline border a printed card has, inset from the paper edge */
  g.strokeStyle = 'rgba(96,86,66,.34)';
  g.lineWidth = 1.4;
  g.strokeRect(w*0.075, h*0.055, w*0.85, h*0.89);

  /* the heading: one dark bar, centred, with a rule under it */
  g.fillStyle = 'rgba(44,39,30,.80)';
  g.fillRect(w*0.26, h*0.115, w*0.48, h*0.030);
  g.fillStyle = 'rgba(96,86,66,.42)';
  g.fillRect(w*0.34, h*0.170, w*0.32, h*0.008);

  /* three courses. Each is a short dark line for the name, a dotted
     leader running out to a short line for the address, and a paler
     line under the pair for the description */
  const rows = [h*0.285, h*0.470, h*0.655];
  rows.forEach(function(y){
    g.fillStyle = 'rgba(44,39,30,.68)';
    g.fillRect(w*0.135, y, w*0.20, h*0.017);

    g.strokeStyle = 'rgba(96,86,66,.34)';
    g.lineWidth = 1.2;
    g.setLineDash([2.2, 4]);
    g.beginPath();
    g.moveTo(w*0.355, y + h*0.012);
    g.lineTo(w*0.585, y + h*0.012);
    g.stroke();
    g.setLineDash([]);

    g.fillStyle = 'rgba(44,39,30,.56)';
    g.fillRect(w*0.605, y, w*0.26, h*0.017);

    g.fillStyle = 'rgba(96,86,66,.30)';
    g.fillRect(w*0.135, y + h*0.048, w*0.66, h*0.012);
    g.fillRect(w*0.135, y + h*0.076, w*0.44, h*0.012);
  });

  /* the footer rule, and the little centred mark under it */
  g.fillStyle = 'rgba(96,86,66,.30)';
  g.fillRect(w*0.135, h*0.845, w*0.73, h*0.006);
  g.fillRect(w*0.415, h*0.882, w*0.17, h*0.011);

  speckle(g, w, h, 340, 0.05);
  return c;
}

function buildMenu(){
  const g = new THREE.Group();
  g.userData.name = 'The menu';
  g.userData.hoverable = true;

  const paper = new THREE.MeshStandardMaterial({color:'#f6f1e4', roughness:0.76});
  const face  = new THREE.MeshStandardMaterial({map:tex(menuCardCanvas()), roughness:0.78});

  const a = MEN.lean, W = MEN.w, H = MEN.h, t = MEN.t;
  const cy = H*Math.cos(a)/2, cz = H*Math.sin(a)/2;

  /* the printed leaf, leaning back at the top so its face tilts up towards
     the room rather than staring at the splashback */
  const leaf = new THREE.Group();
  leaf.rotation.x = -a;
  leaf.position.set(0, cy, cz);
  leaf.add(box(W, H, t, paper));
  leaf.add(plate(W - 0.007, H - 0.007, face, 0, 0, t/2 + 0.0007));
  g.add(leaf);

  /* the blank leaf behind, and the fold across the top where they meet */
  const back = new THREE.Group();
  back.rotation.x = a;
  back.position.set(0, cy, -cz);
  back.add(box(W, H, t, paper));
  g.add(back);
  g.add(box(W, t*1.7, cz*2, paper, 0, H*Math.cos(a), 0));

  g.add(applianceShadow(W + 0.09, cz*4 + 0.09, 0.30));

  /* what the loop animates: the whole card lifts and warms very slightly
     on hover, the same gesture the prints on the fridge use */
  g.userData.hover = 0;
  g.userData.faceMats = [paper, face];
  return g;
}

/* skirting and cornice */
(function(){
  const sk = 0.10, sd = 0.020, co = 0.075, cd = 0.055;
  function run(len, rotY, x, z, y, h, d){
    const b = box(len, h, d, M.trim, 0, 0, 0);
    b.rotation.y = rotY; b.position.set(x, y, z);
    scene.add(b);
  }
  run(SIDE_X*2, 0, 0, BACK_Z + sd/2, sk/2, sk, sd);
  run(FLOOR_D, Math.PI/2, -SIDE_X + sd/2, FLOOR_CZ, sk/2, sk, sd);
  run(OPEN_Z0 - BACK_Z, Math.PI/2, SIDE_X - sd/2, (BACK_Z + OPEN_Z0)/2, sk/2, sk, sd);

  run(SIDE_X*2, 0, 0, FRONT_Z - sd/2, sk/2, sk, sd);

  run(SIDE_X*2, 0, 0, BACK_Z + cd/2, WALL_H - co/2, co, cd);
  run(FLOOR_D, Math.PI/2, -SIDE_X + cd/2, FLOOR_CZ, WALL_H - co/2, co, cd);
  run(FLOOR_D, Math.PI/2, SIDE_X - cd/2, FLOOR_CZ, WALL_H - co/2, co, cd);
  run(SIDE_X*2, 0, 0, FRONT_Z - cd/2, WALL_H - co/2, co, cd);

const ucWashes = [];
function underLight(w, x){
  const zf = CAB.upD - 0.085;                    /* set back behind the door line */
  backRun.add(box(w - 0.10, 0.020, 0.060, M.ucBody, x, CAB.upY - 0.010, zf));

  function wash(geo, mat, rx, px, py, pz, ry){
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = rx; if(ry) m.rotation.z = ry;
    m.position.set(px, py, pz);
    m.renderOrder = 3;
    ucWashes.push(m);
    backRun.add(m);

  const mat = function(op){
    return new THREE.MeshBasicMaterial({map:washTex, color:0xffdcaa, transparent:true,
      opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, fog:false});
  };
  /* down the splashback */
  const hWall = CAB.upY - COUNTER_Y;
  const wallWash = wash(new THREE.PlaneGeometry(w - 0.06, hWall), mat(0.30),
                        0, x, COUNTER_Y + hWall/2, 0.014);

  const topWash = wash(new THREE.PlaneGeometry(w - 0.06, CAB.counterD*0.92), mat(0.20),
                       -Math.PI/2, x, COUNTER_Y + 0.006, CAB.counterD*0.46);

}

const glareTex = new THREE.CanvasTexture(radialCanvas(1, 0.28));
const lenses = [], halos = [], pools = [];

function downlight(x, z){
  const g = new THREE.Group();

  ring.position.y = WALL_H - 0.013;

  lens.position.y = WALL_H - 0.030;

  lenses.push(lens);

  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshBasicMaterial({map:glareTex, color:0xffe3b4, transparent:true,
      opacity:0.32, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  halo.rotation.x = Math.PI/2;
  halo.position.y = WALL_H - 0.042;
  halo.renderOrder = 3;
  g.add(halo);
  halos.push(halo);

  g.position.set(x, 0, z);
  scene.add(g);
}

const LIGHT_X = [-4.16, -2.08, 0, 2.08, 4.16], LIGHT_Z = [-4.25, -2.0, 0.4];

}

const spots = [];
function spot(x, z, tx, ty, tz, intensity, shadow){
  const s = new THREE.SpotLight(0xfff0d6, intensity, 13, 0.92, 0.86, 1.1);
  s.position.set(x, WALL_H - 0.04, z);
  s.target.position.set(tx, ty, tz);
  if(shadow){
    s.castShadow = true;
    s.shadow.mapSize.set(shadow === 2 ? 2048 : 1024, shadow === 2 ? 2048 : 1024);
    s.shadow.camera.near = 0.5;
    s.shadow.camera.far = 8;
    s.shadow.bias = -0.0004;
    s.shadow.normalBias = 0.05;    /* generous: the room is all flat panels */
    s.shadow.radius = 4;
  }
  scene.add(s); scene.add(s.target);
  s.userData.base = intensity;
  spots.push(s);
  return s;
}

   ============================================================ */
const dom = renderer.domElement;
const pointer = new THREE.Vector2(0,0);
const look = {x:0, y:0}, target = {x:0, y:0};
let yaw = 0, yawT = 0, pitch = 0, pitchT = 0;
let dolly = 0, dollyT = 0;
let dragging = false, dragged = false, lastX = 0, lastY = 0;

const raycaster = new THREE.Raycaster();
let hovered = null;

let openIndex = -1, lastFocus = null;        /* which photo is open, if any */
let menuOpen = false;                        /* and whether the menu is up */
let waterOn = false, waterLevel = 0;
let lightsOn = true, lightLevel = 1;
/* the two appliances. `level` is what the loop actually draws — it chases
   `on`, so both of them ease rather than snap, and both survive a press
   landing halfway through the last one. */
let toastOn = false, toastLevel = 0;
let blendOn = false, blendLevel = 0, bladeSpin = 0;

function toggleWater(){
  waterOn = !waterOn;
  waterSound(waterOn);
}
function toggleLights(){
  lightsOn = !lightsOn;
}
function toggleToast(){
  toastOn = !toastOn;
}
function toggleBlender(){
  blendOn = !blendOn;
}
dom.style.cursor = 'default';
/* `dragging` no longer turns the room — it only remembers that a press is in
   flight, so a press that slides off its mark can be told from a click */
dom.addEventListener('pointerdown', function(e){
  dragging = true; dragged = false;
  lastX = e.clientX; lastY = e.clientY;
  if(dom.setPointerCapture) dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  pointer.x =  (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  target.x = pointer.x; target.y = pointer.y;
  /* the room does not follow a held press. all that is left to measure is
     whether the press wandered far enough to stop being a click */
  if(dragging && Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 12){
    dragged = true;
  }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  dom.style.cursor = hovered && hovered.userData.clickable ? 'pointer' : 'default';
  if(dragged || !hovered) return;
  if(hovered.userData.photo !== undefined) openPhoto(hovered.userData.photo);
  else if(hovered.userData.isTap) toggleWater();
  else if(hovered.userData.isSwitch) toggleLights();
  else if(hovered.userData.isToaster) toggleToast();
  else if(hovered.userData.isBlender) toggleBlender();
  else if(hovered.userData.isMenu) openMenu();
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', function(e){
  /* forward only, and not far: the fridge wall is the whole show */
  dollyT = THREE.MathUtils.clamp(dollyT - e.deltaY*0.0020, 0, 2.55);
}, {passive:true});

tap.userData.clickable = true;
switchPlate.userData.clickable = true;
toaster.userData.clickable = true;
toaster.userData.isToaster = true;
blender.userData.clickable = true;
blender.userData.isBlender = true;
menu.userData.clickable = true;
menu.userData.isMenu = true;

function updateHover(){
  if(openIndex >= 0 || menuOpen){ hovered = null; return; }
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hoverables, true)[0];
  let group = null;
  if(hit){
    let o = hit.object;
    while(o && !o.userData.hoverable) o = o.parent;
    group = o;
    /* only the things that answer to a press carry a tag — the kettle,
       the crockery and the rest of the dressing stay quiet */
    if(group && !group.userData.clickable) group = null;
  }
  if(group !== hovered){
    hovered = group;
    dom.style.cursor = hovered && hovered.userData.clickable ? 'pointer' : 'default';
  }
}

/* ------------------------------------------------------------
   THE OPENED PHOTO
   The picture is an <img> and the caption is real text in the
   DOM, not geometry — so both can be selected, copied, zoomed by
   the browser and read out by a screen reader.
   ------------------------------------------------------------ */
const lb      = document.getElementById('lb');
const lbImg   = document.getElementById('lb-img');
const lbTitle = document.getElementById('lb-title');
const lbCap   = document.getElementById('lb-cap');
const lbCount = document.getElementById('lb-count');

/* the placeholder the fridge is showing, reused here so the two never
   disagree about what a photo looks like before it exists */
const placeholderURL = PHOTOS.map(function(ph){
  return photoPlaceholderCanvas(ph.colour, ph.ar).toDataURL();
});

function showPhoto(i){
  const n = PHOTOS.length;
  openIndex = ((i % n) + n) % n;
  const ph = PHOTOS[openIndex];
  lbImg.src = ph.src || placeholderURL[openIndex];
  lbImg.alt = ph.src ? ph.name : (ph.name + ' — photograph to come');
  lbTitle.textContent = ph.name;
  lbCap.innerHTML     = ph.caption;
  lbCount.textContent = (openIndex + 1) + ' / ' + n;
  lb.setAttribute('aria-label', ph.name);
}
function openPhoto(i){
  lastFocus = document.activeElement;
  showPhoto(i);
  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  dragging = false;
  dom.style.cursor = 'default';
  document.getElementById('lb-next').focus();
}
function closePhoto(){
  if(openIndex < 0) return;
  openIndex = -1;
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function stepPhoto(d){ if(openIndex >= 0) showPhoto(openIndex + d); }

/* anywhere on the overlay closes it — except the two arrows */
lb.addEventListener('click', closePhoto);
[['lb-prev', -1], ['lb-next', 1]].forEach(function(a){
  document.getElementById(a[0]).addEventListener('click', function(e){
    e.stopPropagation();
    stepPhoto(a[1]);
  });
});

/* a keyboard route in, since a plane in a WebGL canvas cannot be tabbed to */
(function(){
  const host = document.getElementById('photo-links');
  PHOTOS.forEach(function(ph, i){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sr-only';
    b.textContent = 'Open photo: ' + ph.name;
    b.addEventListener('click', function(){ openPhoto(i); });
    host.appendChild(b);
  });
})();


/* ------------------------------------------------------------
   THE MENU, OPENED
   The card on the worktop is a picture of a menu; this is the
   menu. Every course is written into the DOM from MENU above,
   so the addresses can be selected and copied, the two links
   are real links, and the whole thing is one Tab away whether
   or not a pointer ever touches the card.
   ------------------------------------------------------------ */
const mn      = document.getElementById('mn');
const mnList  = document.getElementById('mn-list');
const mnClose = document.getElementById('mn-close');
let mnFocus = null;

/* built once, from the data, rather than written twice in two places */
MENU.forEach(function(item){
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'mn-row';

  const what = document.createElement('span');
  what.className = 'mn-what';
  what.textContent = item.what;

  const leader = document.createElement('span');
  leader.className = 'mn-leader';
  leader.setAttribute('aria-hidden', 'true');

  /* a line with somewhere to go is an anchor; one without is plain text.
     Nothing here is a button dressed up as a link. */
  const where = document.createElement(item.href ? 'a' : 'span');
  where.className = 'mn-where';
  where.textContent = item.where;
  if(item.href){
    where.href = item.href;
    /* the two profiles open away from the room so the tour survives the
       detour; mail is left to the mail client, which never navigates */
    if(item.href.indexOf('mailto:') !== 0){
      where.target = '_blank';
      where.rel = 'noopener me';
    } else {
      where.rel = 'me';
    }
  }

  row.appendChild(what);
  row.appendChild(leader);
  row.appendChild(where);
  li.appendChild(row);

  if(item.note){
    const note = document.createElement('p');
    note.className = 'mn-note';
    note.textContent = item.note;
    li.appendChild(note);
  }
  mnList.appendChild(li);
});

function openMenu(){
  if(menuOpen) return;
  mnFocus = document.activeElement;
  menuOpen = true;
  mn.classList.add('open');
  mn.setAttribute('aria-hidden', 'false');
  dragging = false;
  dom.style.cursor = 'default';
  mnClose.focus();
}
function closeMenu(){
  if(!menuOpen) return;
  menuOpen = false;
  mn.classList.remove('open');
  mn.setAttribute('aria-hidden', 'true');
  if(mnFocus && mnFocus.focus) mnFocus.focus();
}
mnClose.addEventListener('click', closeMenu);
/* the backdrop closes it; a press on the card itself does not, because the
   card is full of text somebody may well be trying to select */
mn.addEventListener('click', function(e){
  if(e.target === mn) closeMenu();
});

addEventListener('keydown', function(e){
  /* while a photo is open the keyboard belongs to the photo */
  if(openIndex >= 0){
    if(e.key === 'Escape'){ closePhoto(); return; }
    if(e.key === 'ArrowLeft'  || e.key === ',' || e.key === '<'){ stepPhoto(-1); e.preventDefault(); return; }
    if(e.key === 'ArrowRight' || e.key === '.' || e.key === '>'){ stepPhoto( 1); e.preventDefault(); return; }
    return;
  }
  if(menuOpen){
    if(e.key === 'Escape') closeMenu();
    return;
  }
  if(e.key === 'l' || e.key === 'L') toggleLights();
});

/* --- audio: the tap --- */
let actx = null, waterGain = null;
function ensureAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  if(!actx) actx = new AC();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuffer(ctx){
  const n = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
  return buf;
}
function waterSound(on){
  const ctx = ensureAudio(); if(!ctx) return;
  if(!waterGain){
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx); src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.7;
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start();
    waterGain = g;
  }
  waterGain.gain.linearRampToValueAtTime(on ? 0.055 : 0, ctx.currentTime + 0.18);
}
/* ============================================================
   14b. THE TAP BADGES
   A baked room looks exactly as pressable as a photograph, and
   the name tag only turns up once the cursor is already on the
   thing. The fridge door is what this room is for, so one print
   — the one nearest the middle of it — wears the hand, and
   everything else that answers wears the quiet plus. It is also
   the keyboard's only route into a WebGL canvas.
   ============================================================ */
const hints = TapHints.init({
  THREE: THREE, camera: camera,
  /* an opened overlay owns the screen — the badges stand down */
  enabled: function(){ return openIndex < 0 && !menuOpen; }
});

/* the hand sits at the dead centre of the door, not on a print. The badge
   is teaching one thing — "the fridge answers to a press" — and the middle
   of a two-metre steel panel is where the eye already is. It also stops the
   badge covering the very photograph it is pointing at.

   What it opens is whichever print is nearest that centre, worked out from
   the same numbers that place them, so moving a photo in PHOTOS moves the
   badge's answer with it and nobody has to remember an index. */
const FRIDGE_MID_Y = FR.h/2;
let mainPhoto = 0;
PHOTOS.forEach(function(ph, i){
  const d  = ph.x*ph.x + (ph.y - FRIDGE_MID_Y)*(ph.y - FRIDGE_MID_Y);
  const d0 = PHOTOS[mainPhoto].x*PHOTOS[mainPhoto].x +
             (PHOTOS[mainPhoto].y - FRIDGE_MID_Y)*(PHOTOS[mainPhoto].y - FRIDGE_MID_Y);
  if(d < d0) mainPhoto = i;
});

/* only the one. The prints are all the same kind of thing, so a badge on
   each would be thirteen announcements of a single idea. The hand teaches
   the gesture once; the standing hint says the rest. It opens the gallery
   rather than one picture — hence the plural label, which is also the only
   honest thing a badge sitting on bare steel can say. */
hints.add({
  kind: 'tap',
  object: fridge,
  local: [0, FRIDGE_MID_Y, FR.face + 0.08],
  label: 'About Me',
  onActivate: function(){ openPhoto(mainPhoto); }
});

/* off to the right of the spout, not over it. The stream falls at the tap's
   own centre line, so a badge there — and the name tag that drops out of it
   on hover — hid the one thing turning the tap on is for. */
const tapHint = hints.add({
  object: tap, offset: [0.26, 0.10, 0.12],
  label: 'Run the water',
  onActivate: function(){ toggleWater(); }
});

const switchHint = hints.add({
  object: switchPlate, offset: [0, 0, 0.10],
  label: 'Lights off',
  onActivate: function(){ toggleLights(); }
});

/* the two on the worktop. Both badges sit at the foot of the appliance,
   just forward of it on the stone — below the thing rather than above it,
   so the badge never covers the toast coming up or the jug filling, which
   is the whole of what pressing it is for. */
const toastHint = hints.add({
  object: toaster, offset: [0, -0.09, 0.20],
  label: 'Pop the toast',
  onActivate: function(){ toggleToast(); }
});

const blendHint = hints.add({
  object: blender, offset: [0, -0.21, 0.20],
  label: 'Blend a juice',
  onActivate: function(){ toggleBlender(); }
});

/* The menu is the one thing in this kitchen that opens a way to reach me,
   so it wears the pen rather than the plain circle — the drawing is the
   difference between "this answers to a press" and "pressing this gets you
   somewhere to write". It sits just above the fold, clear of the printed
   face so the badge never covers the card it is pointing at. */
const menuHint = hints.add({
  kind: 'write',
  object: menu,
  offset: [0, 0.20, 0.05],
  label: "What's on the menu",
  onActivate: function(){ openMenu(); }
});

/* the badges, the HUD buttons and the room are three handles on one state,
   so the labels are painted from that state in the loop rather than being
   hand-synced by whoever happened to do the toggling */
function paintHints(){
  tapHint.label(waterOn ? 'Turn it off' : 'Run the water');
  switchHint.label(lightsOn ? 'Lights off' : 'Lights on');
  toastHint.label(toastOn ? 'Put it back' : 'Pop the toast');
  blendHint.label(blendOn ? 'Empty the jug' : 'Blend a juice');
}

/* ============================================================
   15. LOOP
   ============================================================ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), lookAt = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  const k = Math.min(1, dt*4.2);

  look.x  += (target.x - look.x)*Math.min(1, dt*3.0);
  look.y  += (target.y - look.y)*Math.min(1, dt*3.0);
  yaw     += (yawT - yaw)*k;
  pitch   += (pitchT - pitch)*k;
  dolly   += (dollyT - dolly)*Math.min(1, dt*3.2);

  /* re-clamp as the dolly moves: pulling back tightens how far you may turn */
  const yl = yawLimit(HOME.z - dollyT);
  yawT = THREE.MathUtils.clamp(yawT, -yl, yl);

  const ey = yaw   - look.x*YAW_DRIFT;         /* the cursor does all the turning: right
                                                 exposes the right of the room, not the left */
  const ep = pitch + look.y*0.022;
  camera.position.set(
    HOME.x + look.x*0.060,
    HOME.y + look.y*0.022 + Math.sin(t*0.42)*0.008,
    HOME.z - dolly
  );
  const cp = Math.cos(ep);
  fwd.set(-Math.sin(ey)*cp, Math.sin(ep), -Math.cos(ey)*cp);
  lookAt.copy(camera.position).addScaledVector(fwd, 8);
  camera.lookAt(lookAt);

  updateHover();
  paintHints();
  hints.update();

  /* the lights come up and go down rather than snapping */
  lightLevel += ((lightsOn ? 1 : 0) - lightLevel) * Math.min(1, dt*4.5);
  const L = lightLevel;
  spots.forEach(function(s){ s.intensity = s.userData.base * (0.03 + 0.97*L); });
  hemi.intensity = 0.11 + 0.19*L;
  throughGap.intensity = 0.30 + 0.10*(1 - L);   /* the gap matters more in the dark */
  M.lens.emissiveIntensity = 0.04 + 1.75*L;
  M.ucLens.emissiveIntensity = 0.03 + 1.55*L;
  ucWashes.forEach(function(w){ w.material.opacity = w.userData.baseOpacity * L; });
  const flick = 1 + Math.sin(t*7.3)*0.006;
  halos.forEach(function(h){ h.material.opacity = 0.34*L*flick; });
  pools.forEach(function(p){ p.material.opacity = p.userData.baseOpacity * L; });

  /* the tap */
  waterLevel += ((waterOn ? 1 : 0) - waterLevel) * Math.min(1, dt*9);
  const st = tap.userData.stream, sp = tap.userData.splash;
  st.visible = waterLevel > 0.02;
  sp.visible = st.visible;
  st.material.opacity = 0.62 * waterLevel;
  st.material.map.offset.y -= dt*5.2;
  sp.material.opacity = (0.30 + Math.sin(t*11)*0.05) * waterLevel;
  sp.scale.setScalar(0.85 + waterLevel*0.25 + Math.sin(t*9)*0.03);
  tap.userData.lever.rotation.x = -0.30 - waterLevel*0.42;

  /* The prints lift towards you on hover and glow very slightly, and every
     one of them lifts once a couple of seconds after arrival — a room where
     nothing looks clickable is the standard way a 3D page fails. */
  const settling = REDUCED ? 0 : Math.max(0, Math.sin((t - 1.0) * Math.PI / 1.30));
  const pulse = (t > 1.0 && t < 2.30) ? settling : 0;
  polaroids.forEach(function(pl){
    const want = (hovered === pl) ? 1 : 0;
    pl.userData.hover += (want - pl.userData.hover) * Math.min(1, dt*7);
    const lift = Math.max(pl.userData.hover, pulse*0.55);
    pl.position.z = pl.userData.baseZ + lift*0.020;
    pl.scale.setScalar(1 + lift*0.045);
    pl.userData.cardMat.emissive.setRGB(lift*0.09, lift*0.085, lift*0.072);
    pl.userData.shadow.material.opacity = 0.34 + lift*0.16;
    pl.userData.shadow.scale.setScalar(1 + lift*0.10);
  });

  /* The menu lifts the way the prints do, and takes the same turn in the
     opening pulse — a card standing on a worktop among five other props is
     exactly the thing a visitor's eye slides straight over. */
  (function(){
    const want = (hovered === menu) ? 1 : 0;
    menu.userData.hover += (want - menu.userData.hover) * Math.min(1, dt*7);
    const lift = Math.max(menu.userData.hover, pulse*0.55);
    menu.position.y = menu.userData.baseY + lift*0.012;
    menu.userData.faceMats.forEach(function(m){
      m.emissive.setRGB(lift*0.075, lift*0.070, lift*0.058);
    });
  })();

  /* the switch rockers tip over with the lights */
  switchPlate.userData.rockers.forEach(function(r){
    r.rotation.x = (0.16 - 0.32*L);
  });

  /* --- the toaster ------------------------------------------------------
     Coming up is a spring and going down is not: real toast is thrown out
     and then lowered by hand. So the rise overshoots and settles, and the
     fall is a plain ease. Both slices ride the same number — a toaster that
     popped one slice before the other would only look broken. */
  toastLevel += ((toastOn ? 1 : 0) - toastLevel) * Math.min(1, dt*(toastOn ? 11 : 7));
  const springT = REDUCED ? toastLevel
                          : toastLevel + Math.sin(toastLevel*Math.PI)*0.16*(toastOn ? 1 : 0);
  toaster.userData.toasts.forEach(function(tt){
    tt.position.y = tt.userData.down + (tt.userData.up - tt.userData.down)*springT;
    /* an unpopped slice is inside a closed steel box: drawing it there only
       risks it poking through the crown on a low camera */
    tt.visible = toastLevel > 0.004;
  });
  const lv = toaster.userData.lever;
  lv.position.y = lv.userData.down + (lv.userData.up - lv.userData.down)*toastLevel;

  /* --- the blender ------------------------------------------------------
     The blades run while the jug is filling and for a moment after, then
     wind down. Filling is slower than emptying for the same reason a jug
     empties faster than it fills. */
  blendLevel += ((blendOn ? 1 : 0) - blendLevel) * Math.min(1, dt*(blendOn ? 2.6 : 4.4));
  const juice = blender.userData.juice;
  juice.visible = blendLevel > 0.004;
  juice.scale.y = Math.max(0.0001, blendLevel);
  /* it spins hardest while the level is actually moving, so the motor reads
     as doing the work rather than as a decoration that never stops */
  const work = Math.abs((blendOn ? 1 : 0) - blendLevel);
  const spinTarget = REDUCED ? 0 : (blendOn ? 6 + work*54 : work*40);
  bladeSpin += (spinTarget - bladeSpin) * Math.min(1, dt*5);
  blender.userData.blades.rotation.y += bladeSpin*dt;
  /* pale and frothy on the way up, then settling to the colour of the fruit.
     It is read through two walls of glass against a white splashback, which
     lifts everything — hence a darker landing point than looks right here. */
  M.juice.color.setHSL(0.072, 0.70 + 0.22*blendLevel, 0.62 - 0.20*blendLevel);
  M.juiceTop.color.setHSL(0.078, 0.64 + 0.24*blendLevel, 0.70 - 0.16*blendLevel);

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  frameCamera();
});

/* Lift on a composited frame rather than on a guessed delay. Two rAFs
   deep, so the first render has actually been painted and not merely
   queued — the veil comes off a finished picture, never a half-built
   one, and it comes off the instant that picture exists. */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  fadeEl.classList.add('hidden');
}); });

})();
</script>
<script src="house-nav.js"></script>
</body>
</html>
