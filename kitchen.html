<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>About Me - Rand Halasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" />
<style>
  :root{
    --ink:#1c1a17;
    --card:#fffdf9;
    --shadow:0 8px 30px rgba(28,22,14,.20);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;margin:0;padding:0;background:#0e0c09;overflow:hidden}
  body{
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* lens pass */
  .lens{position:fixed;inset:0;pointer-events:none;z-index:3}
  #vignette{background:radial-gradient(124% 94% at 50% 46%,
      rgba(0,0,0,0) 42%, rgba(34,28,18,.16) 74%, rgba(20,16,10,.44) 100%);}
  #bloom{background:radial-gradient(58% 46% at 50% 4%, rgba(255,236,205,.20), rgba(255,236,205,0) 62%);
         mix-blend-mode:screen;}
  #grain{opacity:.045;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");}

  /* hud */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .pill{
    position:absolute;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);border:0;color:var(--ink);
    display:flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:.01em;font-family:inherit;
    padding:12px 16px;cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(0)}
  .pill:focus-visible{outline:2px solid #1c1a17;outline-offset:3px}
  .square{padding:12px;width:46px;height:46px;justify-content:center}

  #plaque{top:22px;left:22px;cursor:default}
  #plaque:hover{transform:none}
  #plaque b{font-weight:600}
  #plaque span{color:#8c8375}




  /* the photo, opened */
  #lb{
    position:fixed;inset:0;z-index:8;display:none;cursor:zoom-out;
    align-items:center;justify-content:center;padding:58px 0 52px;
    background:rgba(14,12,9,.84);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;transition:opacity .3s ease;
  }
  #lb.open{display:flex;opacity:1}
  /* Print beside the words, not above them. A square photograph stacked on
     top of a hundred words does not fit a laptop screen at any width you
     pick — narrowing the figure to shorten the image only makes the caption
     taller. Side by side, both fit and it reads better. */
  #lb figure{
    margin:0;background:var(--card);border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    display:flex;gap:24px;padding:18px;cursor:zoom-out;
    width:min(830px, calc(100vw - 160px));
    max-height:100%;overflow:auto;
    transform:translateY(12px) scale(.985);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  #lb.open figure{transform:none}
  /* The print is shown whole. It used to be forced into a square and cropped
     to fill it, which quietly cut the top off a portrait and the sides off a
     landscape. Bounded on both axes instead: a tall photo runs out of height
     first, a wide one runs out of width, and each keeps its own shape. */
  #lb img{display:block;flex:0 1 auto;align-self:flex-start;
          width:auto;height:auto;max-width:50%;max-height:min(56vh,400px);
          object-fit:contain;background:#e9e3d6;border-radius:3px}
  #lb figcaption{flex:1 1 auto;align-self:center;padding:4px 6px 4px 0;
                 font-size:13.5px;line-height:1.62;color:#3c3730}
  #lb-cap{white-space:pre-line}
  #lb figcaption b{display:block;font-size:11.5px;letter-spacing:.17em;
                   text-transform:uppercase;margin-bottom:9px;font-weight:600}
  .lb-nav{
    position:absolute;top:50%;width:52px;height:52px;border-radius:999px;border:0;
    background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
    font-family:inherit;font-size:26px;line-height:1;padding:0 0 4px;
    display:flex;align-items:center;justify-content:center;
    transform:translateY(-50%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  #lb-prev{left:26px}
  #lb-next{right:26px}
  .lb-nav:hover{transform:translateY(-50%) scale(1.07)}
  .lb-nav:focus-visible{outline:2px solid var(--card);outline-offset:4px}
  #lb-count{position:absolute;top:26px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.18em;color:rgba(255,250,240,.55)}
  #lb-hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,250,240,.55);white-space:nowrap}
  /* the tab route to the photos: off-screen until focused, then a normal pill */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  button.sr-only:focus-visible{
    position:fixed;top:22px;left:50%;transform:translateX(-50%);
    width:auto;height:auto;clip:auto;overflow:visible;margin:0;padding:12px 16px;
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    color:var(--ink);font-family:inherit;font-size:14px;border:0;z-index:10;
    outline:2px solid #1c1a17;outline-offset:3px;
  }

  /* ------------------------------------------------------------
     THE MENU, OPENED
     A menu is a list of things you may have, so the contact
     details are laid out as one: the way to reach me on the left,
     the address itself on the right, and a line underneath saying
     what ordering it actually gets you. Every word is real DOM —
     selectable, copyable, and the addresses are real links.
     ------------------------------------------------------------ */
  #mn{
    position:fixed;inset:0;z-index:8;display:none;
    align-items:center;justify-content:center;padding:40px 20px 82px;
    background:rgba(14,12,9,.84);
    -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;transition:opacity .3s ease;
  }
  #mn.open{display:flex;opacity:1}
  /* The card is the one printed thing in the room, so it is set like one:
     Edu NSW ACT Cursive, the hand children are taught to write in New South
     Wales. It draws at roughly the size a sans does, so the sizes below are
     back down near normal — the tracking the sans wanted is still dropped,
     because a joined hand with letter-spacing comes apart. The system scripts
     stay as the fallback, so the card is still legible if the webfont never
     arrives. */
  .mn-card{
    font-family:"Edu NSW ACT Cursive","Snell Roundhand","Apple Chancery",cursive;
    position:relative;background:var(--card);border-radius:6px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    width:min(500px,100%);max-height:100%;overflow:auto;
    padding:40px 42px 34px;
    transform:translateY(12px) scale(.985);
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
  }
  #mn.open .mn-card{transform:none}
  /* the hairline border a printed menu has, inset from the paper edge */
  .mn-card::before{
    content:"";position:absolute;inset:11px;border:1px solid #ded5c1;
    border-radius:3px;pointer-events:none;
  }
  .mn-kicker{
    margin:0 0 4px;font-size:14px;letter-spacing:.04em;
    color:#a09582;
  }
  #mn h2{
    margin:0;font-size:33px;line-height:1.15;font-weight:700;color:var(--ink);
  }
  .mn-lede{margin:6px 0 0;font-size:16px;line-height:1.45;color:#6f675a}
  .mn-list{list-style:none;margin:20px 0 0;padding:0}
  .mn-list li{padding:15px 0;border-top:1px solid #ece5d5}
  .mn-list li:first-child{border-top:0;padding-top:6px}
  .mn-row{display:flex;align-items:baseline;gap:10px}
  .mn-what{
    font-size:17px;letter-spacing:.02em;font-weight:700;
    color:var(--ink);white-space:nowrap;
  }
  /* the dotted leader a printed menu runs across to the price */
  .mn-leader{flex:1 1 auto;height:0;border-bottom:1px dotted #cfc5ae;
             transform:translateY(-4px)}
  .mn-where{font-size:16px;color:#3c3730;text-decoration:none;
            border-bottom:1px solid #c9bfa6;padding-bottom:1px}
  a.mn-where:hover,a.mn-where:focus-visible{color:#1c1a17;border-bottom-color:#1c1a17}
  .mn-note{margin:2px 0 0;font-size:15px;line-height:1.45;color:#7a7264}
  .mn-foot{margin:24px 0 0;font-size:14px;line-height:1.5;color:#8c8375}
  .mn-foot a{color:#3c3730}
  .mn-close{
    position:absolute;top:18px;right:18px;width:34px;height:34px;border:0;
    border-radius:999px;background:transparent;color:#8c8375;cursor:pointer;
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:22px;line-height:1;padding:0 0 3px;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease,color .2s ease;
  }
  .mn-close:hover{background:#f0e9db;color:var(--ink)}
  .mn-close:focus-visible{outline:2px solid #1c1a17;outline-offset:2px}
  @media (max-width:820px){
    #mn{padding:16px 14px 76px}
    .mn-card{padding:30px 24px 26px}
    #mn h2{font-size:27px}
    /* the leader is the first thing to go: a long address wrapped onto a
       second line beats an address squeezed into forty pixels */
    .mn-row{flex-wrap:wrap;gap:4px 10px}
    .mn-leader{display:none}
    .mn-where{white-space:normal;overflow-wrap:anywhere}
  }

  #fade{position:fixed;inset:0;background:#0e0c09;z-index:9;
        transition:opacity .45s ease;pointer-events:none}
  #fade.hidden{opacity:0}

  @media (max-width:820px){
    #plaque{top:14px;left:14px;font-size:13px}
    #lb figure{flex-direction:column;gap:0;padding:14px;
               width:min(calc(100vw - 28px), calc(100vh - 330px))}
    #lb img{flex:none;width:auto;max-width:100%;max-height:44vh;margin:0 auto}
    #lb figcaption{align-self:stretch;padding:15px 2px 4px;font-size:13px}
    .lb-nav{top:auto;bottom:20px;transform:none;width:46px;height:46px}
    .lb-nav:hover{transform:scale(1.07)}
    #lb-prev{left:calc(50% - 62px)}
    #lb-next{right:calc(50% - 62px)}
    #lb-hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
<!-- three.js is same-origin and immutable now, so this is a cache hit on
     every room after the first. The hint just makes the parser ask for
     it at the top of the document rather than fifty lines further down. -->
<link rel="preload" as="script" href="vendor/three.r128.min.js">
<!-- the whole house's pictures, started before anything else asks for them -->
<script src="preload.js"></script>
</head>
<body>

<div id="stage"></div>
<div class="lens" id="vignette"></div>
<div class="lens" id="bloom"></div>
<div class="lens" id="grain"></div>

<div class="hud">
  <div class="pill" id="plaque">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18"/><path d="M9.4 7.6v2.6"/><path d="M14.6 7.6v2.6"/>
    </svg>
    <b>About me</b>
  </div>


  <div id="photo-links"></div>

</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
  <button class="lb-nav" id="lb-prev" aria-label="Previous photo">&lsaquo;</button>
  <figure>
    <img id="lb-img" alt="" crossorigin="anonymous" />
    <figcaption><b id="lb-title"></b><span id="lb-cap"></span></figcaption>
  </figure>
  <button class="lb-nav" id="lb-next" aria-label="Next photo">&rsaquo;</button>
  <div id="lb-count" aria-hidden="true"></div>
  <div id="lb-hint">Click anywhere to close &middot; &larr; &rarr; to browse</div>
</div>

<div id="mn" role="dialog" aria-modal="true" aria-labelledby="mn-title" aria-hidden="true">
  <div class="mn-card">
    <button class="mn-close" id="mn-close" aria-label="Close the menu">&times;</button>
    <p class="mn-kicker">Rand &middot; the counter</p>
    <h2 id="mn-title">What&rsquo;s on the menu</h2>
    <p class="mn-lede">Everything below is served all day. Order whichever suits.</p>
    <ul class="mn-list" id="mn-list"></ul>
    <p class="mn-foot">Prefer it without the room? <a href="contact.html">The contact
    page</a> has the same list, flat.</p>
  </div>
</div>

<div id="fade"></div>

<script src="vendor/three.r128.min.js"></script>
<script src="tap-hints.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE) return;

/* ============================================================
   0. HUD
   ============================================================ */
const fadeEl = document.getElementById('fade');

/* ============================================================
   1. PALETTE
   ============================================================ */
/*  >>> EVERY COLOUR IN THE ROOM IS SET HERE. Edit a hex, reload. <<< */
const P = {
  wall:      '#efe7d6',   // plaster above the tiling
  ceiling:   '#f8f4ea',
  trim:      '#e7dfcc',   // cornice, skirting, the casing round the opening

  cabinet:   '#4a615c',   // door and drawer fronts
  cabRail:   '#435853',   // the shaker frame proud of the panel
  carcass:   '#2c3a37',   // cabinet box behind the fronts — barely seen
  toe:       '#25302e',   // recessed kick under the base run

  counter:   '#e3ddce',   // stone worktop
  tile:      '#ece5d5',   // splashback tile
  grout:     '#cdc4af',

  floor:     '#a8825a',   // oak boards

  steel:     '#c6cace',   // fridge, sink, tap
  steelDark: '#93989e',
  brass:     '#c6a463',   // pulls and knobs
  glow:      '#ffeccd'    // what the ceiling fittings throw
};

/* ============================================================
   1b. THE PHOTOS ON THE FRIDGE
   ------------------------------------------------------------
   >>> THE ONLY PLACE TO EDIT THE PHOTOS. <<<

   Drop an image next to this file, put its path in `src`, and it
   appears both on the fridge and in the opened view. Leave `src`
   empty and a tinted placeholder stands in for it, so the room
   works before the photographs exist.

     name    the label on hover, and the heading when opened
     magnet  disc | star | heart | hexagon | flower | triangle |
             diamond | square | oval | ring | pill | moon | drop
             — every print gets its own shape, in its own colour
     colour  the magnet, and the tint of the placeholder
     ar      the photograph's own aspect, width divided by height
             (a 4032x3024 frame is 1.333). The print is cut to the
             picture, never the picture to the print, so nothing is
             ever cropped or squashed. Getting it wrong is not fatal:
             the real ratio is read off the file once it loads and
             the print re-cuts itself. It only decides the size the
             print is built at, before the image arrives.
     x, y    metres on the fridge door. x is measured from the
             centre seam, y up from the floor. The doors run
             roughly x -0.89..0.89 and y 0.05..2.37, and the two
             handles occupy the band around x = +/-0.08.
     tilt    degrees. Nothing on a fridge door is ever straight.

   The captions below are placeholders in roughly the right voice
   and roughly the right length. Replace them.
   ============================================================ */
const PHOTOS = [
  { name:'Food', magnet:'disc', colour:'#e2673f', src:'/images/fridge/food.jpg',
    ar:0.871, x:-0.66, y:2.14, tilt:-9,
    caption:"I'm not the first to say it but I'll be one to emphasise it: food is amazing. The dopamine from a good bite, the smiles and laughter from good company, and the whole experience of sharing a delicious meal with the people you love is one of the greatest things. If I had to eat 3 cuisines for the rest of my life, I'll have to go with Arabic, Chinese, and Italian. But still, I'll struggle to live without K-BBQ, pho, sushi, and a juicy mushroom Swiss burger 🤤. Anyways, I'll stop now before I get hungry again…" },

  { name:'Karaz', magnet:'heart', colour:'#c4456b', src:'/images/fridge/rand_and_karaz.jpg',
    ar:1.333, x:-0.69, y:1.62, tilt:7,
    caption:"Let me introduce you to my dog, Karaz. Karaz is a proud pug with the confidence of a German Shepherd, audacity of a Chihuahua, and the stomach of a competitive eater. Take Karaz to an all-you-can-eat and she <i>will</i> all-you-can-eat. Put Karaz in front of a bigger dog and she will try to overtake them (underdog? I veto her proving the theory right). Tell Karaz not to go somewhere, and she will test your rule to the absolute limit. Nonetheless, all this comes with being a funny dog with a big personality and even bigger menacing tendencies." },

  { name:'BodyPump', magnet:'star', colour:'#e8b33c', src:'/images/fridge/bodypump.jpg',
    ar:0.750, x:-0.30, y:1.28, tilt:-13,
    caption:"I love challenging myself through fitness. In March 2025, my friend took me to my first ever Les Mills BodyPump class. I enjoyed going to the classes but was looking for more. Therefore, I signed up to become a certified BodyPump instructor in August and got my certification at the end of November. My journey to get certified introduced me to more than new choreography, music, and public speaking opportunities. Training 2+ hours a day for months taught me to keep going through my own self-doubt, and that no matter what, my squats can always <i>always</i> be deeper and my core more braced." },

  { name:'Brisbane Marathon 2026', magnet:'ring', colour:'#c43a35', src:'images/fridge/brisbane_marathon.jpg',
    ar:1.333, x:0.32, y:2.11, tilt:8,
    caption:"After my BodyPump certification, I started looking for my next fitness challenge. In December, I watched a YouTube video of a girl running a marathon for the first time, which planted the seed that this could be something I attempt, too. I juggled the thought for a month, and in January, I bought my entry to the Brisbane Marathon 2026! \nIf getting a BodyPump certificate was difficult, then the marathon was a whole other beast. My average week for 6 months looked like this: running for 20 hours, working 3 days, attending university full time, and building my thesis project. Despite everything, the motto remained one foot in front of the other, and go go go! Running the marathon was a joy like no other. All the weeks of training, the nights of doubting if I'll even be able to finish, and the Strava updates were so worth it 🫶." },

  { name:'Nature', magnet:'flower', colour:'#7da33f', src:'images/fridge/nature.JPG',
    ar:1.333, x:0.66, y:1.19, tilt:11,
    caption:"Nature is beautiful in its variety and diversity. I grew up in Jordan, where nature's beauty is displayed in the vast desert, the Dead Sea, the Red Sea, the greenery of the North and the history of Petra and Jerash. Coming to Australia, I was stunned by its endless greenery and generous bodies of water. It's fascinating how much your environment shapes your hobbies. Since coming here, I've been loving camping, swimming at the beach, and even fishing." },

  { name:'Projects', magnet:'square', colour:'#4a80c4', src:'images/fridge/peojects.jpg',
    ar:0.750, x:-0.29, y:1.82, tilt:12,
    caption:"My brain races with thoughts day to day, and since I have an embarrassingly high screen time, a lot of them tend to revolve around digital solutions. It's hard to categorise my thoughts, but building a small prototype lets me explore them. Most of these projects never saw the light of day; an unfinished project here, a bad idea there, but they've all taught me something about validating an idea, coding, prompting, and tooling. Take this portfolio. I'd never touched 3D rendering before, and half of building it was learning what Three.js even does. Building keeps the momentum going too. It's one thing to read about 3D rendering, another to spend a weekend fighting with it. Finally, I love the feedback I receive from the people around me when I build, whether it's impressed comments or laughter." },

  { name:'Claw machines', magnet:'diamond', colour:'#9c59a8', src:'/images/fridge/claw_machine.jpg',
    ar:0.750, x:0.71, y:1.85, tilt:-12,
    caption:"Claw machines and I have a love-hate relationship. So far, I've won 5 plushies from a claw machine, but have attempted much more. The photo on the side is me, very defeated, a few attempts before winning the plushie in the photo. After reflection, I've realised what I like is the feeling of winning (who doesn't), and what keeps me coming back is being <i>so close</i> to getting what I want." },

  { name:'Friends', magnet:'hexagon', colour:'#3f8f8a', src:'/images/fridge/friends.jpeg',
    ar:1.500, x:0.31, y:1.58, tilt:-6,
    caption:"Building community wherever you go is so important, and I'm grateful to have a tight knit group of friends who transformed Sydney from another city on the map to a place I've been calling home for the past 4 years. We've gone through university together, nights out, lunches, brunches, and much more. It's always funny to hear someone say that my friends and I sound similar, as it attests to how close we are. They're driven, motivated, funny, kind, generous, and inspire me to be better everyday." },

  { name:'Family', magnet:'moon', colour:'#32557f', src:'/images/fridge/family.jpg',
    ar:1.333, x:-0.70, y:1.00, tilt:-5,
    caption:"If friends are family, then family is family². My family is massive, with roughly 50 cousins from my mom's side. Growing up with a large family means growing up with a lot of love, laughter, and a very strong sense of community and belonging. Some live in Jordan, some abroad; some I see often, some every few years. No matter the distance, though, I always know I have a community that has my back and always wants what's best for me because we grow together even when apart." }
];


/* ============================================================
   1c. THE MENU ON THE COUNTER
   ------------------------------------------------------------
   >>> THE ONLY PLACE TO EDIT THE CONTACT DETAILS. <<<

   The card standing on the worktop opens this. It is a menu, so
   it is written as one: what you are ordering, where it goes,
   and a line saying what ordering it actually gets you.

     what   the course. Keep it to a word
     where  what the visitor reads — the address, not a URL
     href   where it goes. Leave it empty for a line that is
            information rather than a link
     note   the description under it, in the voice of the room

   These are the same details as contact.html. If the two ever
   disagree, contact.html is the one that is right.
   ============================================================ */
const MENU = [
  { what:  'Email',
    where: 'hello@randhalasa.com',
    href:  'mailto:hello@randhalasa.com',
    note:  'The house special. Comes with a reply, usually inside a day.' },

  { what:  'GitHub',
    where: 'github.com/raaannndddd',
    href:  'https://github.com/raaannndddd',
    note:  'Everything I have actually built, served plain and unseasoned.' },

  { what:  'LinkedIn',
    where: 'linkedin.com/in/randhalasa',
    href:  'https://linkedin.com/in/randhalasa',
    note:  'The formal version, for the people who need one.' }
];

/* ============================================================
   2. RENDERER / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e1d1');

/* room shell — these five numbers drive every wall and every run of units */
/* SIDE_X is wider than the shot needs on purpose. The camera is pinned to
   the back wall, and the only thing that can spoil that shot is a side wall
   creeping into frame — so the run of joinery carries on past both edges
   rather than ending where the picture ends. */
const BACK_Z = -5.5, FRONT_Z = 5.0, SIDE_X = 5.2, WALL_H = 3.05, WALL_T = 0.16;
const OPEN_Z0 = -3.8, OPEN_Z1 = 0.8, OPEN_H = 2.55;   // the gap in the right wall
/* The visitor arrives standing a little over four metres off the fridge,
   square to the back wall. Everything below exists to keep them there. */
const HOME = new THREE.Vector3(0, 1.58, 2.15);

const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.05, 120);
camera.position.copy(HOME);

/* A tighter lens than the old 29°. Two reasons: a long lens flatters an
   interior seen this close, and every degree of frame is a degree the
   visitor cannot be allowed to turn before the side walls show. */
const H_HALF = 26 * Math.PI/180;
let hHalf = H_HALF;                              /* what we actually got */
function frameCamera(){
  camera.aspect = innerWidth / innerHeight;
  const v = 2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180/Math.PI;
  camera.fov = THREE.MathUtils.clamp(v, 26, 58);
  camera.updateProjectionMatrix();
  /* the clamp above can widen the frame past H_HALF on a very wide window,
     so read the real half-angle back rather than assuming it */
  hHalf = Math.atan(Math.tan(camera.fov*Math.PI/360) * camera.aspect);
}
frameCamera();

/* How far the visitor may turn before a side wall creeps into the frame.
   Solved from the actual frustum each frame, so it holds at any aspect
   ratio and at any point along the dolly. */
/* The whole range the visitor gets. The view no longer answers to a held
   press, so this lean towards the cursor is the only way to look down the
   room — but it stays small, or simply passing the mouse over the fridge
   slides the highlight across it. */
const YAW_DRIFT = 0.055;
function yawLimit(z){
  const depth = Math.max(0.6, z - BACK_Z);
  const edge  = Math.atan(SIDE_X / depth) - hHalf - YAW_DRIFT;
  return THREE.MathUtils.clamp(edge, 0.03, 0.16);
}

/* ============================================================
   3. TEXTURE FOUNDRY — every surface is drawn to a canvas at load
   ============================================================ */
function cvs(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = ANISO;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
function shift(hex, dL, dS){
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, THREE.MathUtils.clamp(hsl.s + (dS||0), 0, 1),
                  THREE.MathUtils.clamp(hsl.l + dL, 0.02, 0.98));
  return '#' + c.getHexString();
}
function rgba(hex, a){
  const c = new THREE.Color(hex);
  return 'rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + a + ')';
}
function blotch(g, w, h, base, count, spread, alpha){
  for(let i=0;i<count;i++){
    const x = Math.random()*w, y = Math.random()*h;
    const r = (0.04 + Math.random()*0.22) * Math.max(w,h) * spread;
    const c = shift(base, (Math.random()-0.5)*0.10, (Math.random()-0.5)*0.06);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, rgba(c, alpha));
    grd.addColorStop(1, rgba(c, 0));
    g.fillStyle = grd; g.fillRect(x-r, y-r, r*2, r*2);
  }
}
function speckle(g, w, h, count, alpha){
  for(let i=0;i<count;i++){
    g.fillStyle = 'rgba(52,44,30,' + (Math.random()*alpha).toFixed(3) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 1.6, 1.1);
  }
}
/* linear black gradient, used to bake occlusion into a map */
function ao(g, w, h, x0,y0,x1,y1, a){
  const d = g.createLinearGradient(x0,y0,x1,y1);
  d.addColorStop(0, 'rgba(44,34,20,' + a + ')');
  d.addColorStop(1, 'rgba(44,34,20,0)');
  g.fillStyle = d; g.fillRect(0,0,w,h);
}

function plasterCanvas(w, h, o){
  o = o || {};
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.wall; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.wall, 90, 1.0, 0.5);
  blotch(g, w, h, shift(P.wall,-0.05), 40, 0.5, 0.28);
  g.globalAlpha = 0.032; g.lineCap = 'round';
  for(let i=0;i<64;i++){                                   /* trowel drag */
    g.strokeStyle = shift(P.wall, (Math.random()-0.5)*0.14);
    g.lineWidth = 2 + Math.random()*14;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y);
    g.lineTo(x + (Math.random()-0.5)*w*0.28, y + (Math.random()-0.5)*h*0.12); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, Math.round(w*h/1000), 0.04);
  if(o.bottom) ao(g, w, h, 0, h, 0, h*(1-o.bottom), 0.30);
  if(o.top)    ao(g, w, h, 0, 0, 0, h*o.top, 0.16);
  return c;
}

/* painted joinery: primer showing through a laid-off brush coat */
function paintCanvas(w, h, color){
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0,0,w,h);
  blotch(g, w, h, color, 24, 0.9, 0.14);
  speckle(g, w, h, Math.round(w*h/900), 0.028);
  g.lineCap = 'round';
  /* laid off with the grain — just enough to break the flat fill, never striped */
  for(let i=0, n=Math.max(46, Math.round(w*h/2800)); i<n; i++){
    g.strokeStyle = shift(color, (Math.random()-0.5)*0.032);
    g.globalAlpha = 0.09 + Math.random()*0.14;
    g.lineWidth = 5 + Math.random()*18;
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(-10, y);
    g.bezierCurveTo(w*0.3, y+(Math.random()-0.5)*5, w*0.7, y+(Math.random()-0.5)*5, w+10, y+(Math.random()-0.5)*4);
    g.stroke();
  }
  g.globalAlpha = 1;
  return c;
}

/* wide oak boards, laid across the run */
function floorCanvas(){
  const w = 1024, h = 1024, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.floor; g.fillRect(0,0,w,h);
  const boards = 6, bh = h/boards;
  for(let b=0;b<boards;b++){
    const y0 = b*bh;
    const tone = shift(P.floor, (Math.random()-0.5)*0.075, (Math.random()-0.5)*0.05);
    g.fillStyle = tone; g.fillRect(0, y0, w, bh);
    /* grain */
    for(let i=0;i<90;i++){
      g.strokeStyle = shift(tone, (Math.random()-0.55)*0.14);
      g.globalAlpha = 0.10 + Math.random()*0.28;
      g.lineWidth = 0.6 + Math.random()*2.6;
      const y = y0 + Math.random()*bh;
      g.beginPath(); g.moveTo(0,y);
      g.bezierCurveTo(w*0.3, y+(Math.random()-0.5)*16, w*0.7, y+(Math.random()-0.5)*16, w, y+(Math.random()-0.5)*9);
      g.stroke();
    }
    /* the odd knot */
    if(Math.random() < 0.55){
      const kx = Math.random()*w, ky = y0 + bh*(0.25+Math.random()*0.5), kr = 5+Math.random()*9;
      g.globalAlpha = 0.5;
      for(let r=kr;r>0;r-=1.6){
        g.strokeStyle = shift(tone, -0.10 - r*0.004);
        g.lineWidth = 1.2;
        g.beginPath(); g.ellipse(kx, ky, r, r*0.55, 0, 0, Math.PI*2); g.stroke();
      }
    }
    g.globalAlpha = 1;
    /* board seam + the shadow that falls into it */
    g.fillStyle = 'rgba(40,26,14,0.34)'; g.fillRect(0, y0, w, 1.6);
    g.fillStyle = 'rgba(255,240,214,0.10)'; g.fillRect(0, y0+1.6, w, 1.2);
    /* butt joints */
    const jx = Math.random()*w;
    g.fillStyle = 'rgba(40,26,14,0.30)'; g.fillRect(jx, y0, 1.5, bh);
  }
  speckle(g, w, h, 2600, 0.05);
  return c;
}

/* honed stone: pale field, fine grit, a couple of lazy veins */
function stoneCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.counter; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.counter, 44, 0.9, 0.35);
  for(let i=0;i<5;i++){
    g.strokeStyle = 'rgba(120,112,96,' + (0.06+Math.random()*0.09).toFixed(3) + ')';
    g.lineWidth = 1 + Math.random()*4;
    let x = Math.random()*w, y = -10;
    g.beginPath(); g.moveTo(x,y);
    while(y < h+10){ x += (Math.random()-0.5)*70; y += 26+Math.random()*40; g.lineTo(x,y); }
    g.stroke();
  }
  for(let i=0;i<5000;i++){
    g.fillStyle = Math.random()<0.5 ? 'rgba(96,90,78,0.16)' : 'rgba(255,252,244,0.20)';
    g.fillRect(Math.random()*w, Math.random()*h, 1.4, 1.4);
  }
  return c;
}

/* stacked splashback tile */
function tileCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.grout; g.fillRect(0,0,w,h);
  const cols = 4, rows = 8, tw = w/cols, th = h/rows, gap = 3.2;
  for(let r=0;r<rows;r++){
    const off = (r%2) ? tw/2 : 0;
    for(let i=-1;i<=cols;i++){
      const x = i*tw + off, y = r*th;
      const base = shift(P.tile, (Math.random()-0.5)*0.045, (Math.random()-0.5)*0.03);
      g.fillStyle = base;
      g.fillRect(x+gap, y+gap, tw-gap*2, th-gap*2);
      /* glaze: light off the top edge, a pool at the bottom */
      const grd = g.createLinearGradient(x, y, x, y+th);
      grd.addColorStop(0, 'rgba(255,255,255,0.30)');
      grd.addColorStop(0.45,'rgba(255,255,255,0.02)');
      grd.addColorStop(1, 'rgba(70,62,48,0.10)');
      g.fillStyle = grd; g.fillRect(x+gap, y+gap, tw-gap*2, th-gap*2);
    }
  }
  speckle(g, w, h, 1400, 0.035);
  return c;
}

/* brushed stainless
   ------------------------------------------------------------
   The grain here is deliberately coarser and softer than real
   brushed steel. Fine, high-contrast strokes on a near-mirror
   metal alias into crawling static the moment the camera moves —
   the noise lands under a pixel and swims. Wide, blurred strokes
   with a shallow tonal range read as brushed at arm's length and
   stay dead still while you look around. */
function steelCanvas(base){
  base = base || P.steel;
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);

  const canBlur = (function(){ try{ g.filter = 'blur(1px)'; return g.filter !== 'none'; }
                               catch(e){ return false; } })();
  if(canBlur) g.filter = 'blur(2px)';
  for(let i=0;i<420;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.05);
    g.globalAlpha = 0.05 + Math.random()*0.06;
    g.lineWidth = 4 + Math.random()*11;
    const x = Math.random()*w;
    g.beginPath(); g.moveTo(x, -24); g.lineTo(x + (Math.random()-0.5)*7, h+24); g.stroke();
  }
  if(canBlur) g.filter = 'none';
  g.globalAlpha = 1;

  /* broad sheen across the door — kept low-contrast so it never bands */
  const grd = g.createLinearGradient(0,0,w,0);
  grd.addColorStop(0,   'rgba(255,255,255,0.10)');
  grd.addColorStop(0.22,'rgba(30,36,44,0.07)');
  grd.addColorStop(0.48,'rgba(255,255,255,0.15)');
  grd.addColorStop(0.72,'rgba(30,36,44,0.05)');
  grd.addColorStop(1,   'rgba(255,255,255,0.07)');
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  /* the ceiling, seen faintly in the door */
  const vert = g.createLinearGradient(0,0,0,h);
  vert.addColorStop(0,   'rgba(255,255,255,0.14)');
  vert.addColorStop(0.32,'rgba(255,255,255,0.02)');
  vert.addColorStop(0.84,'rgba(26,30,36,0.06)');
  vert.addColorStop(1,   'rgba(26,30,36,0.13)');
  g.fillStyle = vert; g.fillRect(0,0,w,h);
  return c;
}

/* the roughness map: same coarse grain, and a narrow band of values.
   A wide roughness swing on metal is what produces specular fireflies. */
function steelRoughCanvas(){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = '#727272'; g.fillRect(0,0,w,h);
  const canBlur = (function(){ try{ g.filter = 'blur(1px)'; return g.filter !== 'none'; }
                               catch(e){ return false; } })();
  if(canBlur) g.filter = 'blur(2.5px)';
  for(let i=0;i<220;i++){
    const v = 98 + Math.round(Math.random()*44);
    g.strokeStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    g.globalAlpha = 0.4;
    g.lineWidth = 5 + Math.random()*14;
    const x = Math.random()*w;
    g.beginPath(); g.moveTo(x,-24); g.lineTo(x + (Math.random()-0.5)*6, h+24); g.stroke();
  }
  if(canBlur) g.filter = 'none';
  g.globalAlpha = 1;
  return c;
}

/* The fridge doors get their own map, and it contains no noise at all.
   Per-pixel grain on a panel this large and this reflective lands under a
   pixel and crawls — that is the static. What actually reads as stainless
   at this size is the gradient: bright where the ceiling falls in it, dark
   where the floor does, and one broad highlight down the face. */
function steelPanelCanvas(base){
  const w = 256, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  const vert = g.createLinearGradient(0,0,0,h);        /* the room, reflected */
  vert.addColorStop(0,    'rgba(255,255,255,0.30)');
  vert.addColorStop(0.15, 'rgba(255,255,255,0.11)');
  vert.addColorStop(0.50, 'rgba(255,255,255,0.00)');
  vert.addColorStop(0.86, 'rgba(24,28,34,0.13)');
  vert.addColorStop(1,    'rgba(24,28,34,0.27)');
  g.fillStyle = vert; g.fillRect(0,0,w,h);
  /* The metallic read comes from here: two broad highlights running the
     height of the panel with dark between them. Wide gradients, so there
     is nothing small enough to alias — it stays put as the camera moves. */
  const sheen = g.createLinearGradient(0,0,w,0);
  sheen.addColorStop(0,    'rgba(16,22,30,0.30)');
  sheen.addColorStop(0.07, 'rgba(16,22,30,0.10)');
  sheen.addColorStop(0.20, 'rgba(255,255,255,0.42)');   /* the near highlight */
  sheen.addColorStop(0.32, 'rgba(255,255,255,0.10)');
  sheen.addColorStop(0.46, 'rgba(16,22,30,0.16)');      /* the trough between */
  sheen.addColorStop(0.62, 'rgba(255,255,255,0.16)');
  sheen.addColorStop(0.72, 'rgba(255,255,255,0.30)');   /* the far highlight */
  sheen.addColorStop(0.86, 'rgba(16,22,30,0.12)');
  sheen.addColorStop(1,    'rgba(16,22,30,0.32)');
  g.fillStyle = sheen; g.fillRect(0,0,w,h);
  return c;
}

/* matte enamel for small appliance bodies */
function enamelCanvas(base){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 14, 0.9, 0.10);
  speckle(g, w, h, 260, 0.02);
  return c;
}

/* end-grain beech for the board and the spoon handles */
function woodCanvas(){
  const base = '#9a6b42';
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 16, 0.9, 0.18);
  g.lineCap = 'round';
  for(let i=0;i<70;i++){
    g.strokeStyle = shift(base, (Math.random()-0.55)*0.16);
    g.globalAlpha = 0.12 + Math.random()*0.25;
    g.lineWidth = 0.8 + Math.random()*2.2;
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(0,y);
    g.bezierCurveTo(w*0.3, y+(Math.random()-0.5)*10, w*0.7, y+(Math.random()-0.5)*10, w, y+(Math.random()-0.5)*6);
    g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 500, 0.04);
  return c;
}

/* a waffle-weave tea towel: cream, with a stripe near each end */
function towelCanvas(){
  const w = 128, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = '#f0ebdd'; g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){
    g.fillStyle = 'rgba(120,110,90,' + (0.03 + Math.random()*0.05).toFixed(3) + ')';
    g.fillRect(0, y, w, 1);
  }
  [[18,'#a75c40'],[32,'#4a615c'],[h-38,'#4a615c'],[h-24,'#a75c40']].forEach(function(s){
    g.globalAlpha = 0.85; g.fillStyle = s[1];
    g.fillRect(0, s[0], w, 6);
  });
  g.globalAlpha = 1;
  speckle(g, w, h, 300, 0.03);
  return c;
}

/* the flat-weave runner in front of the sink. Drawn on a transparent
   ground so the fringe can poke past the pile; the mesh discards the
   clear pixels with alphaTest rather than blending them. */
function rugCanvas(){
  const w = 512, h = 288, c = cvs(w,h), g = c.getContext('2d');
  const mx = 30, my = 12, x0 = mx, y0 = my, x1 = w - mx, y1 = h - my;
  function pileEdge(){
    const r = 10;
    g.beginPath();
    g.moveTo(x0 + r, y0);
    g.lineTo(x1 - r, y0); g.quadraticCurveTo(x1, y0, x1, y0 + r);
    g.lineTo(x1, y1 - r); g.quadraticCurveTo(x1, y1, x1 - r, y1);
    g.lineTo(x0 + r, y1); g.quadraticCurveTo(x0, y1, x0, y1 - r);
    g.lineTo(x0, y0 + r); g.quadraticCurveTo(x0, y0, x0 + r, y0);
    g.closePath();
  }
  /* fringe first, so the pile lies over its roots */
  g.strokeStyle = '#cfc3a6'; g.lineWidth = 2.4; g.lineCap = 'round';
  [[x0, -1], [x1, 1]].forEach(function(end){
    for(let i=0;i<34;i++){
      const y = y0 + 4 + (i/33)*(y1 - y0 - 8);
      g.globalAlpha = 0.7 + Math.random()*0.3;
      g.beginPath(); g.moveTo(end[0], y);
      g.lineTo(end[0] + end[1]*(15 + Math.random()*10), y + (Math.random()-0.5)*5);
      g.stroke();
    }
  });
  g.globalAlpha = 1;
  /* the pile */
  pileEdge();
  g.fillStyle = '#d9cdb0'; g.fill();
  g.save(); pileEdge(); g.clip();
  /* banded ends, in the room's own colours */
  [[0, 14, '#a75c40'], [22, 9, '#4a615c'], [38, 5, '#8a8062']].forEach(function(b){
    g.globalAlpha = 0.9; g.fillStyle = b[2];
    g.fillRect(x0 + b[0], y0, b[1], y1 - y0);
    g.fillRect(x1 - b[0] - b[1], y0, b[1], y1 - y0);
  });
  /* a faint repeat across the field */
  g.globalAlpha = 0.12; g.fillStyle = '#a75c40';
  for(let x = x0 + 74; x < x1 - 74; x += 46) g.fillRect(x, y0, 10, y1 - y0);
  g.globalAlpha = 1;
  /* the weave itself, running across the width */
  for(let y = y0; y < y1; y += 3){
    g.fillStyle = 'rgba(70,58,40,' + (0.04 + Math.random()*0.06).toFixed(3) + ')';
    g.fillRect(x0, y, x1 - x0, 1.4);
  }
  speckle(g, w, h, 700, 0.05);
  g.restore();
  g.strokeStyle = 'rgba(60,48,30,0.35)'; g.lineWidth = 3;
  pileEdge(); g.stroke();
  return c;
}

function radialCanvas(inner, mid){
  const s = 256, c = cvs(s,s), g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0, 'rgba(255,255,255,' + inner + ')');
  grd.addColorStop(mid || 0.42, 'rgba(255,255,255,' + (inner*0.42) + ')');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,s,s);
  return c;
}

/* a one-way fade, used for both the wash under a cabinet and the
   occlusion that should sit in the same place */
function washCanvas(){
  const w = 8, h = 128, c = cvs(w,h), g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,    'rgba(255,255,255,1)');
  grd.addColorStop(0.28, 'rgba(255,255,255,0.52)');
  grd.addColorStop(0.62, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1,    'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  return c;
}

/* what you see through the opening: the garden at the side of the house —
   sky down to a hedge and lawn, so the gap reads as a real outdoors.
   this side of the house gets the cloudless day: a deep clear blue that
   thins to haze at the ground, and a flower border running the hedge foot */
function beyondCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,h*0.55);
  grd.addColorStop(0,    '#5893cc');
  grd.addColorStop(0.45, '#8fb9de');
  grd.addColorStop(0.80, '#cfe1ee');
  grd.addColorStop(1,    '#ece8d4');
  g.fillStyle = grd; g.fillRect(0,0,w,h*0.55);
  /* a far tree line, blued by distance — crowns packed shoulder to
     shoulder over a solid base band, so it reads as woodland not bubbles */
  g.fillStyle = 'rgba(139,168,135,0.8)';
  g.fillRect(0, h*0.515, w, h*0.04);
  g.globalAlpha = 0.8;
  for(let i=0;i<40;i++){
    const tx = (i + Math.random()*0.8)*w/40, ty = h*(0.512 + Math.random()*0.012), tr = 5 + Math.random()*8;
    g.fillStyle = shift('#8ba887', 0.03 - Math.random()*0.07, -0.10);
    g.beginPath(); g.arc(tx, ty, tr, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  /* a far ridge of ground */
  g.fillStyle = '#9db584';
  g.beginPath(); g.moveTo(0, h*0.545);
  g.quadraticCurveTo(w*0.3, h*0.505, w*0.6, h*0.535);
  g.quadraticCurveTo(w*0.85, h*0.555, w, h*0.52);
  g.lineTo(w, h*0.60); g.lineTo(0, h*0.60); g.closePath(); g.fill();
  /* the hedge, its clipped top broken by hand */
  g.beginPath(); g.moveTo(0, h*0.72);
  for(let x=0; x<=w; x+=24)
    g.lineTo(x, h*0.575 + Math.sin(x*0.05)*5 + (Math.random()-0.5)*7);
  g.lineTo(w, h*0.72); g.closePath();
  const hg = g.createLinearGradient(0, h*0.56, 0, h*0.72);
  hg.addColorStop(0, '#6b8a4c'); hg.addColorStop(1, '#42592f');
  g.fillStyle = hg; g.fill();
  /* leaf speckle so the hedge face reads as foliage, not felt */
  g.save();
  g.beginPath(); g.rect(0, h*0.56, w, h*0.16); g.clip();
  for(let i=0;i<260;i++){
    const lx = Math.random()*w, ly = h*(0.58 + Math.random()*0.13);
    g.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '126,162,90' : '58,80,44') + ',0.5)';
    g.beginPath(); g.arc(lx, ly, 1.5 + Math.random()*2.5, 0, Math.PI*2); g.fill();
  }
  g.restore();
  /* the lawn running to the foot of the canvas */
  const lg = g.createLinearGradient(0, h*0.70, 0, h);
  lg.addColorStop(0, '#a9bd78'); lg.addColorStop(1, '#7c9955');
  g.fillStyle = lg; g.fillRect(0, h*0.70, w, h*0.30);
  g.globalAlpha = 0.25;
  for(let i=0;i<420;i++){
    g.strokeStyle = shift('#8aa763', (Math.random()-0.5)*0.2);
    g.lineWidth = 1.4;
    const x = Math.random()*w, y = h*0.72 + Math.random()*h*0.28;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*4, y-4-Math.random()*7); g.stroke();
  }
  g.globalAlpha = 1;
  /* the border at the hedge foot: white daisies, marigolds, one or two
     poppies — kitchen-garden colours, nothing the sage would argue with */
  for(let i=0;i<30;i++){
    const x = Math.random()*w, y = h*(0.715 + Math.random()*0.045);
    const kind = Math.random(), r = 2 + Math.random()*2.5;
    if(kind < 0.5){                                    /* daisy */
      for(let p=0;p<5;p++){
        const a = p/5*Math.PI*2 + Math.random()*0.5;
        g.fillStyle = 'rgba(249,247,240,0.9)';
        g.beginPath();
        g.ellipse(x + Math.cos(a)*r*0.6, y + Math.sin(a)*r*0.4, r*0.5, r*0.26, a, 0, Math.PI*2);
        g.fill();
      }
      g.fillStyle = '#e0b544';
      g.beginPath(); g.arc(x, y, r*0.3, 0, Math.PI*2); g.fill();
    }else if(kind < 0.85){                             /* marigold */
      g.fillStyle = shift('#dd9840', (Math.random()-0.5)*0.10);
      g.beginPath(); g.arc(x, y, r*0.85, 0, Math.PI*2); g.fill();
      g.fillStyle = 'rgba(180,105,40,0.75)';
      g.beginPath(); g.arc(x, y, r*0.35, 0, Math.PI*2); g.fill();
    }else{                                             /* poppy */
      g.fillStyle = shift('#c2513e', (Math.random()-0.5)*0.08);
      g.beginPath(); g.arc(x, y, r*0.9, 0, Math.PI*2); g.fill();
      g.fillStyle = 'rgba(40,32,30,0.8)';
      g.beginPath(); g.arc(x, y, r*0.28, 0, Math.PI*2); g.fill();
    }
  }
  /* a few more daisies strayed out into the lawn, larger as they near */
  for(let i=0;i<10;i++){
    const t = Math.random();
    const x = Math.random()*w, y = h*(0.78 + t*0.19), r = 2.5 + t*3.5;
    for(let p=0;p<5;p++){
      const a = p/5*Math.PI*2 + Math.random()*0.5;
      g.fillStyle = 'rgba(249,247,240,0.88)';
      g.beginPath();
      g.ellipse(x + Math.cos(a)*r*0.6, y + Math.sin(a)*r*0.4, r*0.5, r*0.26, a, 0, Math.PI*2);
      g.fill();
    }
    g.fillStyle = '#e0b544';
    g.beginPath(); g.arc(x, y, r*0.3, 0, Math.PI*2); g.fill();
  }
  return c;
}

function waterCanvas(){
  const w = 64, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0,0,w,h);
  for(let i=0;i<160;i++){
    g.strokeStyle = 'rgba(255,255,255,' + (0.1+Math.random()*0.55).toFixed(2) + ')';
    g.lineWidth = 0.6 + Math.random()*2.4;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x + (Math.random()-0.5)*2, y + 8 + Math.random()*40); g.stroke();
  }
  return c;
}

/* ============================================================
   5. HELPERS
   ============================================================ */
function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function plate(w,h,mat,x,y,z){          /* flat, never casts */
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  m.position.set(x||0,y||0,z||0);
  m.receiveShadow = true;
  return m;
}

/* ============================================================
   6. JOINERY
   ------------------------------------------------------------
   Every unit is built in its own local frame: origin sits on the
   floor, against the wall plane, and +Z runs out into the room.
   A run is then dropped on a wall and rotated once.
   ============================================================ */
const CAB = {
  baseH:0.90, baseD:0.60, counterT:0.045, counterD:0.66,
  toe:0.11,  toeIn:0.075,
  upY:1.52,  upH:0.92,  upD:0.34,
  tallH:2.44, tallD:0.66,
  reveal:0.014, frontT:0.036, rail:0.078
};
const COUNTER_Y = CAB.baseH + CAB.counterT;      /* 0.945 — the working height */

/* a shaker front: recessed centre panel inside a frame stood proud of it */
function shakerFront(w, h, opts){
  opts = opts || {};
  const g = new THREE.Group();
  const t = CAB.frontT, r = Math.min(CAB.rail, w/2 - 0.02, h/2 - 0.02);
  g.add(box(w, h, t, M.cabinet, 0, 0, 0));                       /* panel */
  const ft = t + 0.024, fz = 0.012;                              /* frame, 24mm proud */
  g.add(box(w, r, ft, M.cabRail, 0,  h/2 - r/2, fz));
  g.add(box(w, r, ft, M.cabRail, 0, -h/2 + r/2, fz));
  g.add(box(r, h - r*2, ft, M.cabRail, -w/2 + r/2, 0, fz));
  g.add(box(r, h - r*2, ft, M.cabRail,  w/2 - r/2, 0, fz));
  if(opts.knob) g.add(knob(0, 0, 0.044));
  return g;
}

function barPull(len){
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, len, 10), M.brass);
  bar.rotation.z = Math.PI/2; bar.position.z = 0.088;
  bar.castShadow = true;
  g.add(bar);
  const postGeo = new THREE.CylinderGeometry(0.0085, 0.0085, 0.052, 8);
  [-1, 1].forEach(function(s){
    const p = new THREE.Mesh(postGeo, M.brass);
    p.rotation.x = Math.PI/2;
    p.position.set(s*(len/2 - 0.028), 0, 0.062);
    p.castShadow = true;
    g.add(p);
  });
  return g;
}
function knob(x, y, z){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.03, 8), M.brass);
  stem.rotation.x = Math.PI/2; stem.position.z = 0.015;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.019, 14, 10), M.brass);
  head.position.z = 0.038;
  head.scale.set(1, 1, 0.8);
  g.add(stem, head);
  g.position.set(x||0, y||0, z||0);
  return g;
}

/* carcass + recessed kick, shared by every floor-standing unit */
function carcass(w, h, d, withToe){
  const g = new THREE.Group();
  if(withToe){
    g.add(box(w, CAB.toe, d - CAB.toeIn, M.toe, 0, CAB.toe/2, (d - CAB.toeIn)/2));
    g.add(box(w, h - CAB.toe, d, M.carcass, 0, CAB.toe + (h - CAB.toe)/2, d/2));
  } else {
    g.add(box(w, h, d, M.carcass, 0, h/2, d/2));
  }
  return g;
}

/* n equal drawer fronts filling the space between the kick and the worktop */
function baseDrawers(w, n){
  const g = new THREE.Group();
  g.add(carcass(w, CAB.baseH, CAB.baseD, true));
  const y0 = CAB.toe, span = CAB.baseH - CAB.toe;
  const fw = w - CAB.reveal*2;
  const fh = (span - CAB.reveal*(n + 1)) / n;
  for(let i=0;i<n;i++){
    const y = y0 + CAB.reveal*(i+1) + fh*i + fh/2;
    const f = shakerFront(fw, fh, {pull:false});
    f.position.set(0, y, CAB.baseD + 0.018);
    f.add(barPull(Math.min(0.30, fw*0.42)));
    g.add(f);
  }
  return g;
}

/* the classic: one shallow drawer over a pair of doors */
function baseDoors(w, n){
  const g = new THREE.Group();
  g.add(carcass(w, CAB.baseH, CAB.baseD, true));
  const y0 = CAB.toe, span = CAB.baseH - CAB.toe;
  const dh = 0.185, fw = w - CAB.reveal*2;
  const dy = y0 + span - CAB.reveal - dh/2;
  const drw = shakerFront(fw, dh, {pull:false});
  drw.position.set(0, dy, CAB.baseD + 0.018);
  drw.add(barPull(Math.min(0.30, fw*0.42)));
  g.add(drw);

  const doorH = span - dh - CAB.reveal*3;
  const doorW = (fw - CAB.reveal*(n-1)) / n;
  const dcy = y0 + CAB.reveal + doorH/2;
  for(let i=0;i<n;i++){
    const x = -fw/2 + doorW/2 + i*(doorW + CAB.reveal);
    const d = shakerFront(doorW, doorH, {pull:false});
    d.position.set(x, dcy, CAB.baseD + 0.018);
    const p = barPull(Math.min(0.20, doorH*0.34));
    p.rotation.z = Math.PI/2;                      /* pulls stand upright on a door */
    p.position.set(n === 1 ? doorW/2 - 0.055 : (i === 0 ? doorW/2 - 0.055 : -doorW/2 + 0.055),
                   doorH/2 - 0.20, 0);
    d.add(p);
    g.add(d);
  }
  return g;
}

/* full-height pantry: deep drawer at the floor, then two banks of doors */
function tallPantry(w){
  const g = new THREE.Group();
  g.add(carcass(w, CAB.tallH, CAB.tallD, true));
  const fw = w - CAB.reveal*2;
  const drawH = 0.30, midH = 0.95;
  let y = CAB.toe + CAB.reveal;

  const dr = shakerFront(fw, drawH, {pull:false});
  dr.position.set(0, y + drawH/2, CAB.tallD + 0.018);
  dr.add(barPull(Math.min(0.34, fw*0.44)));
  g.add(dr);
  y += drawH + CAB.reveal;

  function pair(h){
    const dw = (fw - CAB.reveal)/2;
    for(let i=0;i<2;i++){
      const d = shakerFront(dw, h, {pull:false});
      d.position.set(-fw/2 + dw/2 + i*(dw + CAB.reveal), y + h/2, CAB.tallD + 0.018);
      const p = barPull(Math.min(0.30, h*0.30));
      p.rotation.z = Math.PI/2;
      p.position.set(i === 0 ? dw/2 - 0.055 : -dw/2 + 0.055, h/2 - 0.26, 0);
      d.add(p);
      g.add(d);
    }
    y += h + CAB.reveal;
  }
  pair(midH);
  pair(CAB.tallH - y);
  return g;
}

/* wall unit — n doors, hung at CAB.upY unless told otherwise */
function upperUnit(w, h, n, yBase, depth){
  const g = new THREE.Group();
  h = h || CAB.upH; yBase = (yBase === undefined) ? CAB.upY : yBase;
  depth = depth || CAB.upD;
  const c = box(w, h, depth, M.carcass, 0, yBase + h/2, depth/2);
  g.add(c);
  const fw = w - CAB.reveal*2, doorH = h - CAB.reveal*2;
  const doorW = (fw - CAB.reveal*(n-1)) / n;
  for(let i=0;i<n;i++){
    const d = shakerFront(doorW, doorH, {pull:false});
    d.position.set(-fw/2 + doorW/2 + i*(doorW + CAB.reveal), yBase + h/2, depth + 0.018);
    const p = barPull(Math.min(0.24, doorH*0.30));
    p.rotation.z = Math.PI/2;
    p.position.set(n === 1 ? doorW/2 - 0.055 : (i === 0 ? doorW/2 - 0.055 : -doorW/2 + 0.055),
                   -doorH/2 + 0.20, 0);
    d.add(p);
    g.add(d);
  }
  return g;
}

/* worktop slab with a shadow line under its front lip */
function worktop(w, d, x, z){
  const g = new THREE.Group();
  d = d || CAB.counterD;
  g.add(box(w, CAB.counterT, d, M.counter, 0, CAB.baseH + CAB.counterT/2, d/2));
  g.add(box(w, 0.016, 0.020, M.counter, 0, CAB.baseH - 0.008, d - 0.010));
  g.position.set(x||0, 0, z||0);
  return g;
}

/* splashback: tile from the worktop to the underside of the wall units */
function splash(w, y0, y1, mat, repeatX){
  const t = tileTex.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX || w*1.9, (y1 - y0)*1.9);
  const m = new THREE.MeshStandardMaterial({map:t, bumpMap:t, bumpScale:0.004, roughness:0.22});
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, y1 - y0), m);
  p.position.set(0, (y0 + y1)/2, 0.006);
  p.receiveShadow = true;
  return p;
}

/* ============================================================
   7. THE FRIDGE — two doors, brushed, standing proud of the run
   ============================================================ */
/* American-style double door: roughly 1.6x the width and 1.2x the height of
   the old cabinet-depth unit, which is about as tall as it can go before the
   cornice. It now owns the wall rather than sitting in a row of joinery. */
const FR = {w:1.80, h:2.42, d:0.88};
FR.face = FR.d + 0.02;              /* the plane the door fronts sit on */
function buildFridge(){
  const g = new THREE.Group();
  g.userData.name = 'Fridge';
  g.userData.hoverable = true;

  /* the box itself, darker so the doors read as the bright thing */
  g.add(box(FR.w, FR.h, FR.d, M.frCase, 0, FR.h/2, FR.d/2));
  /* The rubber seal you glimpse round the edge of each door.
     It has to sit BEHIND the door fronts, not flush with them. Its front
     face used to land on exactly the same plane as the door panels, and two
     coplanar faces z-fight: head-on one of them wins consistently and it
     looks fine, but the moment the camera turns, depth interpolation starts
     flickering between them across the panel. That was the static. */
  g.add(box(FR.w - 0.02, FR.h - 0.02, 0.03, M.gasket, 0, FR.h/2, FR.d - 0.012));

  const gap = 0.016;
  const dw = (FR.w - gap)/2 - 0.006;
  const dh = FR.h - 0.10;
  const dz = FR.face;                           /* front face of the doors */

  [-1, 1].forEach(function(s){
    const x = s * (dw/2 + gap/2);
    const door = new THREE.Group();
    door.add(box(dw, dh, 0.075, M.frDoor, 0, 0, -0.0375));
    /* a soft chamfer down each outer edge catches the ceiling light —
       stood 2 mm proud of the panel rather than flush with it, same reason */
    door.add(box(0.016, dh, 0.06, M.frCase, s*(dw/2 - 0.008), 0, -0.028));
    door.position.set(x, 0.05 + dh/2, dz);
    g.add(door);

    /* full-height bar handle, set just off the centre seam */
    const hx = x - s*(dw/2 - 0.075);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, dh*0.66, 16), M.chrome);
    bar.castShadow = true;
    bar.position.set(hx, 0.05 + dh/2, dz + 0.070);
    g.add(bar);
    const bracket = new THREE.CylinderGeometry(0.018, 0.018, 0.070, 10);
    [-1, 1].forEach(function(k){
      const b = new THREE.Mesh(bracket, M.chrome);
      b.rotation.x = Math.PI/2;
      b.position.set(hx, 0.05 + dh/2 + k*(dh*0.66/2 - 0.035), dz + 0.035);
      b.castShadow = true;
      g.add(b);
    });
  });

  /* centre seam, and the vented plinth under the doors */
  g.add(box(gap + 0.004, dh, 0.02, M.gasket, 0, 0.05 + dh/2, dz - 0.05));
  g.add(box(FR.w, 0.05, 0.03, M.frCase, 0, 0.025, dz - 0.01));
  for(let i=0;i<7;i++){                                   /* louvres in the kick */
    g.add(box(FR.w - 0.10, 0.004, 0.008, M.gasket, 0, 0.010 + i*0.006, dz + 0.004));
  }
  /* top return, so the eye reads a lid rather than a cut-off */
  g.add(box(FR.w + 0.006, 0.018, FR.d + 0.014, M.frCase, 0, FR.h - 0.009, (FR.d + 0.014)/2));

  /* the shadow it sits in. A shadow map alone leaves a big appliance
     hovering; this is the dark line where the case meets the boards. */
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(FR.w + 0.55, FR.d + 0.55),
    new THREE.MeshBasicMaterial({map:contactTex, color:0x1a1409, transparent:true,
      opacity:0.42, depthWrite:false, fog:false}));
  contact.rotation.x = -Math.PI/2;
  contact.position.set(0, 0.006, FR.d/2 + 0.05);
  contact.renderOrder = 1;
  g.add(contact);

  /* Nothing on the fridge receives a shadow. A 2.4 m vertical panel lit from
     the ceiling meets the light at a grazing angle, and grazing incidence is
     exactly where a shadow map self-shadows: fine stripes across the door
     that crawl as the camera moves. That was the static. It still casts —
     it just is not a surface anything needs to be shadowed onto. */
  g.traverse(function(o){ if(o.isMesh) o.receiveShadow = false; });
  contact.receiveShadow = false;
  return g;
}

/* ============================================================
   7b. MAGNETS AND POLAROIDS
   ------------------------------------------------------------
   Built in the fridge's own frame, so a photo's x/y in PHOTOS is
   simply where it sits on the door. Deliberately oversized: a
   real 88 mm print would be twenty-odd pixels across from the
   arrival position, which is neither readable nor clickable.
   ============================================================ */
/* A print is cut to its photograph, not the photograph cropped to fit a
   print: every image window keeps the same AREA and takes the picture's own
   aspect. Constant area rather than constant width because a landscape and a
   portrait then carry the same weight on the door — matching widths would
   make every landscape shout and every portrait shrink. `edge` is the white
   border on three sides, `foot` the deeper one below, the way a Polaroid is.

   `area` is the one dial that resizes every print at once. Raising it needs
   the x/y in PHOTOS re-checked: at 0.064 the nine of them clear each other,
   the door edges and both handles by 23 mm at their most swollen — mid-pulse,
   when all nine are scaled up together — and there is not much more room. */
const POL = {area:0.0640, edge:0.020, foot:0.062, t:0.005};
const MAG_R = 0.034;

function polAspect(photo){ return (photo.ar > 0) ? photo.ar : 1; }
function polSize(ar){
  ar = (ar > 0) ? ar : 1;
  const iw = Math.sqrt(POL.area * ar);
  const ih = Math.sqrt(POL.area / ar);
  return {iw:iw, ih:ih, w:iw + POL.edge*2, h:ih + POL.edge + POL.foot};
}

/* the blurred rectangle a polaroid casts on the door. A shadow map will not
   do this: the door meets the ceiling lights at too grazing an angle and
   self-shadows, which is what put stripes across the fridge in the first place */
function softRectCanvas(){
  const n = 128, c = cvs(n,n), g = c.getContext('2d');
  const canBlur = (function(){ try{ g.filter = 'blur(1px)'; return g.filter !== 'none'; }
                               catch(e){ return false; } })();
  if(canBlur) g.filter = 'blur(10px)';
  g.fillStyle = '#ffffff';
  g.fillRect(n*0.17, n*0.17, n*0.66, n*0.66);
  if(canBlur) g.filter = 'none';
  return c;
}

/* what stands in for a photograph that has not been taken yet: a tint of the
   magnet's colour and the universal "there is an image here" glyph. No text —
   the words all live in the DOM, where they can be read and selected. */
function photoPlaceholderCanvas(colour, ar){
  ar = (ar > 0) ? ar : 1;
  const n = 512, w = Math.round(ar >= 1 ? n : n*ar), h = Math.round(ar >= 1 ? n/ar : n);
  const c = cvs(w,h), g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0, shift(colour,  0.30, -0.34));
  grd.addColorStop(1, shift(colour,  0.09, -0.26));
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  /* the glyph is drawn in a square of its own, centred — scaled with the
     frame it would come out an oval, and a stretched icon reads as a bug */
  const k = Math.min(w,h)/n;
  g.translate((w - n*k)/2, (h - n*k)/2);
  g.scale(k, k);
  g.strokeStyle = 'rgba(255,255,255,0.5)';
  g.lineWidth = 15; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.arc(n*0.33, n*0.33, n*0.082, 0, Math.PI*2); g.stroke();
  g.beginPath();
  g.moveTo(n*0.11, n*0.75); g.lineTo(n*0.36, n*0.47); g.lineTo(n*0.55, n*0.65);
  g.lineTo(n*0.70, n*0.52); g.lineTo(n*0.90, n*0.75);
  g.stroke();
  return c;
}

/* ---- the magnet shapes ---- */
function starShape(r, points){
  const sh = new THREE.Shape(), n = points*2;
  for(let i=0;i<n;i++){
    const rr = (i % 2 === 0) ? r : r*0.46;
    const a  = (i/n)*Math.PI*2 - Math.PI/2;
    const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
    if(i === 0) sh.moveTo(x,y); else sh.lineTo(x,y);
  }
  sh.closePath();
  return sh;
}
function heartShape(r){
  const sh = new THREE.Shape(), k = r*1.05;
  sh.moveTo(0, -0.95*k);
  sh.bezierCurveTo(-0.62*k, -0.26*k, -1.10*k, 0.46*k, -0.55*k, 0.86*k);
  sh.bezierCurveTo(-0.26*k,  1.06*k,  0.00*k, 0.76*k,  0.00*k, 0.55*k);
  sh.bezierCurveTo( 0.00*k,  0.76*k,  0.26*k, 1.06*k,  0.55*k, 0.86*k);
  sh.bezierCurveTo( 1.10*k,  0.46*k,  0.62*k,-0.26*k,  0.00*k,-0.95*k);
  return sh;
}
function flowerShape(r, petals){
  const sh = new THREE.Shape(), steps = petals*22;
  for(let i=0;i<=steps;i++){
    const t  = (i/steps)*Math.PI*2;
    const rr = r*(0.60 + 0.40*Math.cos(petals*t));
    const x = Math.cos(t)*rr, y = Math.sin(t)*rr;
    if(i === 0) sh.moveTo(x,y); else sh.lineTo(x,y);
  }
  sh.closePath();
  return sh;
}
function pillShape(r){
  const sh = new THREE.Shape(), w = r*1.5, h = r*0.72;
  sh.moveTo(-w, -h);
  sh.lineTo(w, -h);
  sh.absarc(w, 0, h, -Math.PI/2, Math.PI/2, false);
  sh.lineTo(-w, h);
  sh.absarc(-w, 0, h, Math.PI/2, Math.PI*1.5, false);
  return sh;
}
function moonShape(r){
  /* the outer arc of one circle and the inner arc of another, offset —
     the two angle constants are where those circles actually cross */
  const sh = new THREE.Shape(), a = 0.845, b = 1.483;
  sh.absarc(0, 0, r, a, Math.PI*2 - a, false);
  sh.absarc(0.6*r, 0, 0.75*r, -b, b, true);
  return sh;
}
function dropShape(r){
  const sh = new THREE.Shape();
  sh.moveTo(0, r*1.15);
  sh.quadraticCurveTo(r*0.62, r*0.45, r*0.66, -r*0.20);
  sh.absarc(0, -r*0.20, r*0.66, 0, -Math.PI, true);
  sh.quadraticCurveTo(-r*0.62, r*0.45, 0, r*1.15);
  return sh;
}

const MAG_EXTRUDE = {depth:0.013, bevelEnabled:true, bevelSize:0.0028,
                     bevelThickness:0.0028, bevelSegments:2, curveSegments:14};
function buildMagnet(kind, colour){
  const mat = new THREE.MeshStandardMaterial({color:colour, roughness:0.31, metalness:0.03});
  /* a turned disc is cheaper than an extruded circle, and fewer sides make
     a hexagon, a triangle, a diamond, a square — and, squashed, an oval —
     out of the same primitive */
  const TURNED = {disc:26, hexagon:6, triangle:3, diamond:4, square:4, oval:26};
  let mesh;
  if(TURNED[kind]){
    const theta = (kind === 'square') ? Math.PI/4 : 0;
    mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(MAG_R, MAG_R*0.94, 0.014, TURNED[kind], 1, false, theta), mat);
    mesh.rotation.x = Math.PI/2;                 /* the turned axis points at the room */
    mesh.position.z = 0.007;
    if(kind === 'oval') mesh.scale.set(1.45, 1, 0.72);
    if(kind === 'triangle' || kind === 'diamond') mesh.scale.set(1.25, 1, 1.25);
  } else if(kind === 'ring'){
    mesh = new THREE.Mesh(new THREE.TorusGeometry(MAG_R*0.80, MAG_R*0.34, 10, 26), mat);
    mesh.position.z = 0.010;
  } else {
    const shape = (kind === 'star')  ? starShape(MAG_R*1.15, 5)
                : (kind === 'heart') ? heartShape(MAG_R)
                : (kind === 'pill')  ? pillShape(MAG_R*0.88)
                : (kind === 'moon')  ? moonShape(MAG_R*1.12)
                : (kind === 'drop')  ? dropShape(MAG_R)
                :                      flowerShape(MAG_R*1.08, 6);
    mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, MAG_EXTRUDE), mat);
  }
  mesh.castShadow = false; mesh.receiveShadow = false;
  const g = new THREE.Group();
  g.add(mesh);
  g.userData.material = mat;
  return g;
}

/* ---- the print the magnet is holding up ---- */
const softRectTex = new THREE.CanvasTexture(softRectCanvas());
function buildPolaroid(photo, index){
  const g = new THREE.Group();
  g.userData.name      = photo.name;
  g.userData.hoverable = true;
  g.userData.clickable = true;
  g.userData.photo     = index;
  g.userData.hover     = 0;

  /* the drop shadow, first and furthest back */
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({map:softRectTex, color:0x1a1610, transparent:true,
      opacity:0.34, depthWrite:false, fog:false}));
  sh.position.set(0.006, -0.008, -0.0022);
  g.add(sh);
  g.userData.shadow = sh;

  /* the card. Its own material per print, so hovering one can lift one. */
  const cardMat = M.polaroid.clone();
  const card = box(1, 1, POL.t, cardMat, 0, 0, POL.t/2);
  g.add(card);
  g.userData.cardMat = cardMat;

  /* the image, stood a whisker proud of the card so the two never share a plane */
  const imgMat = new THREE.MeshStandardMaterial({
    map: tex(photoPlaceholderCanvas(photo.colour, photo.ar)), roughness:0.42, metalness:0.0});
  const img = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), imgMat);
  g.add(img);
  g.userData.imgMat = imgMat;

  const mag = buildMagnet(photo.magnet, photo.colour);
  g.add(mag);
  g.userData.magnetMat = mag.userData.material;

  /* Everything above is built at unit size and then cut to an aspect here, so
     that the one arithmetic that decides how big a print is lives in one
     place — and can be run a second time, unchanged, when the photograph
     itself turns up and tells us the ratio it actually has. */
  g.userData.cut = function(ar){
    const S = polSize(ar);
    g.userData.size = S;
    sh.geometry.dispose();
    sh.geometry = new THREE.PlaneGeometry(S.w*1.30, S.h*1.26);
    card.geometry.dispose();
    card.geometry = new THREE.BoxGeometry(S.w, S.h, POL.t);
    img.geometry.dispose();
    img.geometry = new THREE.PlaneGeometry(S.iw, S.ih);
    img.position.set(0, S.h/2 - POL.edge - S.ih/2, POL.t + 0.0013);
    mag.position.set(0, S.h/2 - 0.030, POL.t + 0.003);
  };
  g.userData.cut(photo.ar);

  /* and the real photograph, if there is one yet. The file is the authority on
     its own shape: if `ar` in PHOTOS disagrees with the pixels, the pixels win
     and the print is re-cut, so a swapped photo is never squashed to fit the
     one it replaced. */
  if(photo.src){
    /* preload.js has almost always finished with this one before the
       fridge is even built — in that case the texture is handed over
       decoded and this runs synchronously, with no second fetch and
       no half-second of blank photo paper. */
    const dress = function(t){
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = ANISO;
      imgMat.map = t;
      imgMat.needsUpdate = true;
      const real = t.image && t.image.height ? t.image.width / t.image.height : 0;
      if(real && Math.abs(real - polAspect(photo)) > polAspect(photo)*0.01) g.userData.cut(real);
    };
    if(window.HOUSE_PRELOAD) HOUSE_PRELOAD.texture(THREE, photo.src, dress);
    else new THREE.TextureLoader().load(photo.src, dress);
  }

  /* nothing here casts or receives: see the note on softRectCanvas above */
  g.traverse(function(o){ if(o.isMesh){ o.castShadow = false; o.receiveShadow = false; } });
  return g;
}

/* ============================================================
   8. SINK AND TAP
   ============================================================ */
const SINK = {w:0.84, len:0.50, deep:0.24, t:0.014};
function buildSink(){
  /* built in the left run's local frame: +X along the wall, +Z out from it.
     the rim sits flush with the worktop; everything below is one pressed bowl. */
  const g = new THREE.Group();
  g.userData.name = 'Sink';
  g.userData.hoverable = true;
  const y = COUNTER_Y, W = SINK.w, L = SINK.len, D = SINK.deep, t = SINK.t;

  /* rim, sitting on top of the stone all the way round the cut-out */
  const rim = 0.026;
  [[0, -L/2 - rim/2, W + rim*2, rim], [0, L/2 + rim/2, W + rim*2, rim]].forEach(function(a){
    g.add(box(a[2], 0.008, a[3], M.steel, a[0], y + 0.004, a[1]));
  });
  [[-W/2 - rim/2, 0], [W/2 + rim/2, 0]].forEach(function(a){
    g.add(box(rim, 0.008, L, M.steel, a[0], y + 0.004, a[1]));
  });

  /* bowl */
  g.add(box(W, t, L, M.steel, 0, y - D + t/2, 0));                       /* base */
  g.add(box(W, D, t, M.steel, 0, y - D/2, -L/2 + t/2));                  /* back */
  g.add(box(W, D, t, M.steel, 0, y - D/2,  L/2 - t/2));                  /* front */
  g.add(box(t, D, L, M.steel, -W/2 + t/2, y - D/2, 0));
  g.add(box(t, D, L, M.steel,  W/2 - t/2, y - D/2, 0));

  /* waste */
  const waste = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.012, 18), M.steelDark);
  waste.position.set(0, y - D + 0.014, 0);
  g.add(waste);
  const grate = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.030, 0.006, 18), M.gasket);
  grate.position.set(0, y - D + 0.021, 0);
  g.add(grate);
  return g;
}

function buildTap(){
  /* a gooseneck drawn as a tube along a curve, so the bend stays round */
  const g = new THREE.Group();
  g.userData.name = 'Tap';
  g.userData.hoverable = true;
  g.userData.isTap = true;

  const pts = [
    new THREE.Vector3(0, 0.00, 0),
    new THREE.Vector3(0, 0.20, 0),
    new THREE.Vector3(0, 0.33, 0.015),
    new THREE.Vector3(0, 0.405, 0.085),
    new THREE.Vector3(0, 0.375, 0.185),
    new THREE.Vector3(0, 0.275, 0.238),
    new THREE.Vector3(0, 0.205, 0.243)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.019, 12, false), M.steel);
  tube.castShadow = true;
  g.add(tube);

  /* escutcheon on the stone, spout collar, and a single lever */
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.036, 0.040, 0.022, 20), M.steel);
  base.position.y = 0.011; base.castShadow = true;
  g.add(base);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.022, 16), M.steel);
  collar.position.set(0, 0.212, 0.243);
  g.add(collar);

  const lever = new THREE.Group();
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.036, 14), M.steel);
  hub.rotation.z = Math.PI/2; hub.position.set(0.026, 0, 0);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.013, 0.115, 12), M.steel);
  arm.rotation.z = Math.PI/2; arm.position.set(0.098, 0.014, 0);
  arm.rotation.y = 0;
  lever.add(hub, arm);
  lever.position.set(0.014, 0.235, 0.005);
  lever.rotation.x = -0.30;
  g.add(lever);
  g.userData.lever = lever;

  /* the stream — hidden until the tap is turned on */
  const streamH = 0.44;
  const stream = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0075, 0.0115, streamH, 12, 1, true),
    new THREE.MeshStandardMaterial({map:waterTex, color:0xdff0ff, transparent:true, opacity:0,
      roughness:0.06, metalness:0.0, side:THREE.DoubleSide, depthWrite:false}));
  stream.position.set(0, 0.205 - streamH/2, 0.243);
  g.add(stream);
  g.userData.stream = stream;

  /* and the disturbance it makes at the bottom of the bowl */
  const splashTex = new THREE.CanvasTexture(radialCanvas(1, 0.30));
  const splashRing = new THREE.Mesh(new THREE.PlaneGeometry(0.20, 0.20),
    new THREE.MeshBasicMaterial({map:splashTex, color:0xffffff, transparent:true,
      opacity:0, depthWrite:false}));
  splashRing.rotation.x = -Math.PI/2;
  splashRing.position.set(0, 0.205 - streamH + 0.006, 0.243);
  g.add(splashRing);
  g.userData.splash = splashRing;
  return g;
}

/* ============================================================
   8b. THE SMALL APPLIANCES
   ------------------------------------------------------------
   Both are built standing on the worktop: local origin sits on the
   stone, +Z runs out into the room, same convention as the joinery.
   ============================================================ */
function applianceShadow(w, d, opacity){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({map:contactTex, color:0x241c10, transparent:true,
      opacity:opacity, depthWrite:false, fog:false}));
  m.rotation.x = -Math.PI/2;
  m.position.y = 0.004;
  m.renderOrder = 1;
  return m;
}

const TOAST = {w:0.31, h:0.185, d:0.175};
function buildToaster(){
  const g = new THREE.Group();
  g.userData.name = 'Toaster';
  g.userData.hoverable = true;
  const W = TOAST.w, H = TOAST.h, D = TOAST.d;

  /* body, with the top drawn as a half-cylinder so it reads as pressed steel
     rather than a cardboard box */
  g.add(box(W, H - 0.035, D, M.chrome, 0, (H - 0.035)/2, 0));
  const dome = new THREE.Mesh(new THREE.CylinderGeometry(D/2, D/2, W, 24, 1, false,
                                                         0, Math.PI), M.chrome);
  dome.rotation.z = -Math.PI/2;
  dome.rotation.y = Math.PI/2;
  dome.position.y = H - 0.035;
  dome.scale.set(1, 1, 0.50);          /* squashed: a shallow crown, not a tube */
  dome.castShadow = true; dome.receiveShadow = true;
  g.add(dome);

  /* two slots, recessed and dark, with the element glow buried out of sight */
  [-1, 1].forEach(function(k){
    g.add(box(W - 0.085, 0.012, 0.030, M.gasket, 0, H - 0.006, k*0.036));
    g.add(box(W - 0.095, 0.055, 0.020, M.gasket, 0, H - 0.035, k*0.036));
  });

  /* two slices, parked out of sight down the slots. They ride straight up
     on press, so the geometry that matters is the travel: `down` is far
     enough under the crown to be hidden, `up` clears the slot by a crust. */
  const TOAST_W = W - 0.115, TOAST_T = 0.016, TOAST_H = 0.115;
  /* [+x, -x, +y, -y, +z, -z] — the two big faces are the toasted ones, the
     four edges are crust. A slice that is one colour all over reads as a
     block of butter; the pale rim is the whole difference. */
  const toastMats = [M.crust, M.crust, M.crust, M.crust, M.bread, M.bread];
  const toasts = [];
  [-1, 1].forEach(function(k){
    const t = new THREE.Mesh(new THREE.BoxGeometry(TOAST_W, TOAST_H, TOAST_T), toastMats);
    t.castShadow = true;
    t.userData.down = H - 0.048 - TOAST_H/2;      /* crown hides it */
    t.userData.up   = H + 0.044;
    t.position.set(0, t.userData.down, k*0.036);
    g.add(t);
    toasts.push(t);
  });
  g.userData.toasts = toasts;

  /* lever in its slot, dial, and the seam of the crumb tray */
  g.add(box(0.010, 0.078, 0.010, M.gasket, W/2 - 0.028, H*0.56, D/2 + 0.002));
  const lever = box(0.030, 0.020, 0.016, M.plasticDark, W/2 - 0.028, H*0.40, D/2 + 0.010);
  lever.userData.down = H*0.40;                   /* pushed in, toasting */
