<style>
  :root{
    --ink:#1c1a17;
    --hand:'Caveat', ui-rounded, cursive;
    --card:#fffdf9;
    --shadow:0 8px 30px rgba(28,22,14,.20);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;margin:0;padding:0;background:#0e0c09;overflow:hidden}
  body{
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* lens pass */
  .lens{position:fixed;inset:0;pointer-events:none;z-index:3}
  #vignette{background:radial-gradient(122% 92% at 50% 46%,
      rgba(0,0,0,0) 40%, rgba(32,29,24,.14) 73%, rgba(22,19,15,.40) 100%);}
  #bloom{background:radial-gradient(60% 70% at 88% 30%, rgba(255,242,226,.16), rgba(255,242,226,0) 60%);
         mix-blend-mode:screen;}
  #grain{opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");}

  /* hud */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .pill{
    position:absolute;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);border:0;color:var(--ink);
    display:flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:.01em;font-family:inherit;
    padding:12px 16px;cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(0)}
  .pill:focus-visible{outline:2px solid #1c1a17;outline-offset:3px}
  .square{padding:12px;width:46px;height:46px;justify-content:center}

  #plaque{top:22px;left:22px;cursor:default}
  #plaque:hover{transform:none}
  #plaque b{font-weight:600}
  #plaque span{color:#8c8375}




  #caption{
    position:absolute;left:0;top:0;transform:translate(-50%,10px);
    background:var(--card);border-radius:12px;padding:9px 16px;
    font-size:13px;letter-spacing:.02em;color:#3c3730;
    box-shadow:var(--shadow);opacity:0;transition:opacity .35s;
    pointer-events:none;white-space:pre-line;max-width:min(82vw, 34em);
    text-align:center;line-height:1.5;z-index:6;
  }
  #caption.show{opacity:1}

  /* --- the journal on the nightstand ---------------------------------
     Same hand as the note in the office, deliberately: it is meant to
     read as the same person's handwriting in a different room. */
  #journal{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:rgba(12,9,6,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
  #journal.open{opacity:1;pointer-events:auto}
  #jrnPage{position:relative;width:min(92vw,470px);max-height:88vh;overflow:auto;
    background:#f6f0e4;color:#2b2823;border-radius:6px 14px 14px 6px;
    border-left:15px solid #7d6a86;padding:34px 34px 30px 44px;
    box-shadow:0 30px 90px rgba(0,0,0,.6), inset 22px 0 26px -22px rgba(60,50,36,.34);
    background-image:
      linear-gradient(to right, transparent 27px, rgba(184,116,124,.32) 27px,
                      rgba(184,116,124,.32) 28px, transparent 28px),
      repeating-linear-gradient(to bottom,
        transparent 0, transparent 30px, rgba(126,138,158,.17) 30px, rgba(126,138,158,.17) 31px);
    transform:scale(.96) rotate(-.4deg);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  #journal.open #jrnPage{transform:none}
  #jrnClose{position:absolute;top:10px;right:12px;background:none;border:0;
    color:#8c8375;font-size:17px;line-height:1;cursor:pointer;padding:6px 8px;font-family:inherit}
  #jrnClose:hover{color:#1c1a17}
  #jrnClose:focus-visible{outline:2px solid #7d6a86;outline-offset:2px;border-radius:6px}
  #jrnPage h2{margin:0 0 2px;font-family:var(--hand);font-size:40px;line-height:1.05;
    font-weight:700;letter-spacing:.005em;color:#3b3350;transform:rotate(-1.2deg);
    transform-origin:left bottom}
  #jrnPage .jrn-lede{margin:0 0 18px;font-family:var(--hand);font-size:22px;line-height:1.35;
    font-weight:500;color:#4e4660;transform:rotate(-.5deg);transform-origin:left top}
  #jrnWays{display:flex;flex-direction:column;gap:2px}
  #jrnWays a{display:flex;align-items:center;gap:14px;padding:12px 10px;margin:0 -10px;
    border-radius:10px;text-decoration:none;color:#2b2823;
    transition:background .2s, transform .2s cubic-bezier(.2,.8,.2,1)}
  #jrnWays a:hover{background:rgba(125,106,134,.12);transform:translateX(3px)}
  #jrnWays a:focus-visible{outline:2px solid #7d6a86;outline-offset:2px}
  #jrnWays svg{flex:none;color:#6b5a78}
  #jrnWays .what{font-family:var(--hand);font-size:25px;line-height:1.1;font-weight:600;color:#3b3350}
  #jrnWays .where{font-family:var(--hand);font-size:19px;line-height:1.2;font-weight:500;
    color:#665d72;word-break:break-all}
  #jrnSign{margin:20px 0 0;font-family:var(--hand);font-size:21px;font-weight:500;color:#6b6376;
    transform:rotate(-.8deg)}
  @media (max-width:820px){ #jrnPage{padding:30px 22px 26px 36px} }

  #fade{position:fixed;inset:0;background:#0e0c09;z-index:9;
        transition:opacity .45s ease;pointer-events:none}
  #fade.hidden{opacity:0}

  @media (max-width:820px){
    #plaque{top:14px;left:14px;font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>

<script>
(function(){
"use strict";
if(!window.THREE) return;

/* ============================================================
   0. HUD
   ============================================================ */
const captionEl = document.getElementById('caption');
/* cached so the caption is only measured when it actually changes */
let captionText = '', captionH = 0;
/* the room nav pill sits along the bottom — the caption stays above it */
const CAP_SAFE = 96;
const fadeEl = document.getElementById('fade');
const bloomEl = document.getElementById('bloom');

/* ============================================================
   1. PALETTE
   ============================================================ */
/*  >>> EVERY COLOUR IN THE ROOM IS SET HERE. Edit a hex, reload. <<< */
const P = {
  plaster:  '#c8bfb0',   // greige linen walls
  accent:   '#523049',   // the statement wall behind the bed — deep plum
  trim:     '#f3f0e9',   // cornice, skirting, window casing, shutters
  ceiling:  '#f7f5f0',

  floor:    '#d9d0c1',   // fitted cream carpet

  paint:    '#f2efe8',   // painted furniture (bed frame, wardrobe, vanity)
  charcoal: '#3d3b39',   // tapered legs — nightstands and the bench
  gold:     '#c39a58',   // brass — sconces, knobs, hardware
  head:     '#e9ddc7',   // the upholstered headboard — cream, so it pops off the plum
  sheet:    '#faf8f3',
  duvetUnder:'#f4f1ea',

  quilt:    '#bfa3b4',   // the mauve coverlet — a soft echo of the plum wall
  bench:    '#a8bd9d',   // sage velvet bench at the foot
  cushions: {pink:'#d9a8b8', sage:'#b9cbae', lav:'#b39fd0'},
  throw:    ['#dfa9ba','#cfc3dd','#b8a0d8','#c9a3b6','#efe9df'],   // woven stripes
  radiator: '#cfc3dd',   // the lilac panel radiator

  books:    ['#dcaebb','#b1a4ce','#b7c9ae','#f2ece4','#a9c0d8','#c9b6d8','#e7d3da','#9db4c9'],
  clothes:  ['#e3b6c3','#b1a4ce','#f4efe7','#b7c9ae','#a9c0d8'],

  pot:      '#efe9e1',   // white ceramic, brass-banded
  leaf:     '#4a7350',

  sky:      '#c3d9e6',
  hillFar:  '#a8bfa8',
  hillNear: '#88a878',
  grass:    '#90ad68',
  blossom:  '#e8a8bc'    // the tree outside flowers pink
};

/* ============================================================
   2. RENDERER / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.94;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e5dd');
scene.fog = new THREE.Fog(0xebe7df, 30, 70);

const BACK_Z = -5.2, SIDE_X = 4.4, WALL_H = 4.3, FRONT_Z = 5.6;
const HOME = new THREE.Vector3(0, 1.62, 5.0);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.copy(HOME);

const H_HALF = 30 * Math.PI/180;                 /* constant horizontal FOV */
function frameCamera(){
  camera.aspect = innerWidth / innerHeight;
  const v = 2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180/Math.PI;
  camera.fov = THREE.MathUtils.clamp(v, 24, 54);
  camera.updateProjectionMatrix();
}
frameCamera();

/* ============================================================
   3. TEXTURE FOUNDRY
   ============================================================ */
function cvs(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = ANISO;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
function shift(hex, dL, dS){
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, THREE.MathUtils.clamp(hsl.s + (dS||0), 0, 1),
                  THREE.MathUtils.clamp(hsl.l + dL, 0.02, 0.98));
  return '#' + c.getHexString();
}
function rgba(hex, a){
  const c = new THREE.Color(hex);
  return 'rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + a + ')';
}
function blotch(g, w, h, base, count, spread, alpha){
  for(let i=0;i<count;i++){
    const x = Math.random()*w, y = Math.random()*h;
    const r = (0.04 + Math.random()*0.22) * Math.max(w,h) * spread;
    const c = shift(base, (Math.random()-0.5)*0.10, (Math.random()-0.5)*0.06);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, rgba(c, alpha));
    grd.addColorStop(1, rgba(c, 0));
    g.fillStyle = grd; g.fillRect(x-r, y-r, r*2, r*2);
  }
}
function speckle(g, w, h, count, alpha){
  for(let i=0;i<count;i++){
    g.fillStyle = 'rgba(60,44,36,' + (Math.random()*alpha).toFixed(3) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 1.6, 1.1);
  }
}
function ao(g, w, h, x0,y0,x1,y1, a){
  const d = g.createLinearGradient(x0,y0,x1,y1);
  d.addColorStop(0, 'rgba(54,34,30,' + a + ')');
  d.addColorStop(1, 'rgba(54,34,30,0)');
  g.fillStyle = d; g.fillRect(0,0,w,h);
}

function plasterCanvas(base, w, h, o){
  o = o || {};
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 90, 1.0, 0.5);
  blotch(g, w, h, shift(base,-0.05), 40, 0.5, 0.3);
  g.globalAlpha = 0.06; g.lineCap = 'round';
  for(let i=0;i<60;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.14);
    g.lineWidth = 2 + Math.random()*14;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y);
    g.lineTo(x + (Math.random()-0.5)*w*0.28, y + (Math.random()-0.5)*h*0.12); g.stroke();
  }
  g.globalAlpha = 1;
  /* linen weave over the plaster */
  g.globalAlpha = 0.08;
  for(let x=0;x<w;x+=3){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.12);
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  for(let y=0;y<h;y+=3){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.10);
    g.lineWidth = 1.2; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, Math.round(w*h/900), 0.04);
  if(o.bottom) ao(g, w, h, 0, h, 0, h*(1-o.bottom), 0.32);
  if(o.top)    ao(g, w, h, 0, 0, 0, h*o.top, 0.28);
  if(o.left)   ao(g, w, h, 0, 0, w*o.left, 0, 0.34);
  if(o.right)  ao(g, w, h, w, 0, w*(1-o.right), 0, 0.34);
  return c;
}

function trimCanvas(base){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 34, 0.8, 0.5);
  g.globalAlpha = 0.13;
  for(let i=0;i<90;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.10);
    g.lineWidth = 0.8 + Math.random()*3;
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w, y + (Math.random()-0.5)*6); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 600, 0.04);
  return c;
}

/* fitted carpet: a dense loop pile in warm cream */
function carpetCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.floor; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.floor, 40, 1.0, 0.22);
  g.lineCap = 'round';
  for(let i=0;i<9000;i++){
    g.globalAlpha = 0.05 + Math.random()*0.08;
    g.strokeStyle = Math.random()<0.5 ? shift(P.floor, 0.07) : shift(P.floor, -0.06);
    g.lineWidth = 1 + Math.random()*1.4;
    const x = Math.random()*w, y = Math.random()*h, a = Math.random()*Math.PI*2;
    g.beginPath(); g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*2.5, y+Math.sin(a)*2.5, x+Math.cos(a)*4.5, y+Math.sin(a)*4.5);
    g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 900, 0.03);
  return c;
}

/* the coverlet, quilted in a soft grid */
function quiltCanvas(){
  const S = 1024, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = P.quilt; g.fillRect(0,0,S,S);
  blotch(g, S, S, P.quilt, 60, 0.9, 0.3);
  const n = 9, cell = S/n;
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){                /* each puff catches light */
    const cx = i*cell + cell/2, cy = j*cell + cell/2;
    const grd = g.createRadialGradient(cx, cy, cell*0.1, cx, cy, cell*0.72);
    grd.addColorStop(0, rgba(shift(P.quilt, 0.06), 0.55));
    grd.addColorStop(1, rgba(shift(P.quilt, -0.07), 0.35));
    g.fillStyle = grd;
    g.fillRect(i*cell, j*cell, cell, cell);
  }
  /* stitch channels between the puffs */
  g.strokeStyle = rgba(shift(P.quilt, -0.12), 0.7);
  g.lineWidth = 3;
  for(let i=0;i<=n;i++){
    g.beginPath(); g.moveTo(i*cell,0); g.lineTo(i*cell,S); g.stroke();
    g.beginPath(); g.moveTo(0,i*cell); g.lineTo(S,i*cell); g.stroke();
  }
  g.strokeStyle = rgba(shift(P.quilt, 0.12), 0.5);
  g.lineWidth = 1.2; g.setLineDash([5,4]);
  for(let i=0;i<=n;i++){
    g.beginPath(); g.moveTo(i*cell+3,0); g.lineTo(i*cell+3,S); g.stroke();
    g.beginPath(); g.moveTo(0,i*cell+3); g.lineTo(S,i*cell+3); g.stroke();
  }
  g.setLineDash([]);
  g.globalAlpha = 0.05;                                    /* weave */
  for(let i=0;i<5200;i++){
    const x = Math.random()*S, y = Math.random()*S;
    g.strokeStyle = Math.random()<0.6 ? '#000' : '#fff';
    g.lineWidth = 1 + Math.random();
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*7, y+(Math.random()-0.5)*7); g.stroke();
  }
  g.globalAlpha = 1;
  ao(g, S, S, 0, S, 0, S*0.72, 0.12);
  return c;
}

function clothCanvas(base, w, h){
  w = w || 512; h = h || 256;
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 26, 0.8, 0.24);
  g.globalAlpha = 0.09;
  for(let x=0;x<w;x+=2){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.18);
    g.lineWidth = 1; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  for(let y=0;y<h;y+=2){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.14);
    g.lineWidth = 1; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
  }
  g.globalAlpha = 1;
  for(let i=0;i<130;i++){
    g.fillStyle = rgba(shift(base, 0.10), 0.16 + Math.random()*0.2);
    g.fillRect(Math.random()*w, Math.random()*h, 3 + Math.random()*8, 1.3);
  }
  return c;
}

/* the woven throw: pastel stripes, a soft slub weave */
function throwCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');

/* crushed-velvet: directional sheen streaks over deep and light patches */

/* an open notebook page: rules, a margin, and last night's handwriting */
function pageCanvas(scribbled){
  const w = 256, h = 340, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = '#f8f4ea'; g.fillRect(0,0,w,h);
  blotch(g, w, h, '#f8f4ea', 14, 0.8, 0.3);
  g.strokeStyle = 'rgba(120,110,160,0.33)'; g.lineWidth = 1;
  for(let y=44;y<h-14;y+=17){ g.beginPath(); g.moveTo(14,y); g.lineTo(w-12,y); g.stroke(); }
  g.strokeStyle = 'rgba(210,120,140,0.45)';
  g.beginPath(); g.moveTo(30,10); g.lineTo(30,h-10); g.stroke();
  if(scribbled){
    g.strokeStyle = 'rgba(70,55,90,0.62)'; g.lineWidth = 1.3; g.lineCap = 'round';
    for(let y=44;y<h*0.72;y+=17){
      let x = 36 + Math.random()*8;
      const end = w*(0.55 + Math.random()*0.4);
      g.beginPath(); g.moveTo(x, y-5);
      while(x < end){
        const seg = 7 + Math.random()*14;
        g.bezierCurveTo(x+seg*0.3, y-5-Math.random()*6, x+seg*0.6, y-5+Math.random()*6, x+seg, y-5+(Math.random()-0.5)*3);
        x += seg + 3 + Math.random()*5;
        if(Math.random()<0.4){ g.stroke(); g.beginPath(); g.moveTo(x, y-5); }
      }
      g.stroke();
    }
    /* a little heart doodle in the corner */
    g.fillStyle = 'rgba(210,120,140,0.6)';
    const hx = w*0.78, hy = h*0.80, hr = 7;
    g.beginPath();
    g.arc(hx-hr*0.5, hy, hr*0.55, 0, Math.PI*2);
    g.arc(hx+hr*0.5, hy, hr*0.55, 0, Math.PI*2);
    g.fill();
    g.beginPath();
    g.moveTo(hx-hr*1.02, hy+hr*0.18); g.lineTo(hx, hy+hr*1.5); g.lineTo(hx+hr*1.02, hy+hr*0.18);
    g.fill();
  }
  ao(g, w, h, 0, 0, w*0.16, 0, 0.20);
  return c;
}

/* the world outside: hills, a blossom tree, a path, clouds, morning haze.
   this is the cloudy window of the house — big fair-weather cumulus with
   sunlit crowns and flat grey bases; the kitchen and dining keep clear skies */
function outsideCanvas(){
  const w = 1024, h = 640, c = cvs(w,h), g = c.getContext('2d');
  /* a real blue overhead, thinning to warm haze where it meets the hills */
  const sky = g.createLinearGradient(0,0,0,h*0.62);
  sky.addColorStop(0,    '#5e97cf');
  sky.addColorStop(0.45, '#94bfe2');
  sky.addColorStop(0.82, '#cfe2ee');
  sky.addColorStop(1,    '#efe9da');
  g.fillStyle = sky; g.fillRect(0,0,w,h);
  const sun = g.createRadialGradient(w*0.24, h*0.18, 0, w*0.24, h*0.18, w*0.3);
  sun.addColorStop(0, 'rgba(255,246,220,0.95)');
  sun.addColorStop(0.25, 'rgba(255,240,205,0.5)');
  sun.addColorStop(1, 'rgba(255,240,205,0)');
  g.fillStyle = sun; g.fillRect(0,0,w,h);
  /* cumulus: the shadowed underside laid down first, dropped a little,
     then the lit mass over it, brightest toward the sun in the top left */
  function cloud(cx, cy, s, a){
    const puffs = [[0,0,1],[-0.9,0.14,0.72],[0.85,0.12,0.76],[-0.42,-0.30,0.60],
                   [0.38,-0.34,0.64],[1.55,0.22,0.46],[-1.5,0.24,0.44]];
    g.globalAlpha = a*0.6;
    puffs.forEach(function(p){
      g.fillStyle = 'rgba(168,180,196,0.7)';
      g.beginPath();
      g.ellipse(cx + p[0]*s, cy + p[1]*s + s*0.30, s*p[2], s*p[2]*0.42, 0, 0, Math.PI*2);
      g.fill();
    });
    g.globalAlpha = a;
    puffs.forEach(function(p){
      const px = cx + p[0]*s, py = cy + p[1]*s;
      const pg = g.createRadialGradient(px - s*0.25, py - s*0.3, s*0.05, px, py, s*p[2]);
      pg.addColorStop(0, 'rgba(255,255,255,0.98)');
      pg.addColorStop(0.7, 'rgba(249,250,252,0.85)');
      pg.addColorStop(1, 'rgba(242,245,250,0)');
      g.fillStyle = pg;
      g.beginPath(); g.ellipse(px, py, s*p[2], s*p[2]*0.66, 0, 0, Math.PI*2); g.fill();
    });
    g.globalAlpha = 1;
  }
  /* smaller and fainter as they near the horizon, the way a sky recedes */
  cloud(w*0.56, h*0.13, w*0.055, 0.95);
  cloud(w*0.86, h*0.23, w*0.038, 0.85);
  cloud(w*0.30, h*0.29, w*0.024, 0.6);
  cloud(w*0.66, h*0.37, w*0.015, 0.42);
  /* the hills, bluer and paler the further off they stand */
  g.fillStyle = shift(P.hillFar, 0.12, -0.14);
  g.beginPath(); g.moveTo(0,h*0.54);
  g.bezierCurveTo(w*0.2,h*0.475, w*0.55,h*0.555, w,h*0.49);
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  g.fillStyle = shift(P.hillFar, 0.04, -0.05);
  g.beginPath(); g.moveTo(0,h*0.58);
  g.bezierCurveTo(w*0.25,h*0.48, w*0.5,h*0.60, w,h*0.52);
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  g.fillStyle = P.hillNear;
  g.beginPath(); g.moveTo(0,h*0.70);
  g.bezierCurveTo(w*0.3,h*0.62, w*0.6,h*0.74, w,h*0.66);
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  /* a hedgerow shadow along the near hill's brow settles it into the ground */
  g.globalAlpha = 0.3;
  g.strokeStyle = shift(P.hillNear, -0.14); g.lineWidth = 7;
  g.beginPath(); g.moveTo(0,h*0.705);
  g.bezierCurveTo(w*0.3,h*0.625, w*0.6,h*0.745, w,h*0.665); g.stroke();
  g.globalAlpha = 1;
  const lawn = g.createLinearGradient(0, h*0.78, 0, h);
  lawn.addColorStop(0, shift(P.grass, 0.08));
  lawn.addColorStop(1, shift(P.grass, -0.10, 0.05));
  g.fillStyle = lawn;
  g.beginPath(); g.moveTo(0,h*0.82);
  g.bezierCurveTo(w*0.4,h*0.78, w*0.7,h*0.86, w,h*0.80);
  g.lineTo(w,h); g.lineTo(0,h); g.fill();
  g.globalAlpha = 0.25;
  for(let i=0;i<800;i++){
    g.strokeStyle = shift(P.grass, (Math.random()-0.5)*0.2);
    g.lineWidth = 1.4;
    const x = Math.random()*w, y = h*0.8 + Math.random()*h*0.2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*4, y-4-Math.random()*7); g.stroke();
  }
  g.globalAlpha = 1;
  /* a garden path wandering off */
  g.fillStyle = '#d8c9a8';
  g.beginPath();
  g.moveTo(w*0.30, h);
  g.quadraticCurveTo(w*0.40, h*0.88, w*0.52, h*0.80);
  g.lineTo(w*0.55, h*0.80);
  g.quadraticCurveTo(w*0.46, h*0.90, w*0.44, h);
  g.fill();
  /* the blossom tree */
  g.strokeStyle = '#6a5240'; g.lineWidth = 13; g.lineCap = 'round';
  g.beginPath(); g.moveTo(w*0.78, h*0.86);
  g.quadraticCurveTo(w*0.76, h*0.62, w*0.79, h*0.46); g.stroke();
  g.lineWidth = 6;
  g.beginPath(); g.moveTo(w*0.785, h*0.60); g.quadraticCurveTo(w*0.85, h*0.52, w*0.88, h*0.44); g.stroke();
  g.beginPath(); g.moveTo(w*0.782, h*0.55); g.quadraticCurveTo(w*0.72, h*0.46, w*0.70, h*0.40); g.stroke();
  [[0.79,0.36,0.115],[0.70,0.40,0.075],[0.88,0.42,0.07],[0.75,0.32,0.08],[0.84,0.33,0.07]].forEach(function(b){
    const grd = g.createRadialGradient(w*b[0], h*b[1], 0, w*b[0], h*b[1], w*b[2]);
    grd.addColorStop(0, shift(P.blossom, 0.09));
    grd.addColorStop(0.8, P.blossom);
    grd.addColorStop(1, rgba(shift(P.blossom, -0.10), 0.4));
    g.fillStyle = grd;
    g.beginPath(); g.arc(w*b[0], h*b[1], w*b[2], 0, Math.PI*2); g.fill();
  });
  /* fallen petals under it */
  g.globalAlpha = 0.55;
  for(let i=0;i<70;i++){
    g.fillStyle = shift(P.blossom, Math.random()*0.1);
    const x = w*(0.70 + Math.random()*0.2), y = h*(0.84 + Math.random()*0.12);
    g.beginPath(); g.arc(x, y, 2 + Math.random()*2.5, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  /* a low white fence */
  g.strokeStyle = 'rgba(245,240,230,0.9)'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, h*0.845); g.lineTo(w*0.6, h*0.86); g.stroke();
  for(let x=0.02;x<0.6;x+=0.055){
    g.beginPath(); g.moveTo(w*x, h*0.82); g.lineTo(w*x, h*0.90); g.stroke();
  }
  /* wildflowers in the lawn — daisies mostly, a few tulips holding the
     blossom's pink, all growing larger as they come toward the glass */
  function daisy(x, y, r){
    for(let p=0;p<6;p++){
      const a = p/6*Math.PI*2 + Math.random()*0.4;
      g.fillStyle = 'rgba(250,248,242,0.92)';
      g.beginPath();
      g.ellipse(x + Math.cos(a)*r*0.62, y + Math.sin(a)*r*0.40, r*0.52, r*0.26, a, 0, Math.PI*2);
      g.fill();
    }
    g.fillStyle = '#e5bc4a';
    g.beginPath(); g.arc(x, y, r*0.30, 0, Math.PI*2); g.fill();
  }
  for(let i=0;i<34;i++){
    const t = Math.random();
    const x = Math.random()*w, y = h*(0.845 + t*0.14);
    const r = 2.5 + t*4.5;
    if(r > 4){          /* the near ones earn a stem */
      g.strokeStyle = 'rgba(88,116,62,0.8)'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x, y + r*2.2); g.quadraticCurveTo(x + 2, y + r, x, y); g.stroke();
    }
    daisy(x, y, r);
  }
  for(let i=0;i<7;i++){
    const t = Math.random();
    const x = w*(0.05 + Math.random()*0.55), y = h*(0.86 + t*0.11), r = 3.5 + t*4;
    g.strokeStyle = 'rgba(88,116,62,0.85)'; g.lineWidth = 1.8;
    g.beginPath(); g.moveTo(x, y + r*2.6); g.quadraticCurveTo(x - 2, y + r, x, y); g.stroke();
    g.fillStyle = shift(P.blossom, -0.06, 0.10);
    g.beginPath();                                     /* the tulip's cup */
    g.moveTo(x - r*0.55, y + r*0.5);
    g.quadraticCurveTo(x - r*0.65, y - r*0.7, x - r*0.2, y - r*0.35);
    g.quadraticCurveTo(x, y - r*0.85, x + r*0.2, y - r*0.35);
    g.quadraticCurveTo(x + r*0.65, y - r*0.7, x + r*0.55, y + r*0.5);
    g.closePath(); g.fill();
    g.fillStyle = rgba(shift(P.blossom, 0.10), 0.85);
    g.beginPath(); g.ellipse(x - r*0.18, y - r*0.05, r*0.22, r*0.5, 0.1, 0, Math.PI*2); g.fill();
  }
  /* birds */
  g.strokeStyle = 'rgba(70,70,80,0.55)'; g.lineWidth = 2.4;
  [[0.42,0.22],[0.48,0.19],[0.53,0.245]].forEach(function(b){
    g.beginPath();
    g.moveTo(w*b[0]-9, h*b[1]);
    g.quadraticCurveTo(w*b[0]-3, h*b[1]-6, w*b[0], h*b[1]);
    g.quadraticCurveTo(w*b[0]+3, h*b[1]-6, w*b[0]+9, h*b[1]);
    g.stroke();
  });
  return c;
}

/* the print on the left wall: a figure drawn in one line, a blush wash */
function paintingCanvas(){
  const w = 512, h = 640, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = '#f6f2ec'; g.fillRect(0,0,w,h);
  blotch(g, w, h, '#f6f2ec', 24, 0.9, 0.35);

  wash.addColorStop(0, 'rgba(228,186,196,0)');
  wash.addColorStop(1, 'rgba(228,186,196,0.45)');
  g.fillStyle = wash; g.fillRect(0,0,w,h);
  /* the figure, pen never lifted */
  g.strokeStyle = 'rgba(70,64,70,0.85)'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(w*0.44, h*0.20);
  g.bezierCurveTo(w*0.58, h*0.16, w*0.62, h*0.30, w*0.50, h*0.34);   /* head */
  g.bezierCurveTo(w*0.42, h*0.37, w*0.44, h*0.44, w*0.52, h*0.48);   /* neck, shoulder */
  g.bezierCurveTo(w*0.64, h*0.54, w*0.60, h*0.66, w*0.52, h*0.72);   /* the back's curve */
  g.bezierCurveTo(w*0.44, h*0.78, w*0.42, h*0.84, w*0.46, h*0.88);   /* hip and leg */
  g.stroke();
  g.beginPath();
  g.moveTo(w*0.52, h*0.48);
  g.bezierCurveTo(w*0.44, h*0.56, w*0.40, h*0.62, w*0.42, h*0.70);   /* the near arm */
  g.stroke();
  /* one blush dot, the only colour */
  g.fillStyle = 'rgba(216,138,166,0.8)';
  g.beginPath(); g.arc(w*0.55, h*0.26, 9, 0, Math.PI*2); g.fill();
  speckle(g, w, h, 400, 0.03);

}

/* a leaf's surface: mid-rib and veins over two greens */

function radialCanvas(inner, mid){

/* how much light the lamp's cloth lets through */
function shadeGlowCanvas(){
  const w = 32, h = 256, c = cvs(w,h), g = c.getContext('2d');
  const d = g.createLinearGradient(0,h,0,0);
  d.addColorStop(0.00,'#3a2a22');
  d.addColorStop(0.07,'#e2a78a');
  d.addColorStop(0.34,'#ffd9c2');
  d.addColorStop(0.74,'#7a5648');

   5. HELPERS
   ============================================================ */
function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function roundedGeo(w,h,d,r){
  r = Math.min(r, w/2-0.002, h/2-0.002);
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);   s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);   s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  const g = new THREE.ExtrudeGeometry(s,{depth:Math.max(0.02,d-0.05), bevelEnabled:true,
    bevelSize:0.022, bevelThickness:0.022, bevelSegments:3, curveSegments:6});
  g.center();
  return g;
}
function soft(w,h,d,r,mat,x,y,z){
  const m = new THREE.Mesh(roundedGeo(w,h,d,r), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function moulding(w,h,t,d,mat){
  const g = new THREE.Group();
  g.add(box(w,t,d,mat,0, h/2-t/2,0));
  g.add(box(w,t,d,mat,0,-h/2+t/2,0));
  g.add(box(t,h-t*2,d,mat,-w/2+t/2,0,0));
  g.add(box(t,h-t*2,d,mat, w/2-t/2,0,0));
  return g;
}
function turned(profile, segs){
  return new THREE.LatheGeometry(profile.map(function(p){
    return new THREE.Vector2(p[0], p[1]);
  }), segs || 48);
}
function sweep(curve, tubular, radial, radiusAt){
  const g = new THREE.TubeGeometry(curve, tubular, 1, radial, false);
  const pos = g.attributes.position, nrm = g.attributes.normal, c = new THREE.Vector3();
  for(let i=0;i<=tubular;i++){
    const t = i/tubular, r = radiusAt(t);
    curve.getPointAt(t, c);
    for(let j=0;j<=radial;j++){
      const k = i*(radial+1)+j;
      pos.setXYZ(k, c.x + nrm.getX(k)*r, c.y + nrm.getY(k)*r, c.z + nrm.getZ(k)*r);
    }
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
function contact(size, opacity, x, z, sx, sz){
  const t = new THREE.CanvasTexture(radialCanvas(1, 0.20));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size,size),
    new THREE.MeshBasicMaterial({map:t, color:0x35302a, transparent:true,
      opacity:opacity, depthWrite:false}));
  m.rotation.x = -Math.PI/2;
  m.scale.set(sx||1, sz||1, 1);
  m.position.set(x, 0.012, z);
  m.renderOrder = 2;
  return m;
}

function plasterMat(base, w, occ){
  const t = tex(plasterCanvas(base, Math.min(2048, Math.round(w*160)), 512, occ));
  const def = {map:t, bumpMap:t, bumpScale:0.006, roughness:1};
  /* only a light plaster can reuse its map as roughness — a dark map
     would read as near-zero roughness and turn the wall glossy */
  const hsl = {};
  new THREE.Color(base).getHSL(hsl);
  if(hsl.l > 0.5) def.roughnessMap = t;
  return new THREE.MeshStandardMaterial(def);
}

(function(){
  const s = 1024, c = cvs(s,s), g = c.getContext('2d');
  const cols = ['#e6dccc','#dfb6c2','#f0ebe2','#c2d1b6','#cfc3dd'];
  g.fillStyle = cols[0]; g.fillRect(0,0,s,s);

    g.strokeStyle = cols[i % cols.length];

    g.beginPath(); g.arc(s/2, s/2, r - 21, 0, Math.PI*2); g.stroke();

  g.globalAlpha = 0.07;                                    /* pile */
  for(let k=0;k<6000;k++){

    g.strokeStyle = Math.random()<0.6 ? '#000' : '#fff';
    g.lineWidth = 1 + Math.random();
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*7, y+(Math.random()-0.5)*7); g.stroke();

const frames = [];
function makeFrame(w, h, label, src, metal){
  const g = new THREE.Group();
  const F = 0.045, D = 0.045, MAT = 0.075;
  const bar = metal || M.silver;
  /* slim metal frame */
  g.add(box(w + MAT*2 + F*2, F, D, bar, 0,  (h + MAT*2 + F)/2, 0));
  g.add(box(w + MAT*2 + F*2, F, D, bar, 0, -(h + MAT*2 + F)/2, 0));
  g.add(box(F, h + MAT*2, D, bar, -(w + MAT*2 + F)/2, 0, 0));
  g.add(box(F, h + MAT*2, D, bar,  (w + MAT*2 + F)/2, 0, 0));
  /* white mat */
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(w + MAT*2, h + MAT*2),
    new THREE.MeshStandardMaterial({map:trimTex, roughness:0.85}));
  mat.position.z = 0.012;
  mat.receiveShadow = true;
  g.add(mat);
  /* a pure white backing, so a transparent-PNG crest sits on clean white
     rather than the mat's painted, slightly off-white tone */
  const backing = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.85}));
  backing.position.z = 0.015;
  g.add(backing);
  /* the photo */
  const photoM = new THREE.MeshStandardMaterial({map:tex(placeholderCanvas(label)), roughness:0.55, transparent:true});
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(w, h), photoM);
  photo.position.z = 0.018;
  g.add(photo);
  /* preload.js normally has this decoded before the wall is hung, in
     which case `hang` runs synchronously and the certificate is in its
     frame on the first painted frame rather than a moment after it. */
  const hang = function(t){
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = ANISO;
    photoM.map = t;
    photoM.needsUpdate = true;
    /* fit the source image inside the frame opening without stretching it */
    const img = t.image;
    if(img && img.width && img.height){
      const srcAR = img.width / img.height, boxAR = w / h;
      const fitW = srcAR > boxAR ? w : h * srcAR;
      const fitH = srcAR > boxAR ? w / srcAR : h;
      photo.geometry.dispose();
      photo.geometry = new THREE.PlaneGeometry(fitW, fitH);
    }
  };
  const missing = function(){ /* not there yet — the placeholder stays */ };
  if(window.HOUSE_PRELOAD) HOUSE_PRELOAD.texture(THREE, src, hang, missing);
  else new THREE.TextureLoader().load(src, hang, undefined, missing);
  g.traverse(function(o){ if(o.isMesh){ o.castShadow = false; o.receiveShadow = true; } });
  g.userData.kind = 'frame';
  g.userData.name = label;
  g.userData.halfH = h/2 + MAT + F;
  /* focus distance grows with the frame, so every photo presents equally large */
  g.userData.focusDist = (w + MAT*2 + F*2) * 2.16;
  return g;
}

/* ============================================================
   16. PLANTS — white-and-gold pots
   ============================================================ */
function leafGeo(len, wid){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo( wid*0.55, len*0.18,  wid*0.62, len*0.62, 0, len);
  s.bezierCurveTo(-wid*0.62, len*0.62, -wid*0.55, len*0.18, 0, 0);
  return new THREE.ExtrudeGeometry(s, {depth:0.005, bevelEnabled:false, curveSegments:10});
}
function makePlant(scale, leaves){
  const g = new THREE.Group();
  const pot = new THREE.Mesh(turned([
    [0.20,0],[0.23,0.02],[0.26,0.30],[0.30,0.33],[0.30,0.42],[0.27,0.42],
    [0.27,0.35],[0.24,0.33],[0.22,0.05],[0.0,0.05]
  ], 32), M.pot);
  pot.castShadow = true; pot.receiveShadow = true;
  g.add(pot);
  const soil = new THREE.Mesh(new THREE.CircleGeometry(0.245, 24), M.soil);
  soil.rotation.x = -Math.PI/2; soil.position.y = 0.38;
  g.add(soil);
  for(let i=0;i<leaves;i++){
    const a = (i/leaves)*Math.PI*2 + Math.random()*0.6;
    const lean = 0.28 + Math.random()*0.5;
    const hgt = 0.55 + Math.random()*0.65;
    const ux = Math.cos(a), uz = Math.sin(a);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0.36, 0),
      new THREE.Vector3(ux*lean*0.35, 0.36 + hgt*0.55, uz*lean*0.35),
      new THREE.Vector3(ux*lean*0.8, 0.36 + hgt, uz*lean*0.8)
    ]);
    const stem = new THREE.Mesh(sweep(curve, 16, 8, function(t){ return 0.016*(1-t*0.5); }), M.stem);
    stem.castShadow = true;
    g.add(stem);
    const leaf = new THREE.Mesh(leafGeo(0.42 + Math.random()*0.16, 0.30), M.leaf);
    leaf.position.copy(curve.getPointAt(1));
    leaf.rotation.y = -a + Math.PI/2;
    leaf.rotation.x = -0.7 - Math.random()*0.5;
    leaf.castShadow = true;
    g.add(leaf);
  }
  g.scale.setScalar(scale);
  return g;
}

smallPlant.position.set(SIDE_X - 0.16, WIN.y0 - 0.09, WIN.z0 + 0.35);
scene.add(smallPlant);

const cornerPlant = makePlant(0.8, 6);
cornerPlant.position.set(-SIDE_X + 0.55, 0, -1.95);
scene.add(cornerPlant);
scene.add(contact(0.85, 0.24, -SIDE_X + 0.55, -1.95));

/* ============================================================
   17. DOWNLIGHTS — two recessed spots washing the frames
   ============================================================ */
[BED.x - 0.85, BED.x + 0.85].forEach(function(x){
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.008, 10, 28), M.trim);
  ring.rotation.x = Math.PI/2;
  ring.position.set(x, WALL_H - 0.006, BACK_Z + 0.78);
  scene.add(ring);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.05, 24),
    new THREE.MeshBasicMaterial({color:'#fff4e2'}));
  disc.rotation.x = Math.PI/2;
  disc.position.set(x, WALL_H - 0.008, BACK_Z + 0.78);
  scene.add(disc);
});

/* ============================================================
   18. LIGHT — morning sun through the wide window
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xfdf6ec, 0xa9a196, 0.38);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0dd, 1.35);
sun.position.set(11, 6.5, 0.4);
sun.target.position.set(-1.5, 0.6, -3.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;   sun.shadow.camera.bottom = -6;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0008;
sun.shadow.radius = 4;
scene.add(sun); scene.add(sun.target);

const bounce = new THREE.DirectionalLight(0xdcd0e8, 0.26);
bounce.position.set(-8, 3, 4);
scene.add(bounce);

/* a stand-in interior for the gold, glass and mirror to reflect */
try{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10,10,10),
    new THREE.MeshBasicMaterial({color:0xd8d4cc, side:THREE.BackSide})));
  const win = new THREE.Mesh(new THREE.PlaneGeometry(4.6,4.6),
    new THREE.MeshBasicMaterial({color:0xfff3e0}));
  win.rotation.y = -Math.PI/2; win.position.set(4.9, 1.6, -1.2);
  env.add(win);
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(10,10),
    new THREE.MeshBasicMaterial({color:0xb0a898}));
  gnd.rotation.x = -Math.PI/2; gnd.position.y = -4.9;
  env.add(gnd);
  scene.environment = pmrem.fromScene(env, 0.05).texture;
  pmrem.dispose();
  scene.traverse(function(o){
    if(o.isMesh && o.material && o.material.isMeshStandardMaterial){
      o.material.envMapIntensity = o.material.userData.envLock !== undefined
        ? o.material.userData.envLock
        : (o.material.metalness > 0.5 ? 1.2 : 0.4);
    }
  });
}catch(e){ /* environment is a bonus, not a requirement */ }

/* the light the window throws — floor, quilt, and far wall */
const goboTex = new THREE.CanvasTexture(goboCanvas());
const pools = [];
function pool(w,h,opacity){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({map:goboTex, color:0xffedd6, transparent:true,
      opacity:opacity, blending:THREE.AdditiveBlending, depthWrite:false}));
  m.userData.base = opacity;   /* the blinds dim these back to nothing */
  pools.push(m);
  return m;
}
const floorPool = pool(5.2, 3.8, 0.12);
floorPool.rotation.x = -Math.PI/2; floorPool.rotation.z = 0.5;
floorPool.position.set(1.7, 0.045, -2.2); floorPool.renderOrder = 3;
scene.add(floorPool);

const bedPool = pool(2.8, 2.2, 0.08);
bedPool.rotation.x = -Math.PI/2; bedPool.rotation.z = 0.55;
bedPool.position.set(BED.x + 0.6, 0.90, BED.z + 0.3); bedPool.renderOrder = 3;
scene.add(bedPool);

const wallPool = pool(2.8, 2.4, 0.09);
wallPool.position.set(-2.2, 2.2, BACK_Z + 0.22); wallPool.renderOrder = 3;
scene.add(wallPool);

const sideWallPool = pool(2.2, 2.0, 0.06);
sideWallPool.rotation.y = Math.PI/2;
sideWallPool.position.set(-SIDE_X + 0.22, 1.9, 0.3); sideWallPool.renderOrder = 3;
scene.add(sideWallPool);

/* ============================================================
   19. INTERACTION
   ============================================================ */
const dom = renderer.domElement;
const pointer = new THREE.Vector2(0,0);
const look = {x:0,y:0}, target = {x:0,y:0};
let dolly = 0, dollyTarget = 0, yaw = 0, pitch = 0;
let dragging = false, dragged = false, lastX = 0, lastY = 0;

const raycaster = new THREE.Raycaster();
let hovered = null, focused = null;
const clickable = sconces.concat([wardrobe, notebook, painting, shoeRack, vanity, shelfG])
                         .concat(frames).concat(shutters);
const CLICK_KINDS = {lamp:1, wardrobe:1, frame:1, blinds:1, book:1};

/* --- the journal on the nightstand ----------------------------------
   It was already lying there open with last night's handwriting on it;
   now it answers. The words are DOM, not geometry — the handwriting in
   the room is scenery, the handwriting in the overlay is text you can
   select, copy and have read out to you. */
const jrnEl    = document.getElementById('journal');
const jrnClose = document.getElementById('jrnClose');
let journalOpen = false;
function openJournal(){
  if(journalOpen) return;
  journalOpen = true;
  jrnEl.classList.add('open');
  jrnEl.setAttribute('aria-hidden', 'false');
  jrnClose.focus();
}
function closeJournal(){
  if(!journalOpen) return;
  journalOpen = false;
  jrnEl.classList.remove('open');
  jrnEl.setAttribute('aria-hidden', 'true');
}
jrnClose.addEventListener('click', closeJournal);
jrnEl.addEventListener('click', function(e){ if(e.target === jrnEl) closeJournal(); });
notebook.userData.name = 'My journal';

/* --- the blinds ------------------------------------------------ */
let blindsOpen = true, blindsLevel = 1, bloomShown = -1;
function setBlinds(open){
  blindsOpen = open;
}

dom.style.cursor = 'default';
/* `dragging` no longer turns the room — it only remembers that a press is in
   flight, so a press that slides off its mark can be told from a click */
dom.addEventListener('pointerdown', function(e){
  dragging = true; dragged = false;
  lastX = e.clientX; lastY = e.clientY;
  if(dom.setPointerCapture) dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  pointer.x =  (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  target.x = pointer.x; target.y = pointer.y;
  /* the room does not follow a held press. all that is left to measure is
     whether the press wandered far enough to stop being a click */
  if(dragging && Math.abs(e.clientX-lastX) + Math.abs(e.clientY-lastY) > 12){
    dragged = true;
  }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  dom.style.cursor = (hovered && CLICK_KINDS[hovered.userData.kind]) ? 'pointer' : 'default';
  /* a certificate held up to the eye owns the screen: the next press anywhere
     puts it back on the wall, whether or not it landed on the frame itself —
     and whether or not the press wandered on its way, since a held press does
     not turn the room and a thumb on glass never lands perfectly still */
  if(focused){ focused = null; return; }
  if(dragged) return;
  if(!hovered) return;
  if(hovered.userData.kind === 'lamp')     lampOn = !lampOn;
  if(hovered.userData.kind === 'wardrobe') doorOpen = !doorOpen;
  if(hovered.userData.kind === 'blinds')   setBlinds(!blindsOpen);
  if(hovered.userData.kind === 'book')     openJournal();
  if(hovered.userData.kind === 'frame'){
    /* nothing is focused by the time we get here — the press that would have
       toggled this one off was already caught above */
    focused = hovered;
  }
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
/* "anywhere" includes the parts of the screen the canvas never sees — the
   plaque, the blinds switch, the room nav along the bottom. Caught on the way
   down, before those controls act, so the photo is already back on the wall
   by the time the press does whatever else it was going to do. */
addEventListener('pointerdown', function(e){
  if(focused && e.target !== dom) focused = null;
}, true);
dom.addEventListener('wheel', function(e){
  dollyTarget = THREE.MathUtils.clamp(dollyTarget - e.deltaY*0.0024, -1.2, 3.2);
}, {passive:true});

function updateHover(){
  if(journalOpen){ hovered = null; return; }
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable, true)[0];
  let group = null;
  if(hit){
    let o = hit.object;
    while(o && !o.userData.kind) o = o.parent;
    group = o;
    /* only the things that answer to a press carry a tag — the shelves,
       the mirror and the rest of the dressing stay quiet */
    if(group && !CLICK_KINDS[group.userData.kind]) group = null;
  }
  if(group !== hovered){
    hovered = group;
    dom.style.cursor = (hovered && CLICK_KINDS[hovered.userData.kind]) ? 'pointer' : 'default';
  }
}

addEventListener('keydown', function(e){
  if(journalOpen){
    if(e.key === 'Escape') closeJournal();
    return;
  }
  if(e.key === 'Escape'){ focused = null; }
  if(e.key === 'b' || e.key === 'B') setBlinds(!blindsOpen);
});


/* ============================================================
   19b. THE TAP BADGES
   Nothing in a baked room looks pressable until the cursor is
   already on it, and the name tag is no help to a visitor who
   never thought to move the cursor there. So every object that
   answers to a press wears a small hand badge, pinned to it in
   screen space — which is also the keyboard's only way in.
   ============================================================ */
const hints = TapHints.init({
  THREE: THREE, camera: camera,
  /* a certificate at the eye or an open journal owns the screen —
     badges stand down for either */
  enabled: function(){ return !focused && !journalOpen; }
});

const frameHints = frames.map(function(f){
  return hints.add({
    /* the two certificates are what this room is for, so both carry the
       hand — and under the frame rather than over it — a badge in the middle of a
       certificate covers the one thing it is pointing at */
    kind: 'tap',
    object: f, offset: [0, -(f.userData.halfH + 0.15), 0.16],
    label: f.userData.name,
    onActivate: function(){
      focused = (focused === f) ? null : f;
    }
  });
});

const wardrobeHint = hints.add({
  object: wardrobe, offset: [0.30, 0.15, 0.34],
  label: 'Open the wardrobe',
  onActivate: function(){ doorOpen = !doorOpen; }
});

/* under the shade, not over it. A badge above a wall light hangs in front of
   the one thing pressing it changes — the light coming off the top of the
   shade — so the visitor presses and sees nothing move. Below the shade the
   badge is clear of the glow and clear of the wash on the wall. */
const sconceHints = sconces.map(function(sc){
  return hints.add({
    object: sc, offset: [0, -0.28, 0.20],
    label: 'Sconces off',
    onActivate: function(){ lampOn = !lampOn; }
  });
});

/* one badge, not two. The two shutter panels are halves of a single pair of
   blinds and they always move together, so two badges were two labels for one
   switch — and the visitor had to guess whether they did different things.
   It sits at the middle of the window, on the seam where the panels meet,
   standing off the glass into the room. */
const blindHint = hints.add({
  position: [SIDE_X - 0.26, (WIN.y0 + WIN.y1)/2, WIN.zc],
  label: 'Close the blinds',
  onActivate: function(){ setBlinds(!blindsOpen); }
});

/* the journal, open on the nightstand beside the bed. It rides just above the
   page rather than on it — the handwriting is the thing being pointed at. */
const journalHint = hints.add({
  kind: 'write',
  object: notebook, offset: [0, 0.13, 0.05],
  label: 'Leave me a note',
  onActivate: function(){ openJournal(); }
});

/* the badges, the HUD button and the room itself are three handles on the
   same state — so nobody hand-syncs anyone. The labels are painted from
   state in the loop, and a repeat of the same words is a no-op. */
function paintHints(){
  frameHints.forEach(function(h, i){
    h.label(focused === frames[i] ? 'Put it back' : frames[i].userData.name);
  });
  wardrobeHint.label(doorOpen ? 'Close the wardrobe' : 'Open the wardrobe');
  sconceHints.forEach(function(h){ h.label(lampOn ? 'Sconces off' : 'Sconces on'); });
  blindHint.label(blindsOpen ? 'Close the blinds' : 'Open the blinds');
}

/* ============================================================
   20. LOOP
   ============================================================ */
const lookAt = new THREE.Vector3();
const camDir = new THREE.Vector3(), focusTarget = new THREE.Vector3();
const ghost = new THREE.Object3D(), capPoint = new THREE.Vector3();
const clock = new THREE.Clock();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  const k = Math.min(1, dt*3.0);
  look.x += (target.x - look.x)*k;
  look.y += (target.y - look.y)*k;
  dolly  += (dollyTarget - dolly)*Math.min(1, dt*3.2);
  camera.position.set(
    HOME.x + look.x*0.42 + yaw*2.4,
    HOME.y + look.y*0.16 + pitch*2.0 + Math.sin(t*0.4)*0.013,
    HOME.z - dolly
  );
  lookAt.set(look.x*0.8 + yaw*2.4, 1.78 + look.y*0.26 + pitch*1.5, BACK_Z);
  camera.lookAt(lookAt);
  updateHover();
  paintHints();
  hints.update();

  /* the sconces warm up rather than snapping on */
  lampLevel += ((lampOn ? 1 : 0) - lampLevel) * Math.min(1, dt*5);
  shadeM.emissiveIntensity = 0.05 + 1.1*lampLevel;
  bulbs.forEach(function(b){ b.intensity = 0.9 * lampLevel; });

  /* the wardrobe door swings, eased */
  doorLevel += ((doorOpen ? 1 : 0) - doorLevel) * Math.min(1, dt*4);
  wardrobe.userData.door.rotation.y = -1.15 * doorLevel;

  /* the blinds tilt shut, and the morning goes with them */
  blindsLevel += ((blindsOpen ? 1 : 0) - blindsLevel) * Math.min(1, dt*3.2);
  const tilt = SLAT_SHUT + (SLAT_OPEN - SLAT_SHUT)*blindsLevel;
  const nest = 1 - blindsLevel;
  for(let i = 0; i < louvres.length; i++){
    louvres[i].rotation.z = tilt;
    louvres[i].position.x = louvres[i].userData.nudge * nest;
  }
  for(let i = 0; i < tiltRods.length; i++){
    tiltRods[i].position.y = tiltRods[i].userData.home + nest*0.022;
  }
  /* closed slats leave only the bounce, not the sun */
  sun.intensity  = 1.35 * (0.26 + 0.74*blindsLevel);
  hemi.intensity = 0.38 * (0.74 + 0.26*blindsLevel);
  const poolF = Math.pow(blindsLevel, 1.4);
  for(let i = 0; i < pools.length; i++){
    pools[i].material.opacity = pools[i].userData.base * poolF;
  }
  if(Math.abs(blindsLevel - bloomShown) > 0.01){
    bloomShown = blindsLevel;
    bloomEl.style.opacity = (0.28 + 0.72*blindsLevel).toFixed(3);
  }

  /* a clicked photo steps off the wall to meet you */
  camera.getWorldDirection(camDir);
  frames.forEach(function(f){
    f.userData.focusLevel += (((f === focused) ? 1 : 0) - f.userData.focusLevel) * Math.min(1, dt*4.5);
    const lv = f.userData.focusLevel;
    if(lv > 0.001){
      focusTarget.copy(camera.position).addScaledVector(camDir, f.userData.focusDist);
      focusTarget.y += 0.12;  /* a touch high so the caption clears the screen edge */
      ghost.position.copy(focusTarget);
      ghost.lookAt(camera.position);
      f.position.lerpVectors(f.userData.home, focusTarget, lv);
      f.quaternion.slerpQuaternions(f.userData.homeQuat, ghost.quaternion, lv);
    } else {
      f.position.copy(f.userData.home);
      f.quaternion.copy(f.userData.homeQuat);
    }
  });
  if(focused && focused.userData.focusLevel > 0.4){
    if(captionText !== focused.userData.caption){
      captionText = focused.userData.caption;
      captionEl.textContent = captionText;
      captionH = 0;
    }
    if(!captionH) captionH = captionEl.offsetHeight;
    capPoint.copy(focused.position);
    capPoint.y -= focused.userData.halfH + 0.05;   /* tucked up under the frame */
    capPoint.project(camera);
    captionEl.style.left = (( capPoint.x*0.5+0.5)*innerWidth) + 'px';
    captionEl.style.top  = Math.min((-capPoint.y*0.5+0.5)*innerHeight,
                                    innerHeight - CAP_SAFE - captionH) + 'px';
    captionEl.classList.add('show');
  } else {
    captionEl.classList.remove('show');
  }

  /* leaves breathe, barely */
  bigPlant.rotation.y    = Math.sin(t*0.30)*0.012;
  cornerPlant.rotation.y = Math.sin(t*0.26 + 1.7)*0.012;

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  captionH = 0;          /* it re-wraps at the new width */
  frameCamera();
});

/* Lift on a composited frame rather than on a guessed delay. Two rAFs
   deep, so the first render has actually been painted and not merely
   queued — the veil comes off a finished picture, never a half-built
   one, and it comes off the instant that picture exists. */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  fadeEl.classList.add('hidden');
}); });

})();
</script>
<script src="house-nav.js"></script>
</body>
