/* ============================================================
   14. THE BOOKCASE — on the left wall, beside the desk
   ============================================================ */
const SHELF_D = 0.33, SHELF_W = 1.80, SHELF_H = 2.06, SHELF_Z = -2.62;
const SHELF_X = -SIDE_X + SHELF_D/2 + 0.02;

/* a handful of book styles, reused down the run */
const BOOK_COLOURS = ['#7d3b34','#2f4a5c','#4a5b36','#6b5330','#3d3550','#8a6a3a','#374a45','#5e3b48'];
const bookStyles = BOOK_COLOURS.map(function(col){
  return {
    spine: new THREE.MeshStandardMaterial({map:tex(spineCanvas(col)), roughness:0.78}),
    cloth: new THREE.MeshStandardMaterial({color:shift(col, -0.05), roughness:0.82})
  };
});
const bookPages = new THREE.MeshStandardMaterial({map:pagesTex, roughness:0.95});

(function(){
  const bc = new THREE.Group();
  const SIDE_T = 0.028, SH_T = 0.026, BAYS = 4;

  /* carcass: two gables, a top, a plinth and a thin back */
  [-1, 1].forEach(function(s){
    bc.add(box(SHELF_D, SHELF_H, SIDE_T, M.shelf, 0, SHELF_H/2, s*(SHELF_W/2 - SIDE_T/2)));
  });
  bc.add(box(SHELF_D, 0.030, SHELF_W, M.shelf, 0, SHELF_H - 0.015, 0));
  bc.add(box(SHELF_D - 0.03, 0.105, SHELF_W - 0.02, M.shelf, -0.015, 0.0525, 0));
  const back = box(0.014, SHELF_H - 0.12, SHELF_W - SIDE_T*2, M.shelfBack,
                   -SHELF_D/2 + 0.007, SHELF_H/2 + 0.05, 0);
  back.castShadow = false;
  bc.add(back);
  /* a lip along the front of each gable, so the case reads as joinery */
  [-1, 1].forEach(function(s){
    const lip = box(0.016, SHELF_H - 0.12, SIDE_T + 0.006, M.shelf,
                    SHELF_D/2 - 0.008, SHELF_H/2 + 0.05, s*(SHELF_W/2 - SIDE_T/2));
    bc.add(lip);
  });

  /* shelves, and what stands on them */
  const CLEAR = (SHELF_H - 0.105 - 0.030 - SH_T*(BAYS-1)) / BAYS;
  for(let b=0; b<BAYS; b++){
    const yTop = 0.105 + (b+1)*CLEAR + b*SH_T;         /* top face of this bay's shelf */
    if(b < BAYS-1){
      bc.add(box(SHELF_D - 0.020, SH_T, SHELF_W - SIDE_T*2, M.shelf, -0.010, yTop + SH_T/2, 0));
    }
    const standY = 0.105 + b*(CLEAR + SH_T);           /* the surface this bay stands on */
    fillBay(bc, standY, CLEAR, SHELF_W/2 - SIDE_T - 0.012, b);
  }

  /* built depth-on-X and width-on-Z already, so it needs no turning: the
     opening looks straight out into the room */
  bc.position.set(SHELF_X, 0, SHELF_Z);
  bc.userData.hoverable = true;
  bc.userData.name = 'The shelf';
  scene.add(bc);
  hoverables.push(bc);

  scene.add(contact(SHELF_D*3.4, SHELF_W + 0.5, 0.30, SHELF_X + 0.1, SHELF_Z));
})();

/* one bay of books: a run of standing volumes, the odd gap, the odd flat stack */
function fillBay(parent, standY, clear, halfRun, seed){
  let z = -halfRun;
  const limit = halfRun;
  let n = 0;

  function rnd(a, b){ return a + Math.random()*(b - a); }

  while(z < limit - 0.05 && n < 40){
    n++;
    /* every so often, leave the shelf empty for a hand's width */
    if(n > 3 && Math.random() < 0.13){ z += rnd(0.05, 0.13); continue; }

    /* or lay three or four of them flat instead */
    if(n > 2 && Math.random() < 0.14 && limit - z > 0.30){
      const w = rnd(0.20, 0.25), depth = rnd(0.15, 0.19);
      let y = standY;
      const stack = 2 + Math.floor(Math.random()*3);
      for(let k=0;k<stack;k++){
        const th = rnd(0.026, 0.042);
        const st = bookStyles[Math.floor(Math.random()*bookStyles.length)];
        const bk = box(depth, th, w, st.cloth, -SHELF_D/2 + depth/2 + 0.055, y + th/2, z + w/2);
        bk.rotation.y = rnd(-0.03, 0.03);
        parent.add(bk);
        y += th;
      }
      z += w + rnd(0.015, 0.05);
      continue;
    }

    const th = rnd(0.026, 0.058);
    if(z + th > limit) break;
    const h = Math.min(clear - 0.035, rnd(0.20, 0.31));
    const depth = rnd(0.155, 0.205);
    const st = bookStyles[Math.floor(Math.random()*bookStyles.length)];

    /* BoxGeometry face order is +x,-x,+y,-y,+z,-z — +x is the spine, which is
       the face pointing out of the case */
    const mats = [st.spine, st.cloth, st.cloth, st.cloth, bookPages, bookPages];
    const bk = new THREE.Mesh(new THREE.BoxGeometry(depth, h, th), mats);
    bk.castShadow = true; bk.receiveShadow = true;

    /* a book with room beside it leans into the gap */
    const lean = (Math.random() < 0.10 && limit - z > 0.16) ? rnd(0.10, 0.20) : 0;
    bk.rotation.x = lean;
    bk.position.set(-SHELF_D/2 + depth/2 + rnd(0.045, 0.075),
                    standY + h/2 * Math.cos(lean) + 0.001,
                    z + th/2);
    parent.add(bk);
    z += th + (lean ? h*Math.sin(lean)*0.6 : 0) + 0.002;
  }
}

/* ============================================================
   15. THE LAMPS — a task lamp on the desk and a standard lamp
       against each side wall
   ------------------------------------------------------------
   Every lamp is its own switch: click it and it goes on or off
   by itself, independent of the ceiling. Each one is three
   things: the object, the bulb inside it, and the wash it lays
   down — all gathered into one unit so the loop can fade them
   together.
   ============================================================ */
const lampUnits = [];

function makeLampUnit(){
  const u = {on:true, level:1, bulbs:[], shades:[], washes:[]};
  lampUnits.push(u);
  return u;
}

const lampGlareTex = new THREE.CanvasTexture(radialCanvas(1, 0.32));

/* a flat additive card — floor pool, desk pool, wall wash, ceiling wash */
function wash(unit, w, h, opacity, colour, x, y, z, rx, ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({map:lampGlareTex, color:colour, transparent:true,
      opacity:opacity, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  m.rotation.set(rx || 0, ry || 0, 0);
  m.position.set(x, y, z);
  m.renderOrder = 3;
  m.userData.baseOpacity = opacity;
  unit.washes.push(m);
  scene.add(m);
  return m;
}
function bulb(unit, colour, intensity, distance, x, y, z){
  const l = new THREE.PointLight(new THREE.Color(colour), intensity, distance, 2);
  l.position.set(x, y, z);
  l.userData.base = intensity;
  unit.bulbs.push(l);
  scene.add(l);
  return l;
}
function glowing(unit, mat, base){
  mat.userData.base = base;
  unit.shades.push(mat);
  return mat;
}

/* --- the task lamp: weighted disc, two arms, a cone raked over the desk --- */
const TASK_X = 1.52, TASK_Z = DESK_Z - 0.16;
const TASK_TURN = -0.85;      /* turned across the desk, so the two arms read as two */
const TASK_S = 1.12;          /* a desk this size wants a lamp with some presence on it */
(function(){
  const unit = makeLampUnit();
  const L = new THREE.Group();

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.104, 0.116, 0.022, 36), M.lampBody);
  base.position.y = 0.011;
  base.castShadow = true; base.receiveShadow = true;
  L.add(base);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.036, 0.032, 22), M.lampBody);
  collar.position.y = 0.038;
  collar.castShadow = true;
  L.add(collar);

  /* lower arm leans back toward the wall, upper arm reaches out over the desk */
  const A1 = 0.42, T1 = -0.34;
  const lower = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.016, A1, 14), M.lampBody);
  lower.position.set(0, 0.046 + Math.cos(T1)*A1/2, Math.sin(T1)*A1/2);
  lower.rotation.x = T1;
  lower.castShadow = true;
  L.add(lower);

  const ELB_Y = 0.046 + Math.cos(T1)*A1, ELB_Z = Math.sin(T1)*A1;
  const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.023, 18, 12), M.lampBody);
  elbow.position.set(0, ELB_Y, ELB_Z);
  elbow.castShadow = true;
  L.add(elbow);

  const A2 = 0.34, T2 = 1.15;
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.014, A2, 14), M.lampBody);
  upper.position.set(0, ELB_Y + Math.cos(T2)*A2/2, ELB_Z + Math.sin(T2)*A2/2);
  upper.rotation.x = T2;
  upper.castShadow = true;
  L.add(upper);

  /* the head: a cone hung off the end of the upper arm, mouth down and forward */
  const HEAD_Y = ELB_Y + Math.cos(T2)*A2, HEAD_Z = ELB_Z + Math.sin(T2)*A2;
  const TIP = -0.34;                                  /* how far the shade is raked over */
  const head = new THREE.Group();
  head.position.set(0, HEAD_Y, HEAD_Z);
  head.rotation.x = TIP;
  L.add(head);

  const knuckle = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.058, 14), M.lampBody);
  knuckle.rotation.z = Math.PI/2;
  knuckle.position.y = 0.012;
  head.add(knuckle);

  const CONE = new THREE.CylinderGeometry(0.048, 0.108, 0.140, 30, 1, true);
  const outer = new THREE.Mesh(CONE, M.lampBody);
  outer.position.y = -0.048;
  outer.castShadow = true;
  head.add(outer);
  const innerMat = glowing(unit, M.shadeHot.clone(), 1.35);
  const inner = new THREE.Mesh(CONE, innerMat);
  inner.position.y = -0.048;
  head.add(inner);
  /* the filament, seen up inside the cone */
  const fil = new THREE.Mesh(new THREE.SphereGeometry(0.021, 14, 10),
    glowing(unit, new THREE.MeshStandardMaterial({color:'#ffe1a6', roughness:0.3,
      emissive:P.lampWarm, emissiveIntensity:1.9}), 1.9));
  fil.position.y = -0.030;
  head.add(fil);

  L.position.set(TASK_X, DESK_TOP, TASK_Z);
  L.rotation.y = TASK_TURN;
  L.scale.setScalar(TASK_S);
  L.userData.hoverable = true;
  L.userData.clickable = true;
  L.userData.lampUnit = unit;
  L.userData.name = 'The desk lamp';
  L.userData.isDeskLamp = true;
  scene.add(L);
  hoverables.push(L);

  /* the bulb, and where its cone lands. The group is both turned and scaled,
     so the head and the direction it points have to be carried through both. */
  const cs = Math.cos(TASK_TURN), sn = Math.sin(TASK_TURN);
  const hy = HEAD_Y*TASK_S, hz = HEAD_Z*TASK_S;
  const dy = -Math.cos(TIP), dz = -Math.sin(TIP);     /* the mouth's direction, unturned */
  const wx = TASK_X + hz*sn, wy = DESK_TOP + hy, wz = TASK_Z + hz*cs;
  const t = hy / -dy;                                 /* how far down to the desk top */
  const lx = wx + dz*sn*t, lz = wz + dz*cs*t;         /* and where that puts the pool */
  const sp = new THREE.SpotLight(new THREE.Color(P.lampWarm), 2.15, 3.4, 0.88, 0.74, 1.4);
  sp.position.set(wx, wy - 0.05, wz);
  sp.target.position.set(lx, DESK_TOP, lz);
  sp.userData.base = 2.15;
  unit.bulbs.push(sp);
  scene.add(sp); scene.add(sp.target);
  /* a little spill out of the top of the cone, so the wall behind gets something */
  bulb(unit, P.lampWarm, 0.58, 2.1, wx, wy + 0.12, wz - 0.05);

  wash(unit, 1.20, 0.86, 0.26, 0xffb459, lx, DESK_TOP + 0.003, lz, -Math.PI/2, 0);
  const seat = contact(0.42, 0.42, 0.26, TASK_X, TASK_Z);
  seat.position.y = DESK_TOP + 0.002;                 /* it stands on the desk, not the floor */
  scene.add(seat);
})();

/* --- the standard lamps: a linen drum at head height against each side wall.
   The right one stands opposite the bookcase; the left one stands in the
   corner between the bookcase and the back wall, where the fig used to be.
   Each is its own switch. `side` is +1 on the right wall, -1 on the left,
   and steers which wall the washes land on. --- */
function makeStandardLamp(x, z, side, name){
  const unit = makeLampUnit();
  const L = new THREE.Group();

  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.186, 0.206, 0.026, 44), M.lampBody);
  foot.position.y = 0.013;
  foot.castShadow = true; foot.receiveShadow = true;
  L.add(foot);
  const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.086, 0.040, 28), M.lampBody);
  boss.position.y = 0.046;
  boss.castShadow = true;
  L.add(boss);

  const STEM_H = 1.34;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.021, STEM_H, 20), M.brass);
  stem.position.y = 0.066 + STEM_H/2;
  stem.castShadow = true;
  L.add(stem);

  const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.034, 0.075, 20), M.brass);
  socket.position.y = 0.066 + STEM_H + 0.030;
  L.add(socket);

  /* the drum: linen from both sides, with a ring of brass round the top */
  const SH_BOT = 1.400, SH_H = 0.320, SH_Y = SH_BOT + SH_H/2;
  const drumMat = glowing(unit, M.shade.clone(), 0.42);
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.186, 0.216, SH_H, 44, 1, true), drumMat);
  drum.position.y = SH_Y;
  L.add(drum);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.186, 0.005, 8, 44), M.brass);
  ring.rotation.x = Math.PI/2;
  ring.position.y = SH_BOT + SH_H;
  L.add(ring);
  const lidMat = glowing(unit, new THREE.MeshStandardMaterial({color:'#eccd8a', roughness:0.6,
    side:THREE.DoubleSide, emissive:P.lampWarm, emissiveIntensity:0.42}), 0.42);
  const lid = new THREE.Mesh(new THREE.RingGeometry(0.052, 0.184, 40), lidMat);
  lid.rotation.x = -Math.PI/2;
  lid.position.y = SH_BOT + SH_H - 0.004;
  L.add(lid);

  L.position.set(x, 0, z);
  L.userData.hoverable = true;
  L.userData.clickable = true;
  L.userData.lampUnit = unit;
  L.userData.name = name;
  scene.add(L);
  hoverables.push(L);
  scene.add(contact(0.86, 0.86, 0.30, x, z));

  bulb(unit, P.lampWarm, 1.35, 4.9, x, SH_Y, z);
  /* what it leaves on the floor, up the wall beside it, and on the ceiling */
  wash(unit, 2.40, 2.40, 0.100, 0xffab4a, x - side*0.12, 0.024, z, -Math.PI/2, 0);
  wash(unit, 1.70, 2.00, 0.066, 0xffb45a, side*(SIDE_X - 0.012), SH_Y - 0.06, z, 0, -side*Math.PI/2);
  wash(unit, 1.50, 1.50, 0.060, 0xffbb66, x - side*0.06, WALL_H - 0.008, z, Math.PI/2, 0);
}
makeStandardLamp( 3.00, -2.95,  1, 'The standard lamp');
makeStandardLamp(-2.95, -3.80, -1, 'The other standard lamp');

/* ============================================================
   16. LIGHT — six recessed fittings, three of them carrying a spot
   ============================================================ */
const glareTex = new THREE.CanvasTexture(radialCanvas(1, 0.28));
const halos = [], pools = [];

function downlight(x, z){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.086, 0.078, 0.026, 20), M.ringTrim);
  ring.position.y = WALL_H - 0.013;
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.064, 0.064, 0.010, 20), M.lens);
  lens.position.y = WALL_H - 0.030;
  g.add(ring, lens);

  const halo = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshBasicMaterial({map:glareTex, color:0xffb14a, transparent:true,
      opacity:0.30, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  halo.rotation.x = Math.PI/2;
  halo.position.y = WALL_H - 0.042;
  halo.renderOrder = 3;
  g.add(halo);
  halos.push(halo);

  g.position.set(x, 0, z);
  scene.add(g);
}

const LIGHT_X = [-2.1, 0, 2.1], LIGHT_Z = [-3.2, -0.3];
LIGHT_Z.forEach(function(z){ LIGHT_X.forEach(function(x){ downlight(x, z); }); });

/* the wash each fitting leaves on the floor */
function pool(size, opacity, x, z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({map:glareTex, color:0xffa938, transparent:true,
      opacity:opacity, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.022, z);
  m.renderOrder = 3;
  m.userData.baseOpacity = opacity;
  pools.push(m);
  scene.add(m);
}
LIGHT_Z.forEach(function(z){ LIGHT_X.forEach(function(x){ pool(2.4, 0.044, x, z); }); });

/* The room is lit by the fittings and the three lamps, and by almost nothing
   else. What ambient there is exists only to keep the corners from going to
   pure black — it is not carrying any of the exposure, and it is warm, so it
   never reads as daylight leaking in. */
const amb = new THREE.AmbientLight(0xffd39a, 0.040);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xffc077, 0x241a10, 0.085);
scene.add(hemi);

const spots = [];
function spot(x, z, tx, ty, tz, intensity, shadow){
  /* a narrow cone with a soft edge: this is what makes each fitting land as
     its own pool of light rather than washing the whole room flat */
  const s = new THREE.SpotLight(0xffb44e, intensity, 12, 0.62, 0.72, 1.4);
  s.position.set(x, WALL_H - 0.04, z);
  s.target.position.set(tx, ty, tz);
  if(shadow){
    s.castShadow = true;
    s.shadow.mapSize.set(2048, 2048);
    s.shadow.camera.near = 0.4;
    s.shadow.camera.far = 12;
    s.shadow.bias = -0.0009;
    s.shadow.radius = 6;                              /* wide penumbra — nothing in here is a hard edge */
  }
  scene.add(s); scene.add(s.target);
  s.userData.base = intensity;
  spots.push(s);
  return s;
}
spot( 0.0, -3.2,  0.00, 0.90, -3.95, 1.55, true);   /* down the desk */
spot( 2.1, -3.2,  0.35, 0.30, -2.85, 0.78, true);   /* across the chair */
spot(-2.1, -3.2, -3.10, 1.10, -2.60, 1.05, false);  /* onto the shelf */
spot( 0.0, -0.3,  0.20, 0.00,  0.40, 0.60, false);
spot( 2.1, -0.3,  2.70, 0.70, -1.20, 0.50, false);

/* no daylight: the only things lighting this room are the fittings and the
   three lamps, which is what keeps it feeling like it is after hours */

/* a stand-in interior, pre-filtered — this is what the aluminium reflects */
try{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10,10,10),
    new THREE.MeshBasicMaterial({color:0x2b2721, side:THREE.BackSide})));
  const lid = new THREE.Mesh(new THREE.PlaneGeometry(10,10),
    new THREE.MeshBasicMaterial({color:0x5a4626}));
  lid.rotation.x = Math.PI/2; lid.position.y = 4.9; env.add(lid);
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(10,10),
    new THREE.MeshBasicMaterial({color:0x1d150d}));
  gnd.rotation.x = -Math.PI/2; gnd.position.y = -4.9; env.add(gnd);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
  scene.traverse(function(o){
    if(o.isMesh && o.material && o.material.isMeshStandardMaterial){
      o.material.envMapIntensity = o.material.metalness > 0.5 ? 0.95 : 0.20;
    }
  });
}catch(e){ /* environment is a bonus, not a requirement */ }

/* ============================================================
   17. INTERACTION
   ============================================================ */
const dom = renderer.domElement;
const pointer = new THREE.Vector2(0,0);
const look = {x:0, y:0}, target = {x:0, y:0};
let yaw = 0, yawT = 0, pitch = 0, pitchT = 0;
let dolly = 0, dollyT = 0;
let dragging = false, dragged = false, lastX = 0, lastY = 0;

const raycaster = new THREE.Raycaster();
let hovered = null;

let lightsOn = true, lightLevel = 1;

function toggleLights(){ lightsOn = !lightsOn; }

dom.style.cursor = 'default';
/* `dragging` no longer turns the room — it only remembers that a press is in
   flight, so a press that slides off its mark can be told from a click */
dom.addEventListener('pointerdown', function(e){
  dragging = true; dragged = false;
  lastX = e.clientX; lastY = e.clientY;
  if(dom.setPointerCapture) dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  pointer.x =  (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  target.x = pointer.x; target.y = pointer.y;
  /* the room does not follow a held press. all that is left to measure is
     whether the press wandered far enough to stop being a click */
  if(dragging && Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY) > 12){
    dragged = true;
  }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  dom.style.cursor = hovered && hovered.userData.clickable ? 'pointer' : 'default';
  if(dragged || !hovered) return;
  if(hovered.userData.isScreen){ openZoom(); }
  else if(hovered.userData.isFax){ openFax(); }
  else if(hovered.userData.lampUnit){ hovered.userData.lampUnit.on = !hovered.userData.lampUnit.on; }
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', function(e){
  dollyT = THREE.MathUtils.clamp(dollyT - e.deltaY*0.0026, -0.9, 3.4);
}, {passive:true});

function updateHover(){
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hoverables, true)[0];
  let group = null;
  if(hit){
    let o = hit.object;
    while(o && !o.userData.hoverable) o = o.parent;
    group = o;
    /* only the things that answer to a press carry a tag — the pens, the
       chair and the rest of the dressing stay quiet */
    if(group && !group.userData.clickable) group = null;
  }
  if(group !== hovered){
    hovered = group;
    dom.style.cursor = hovered && hovered.userData.clickable ? 'pointer' : 'default';
  }
}

/* --- the blown-up screen: filled from the same data the 3D terminal draws --- */
const zoomEl = document.getElementById('zoom');
const zoomClose = document.getElementById('zoomClose');
(function(){
  document.querySelector('#zoomTerm .zt-title').textContent = SHELL_TITLE;
  document.getElementById('ztHost').textContent = SHELL_HOST + '  ~/portfolio';
  document.getElementById('ztCmd').textContent = COMMAND;
  const list = document.getElementById('ztList');
  SKILLS.forEach(function(sec){
    const block = document.createElement('section');
    const head = document.createElement('h3');
    head.textContent = sec.group + '/';
    const ul = document.createElement('ul');
    sec.items.forEach(function(it){
      const li = document.createElement('li');
      li.textContent = it;
      ul.appendChild(li);
    });
    block.appendChild(head);
    block.appendChild(ul);
    list.appendChild(block);
  });
})();

/* the panel is laid out even while it is faded out, so it can be measured at
   any time: start at the largest comfortable size and step down until the
   print stops overflowing. Nothing here ever needs a scrollbar. */
const ztBody = document.querySelector('.zt-body');
function fitZoom(){
  let fs = 19;
  ztBody.style.setProperty('--zt-fs', fs + 'px');
  while(fs > 8 && ztBody.scrollHeight > ztBody.clientHeight){
    fs -= 0.5;
    ztBody.style.setProperty('--zt-fs', fs + 'px');
  }
}
fitZoom();

function openZoom(){
  fitZoom();
  zoomEl.classList.add('open');
  zoomEl.setAttribute('aria-hidden', 'false');
  zoomClose.focus();
}
function closeZoom(){
  zoomEl.classList.remove('open');
  zoomEl.setAttribute('aria-hidden', 'true');
}
zoomClose.addEventListener('click', closeZoom);
zoomEl.addEventListener('click', function(e){ if(e.target === zoomEl) closeZoom(); });

/* --- the printed sheet, opened: the ways to reach me --- */
const faxEl = document.getElementById('fax');
const faxClose = document.getElementById('faxClose');
function openFax(){
  faxEl.classList.add('open');
  faxEl.setAttribute('aria-hidden', 'false');
  faxClose.focus();
}
function closeFax(){
  faxEl.classList.remove('open');
  faxEl.setAttribute('aria-hidden', 'true');
}
faxClose.addEventListener('click', closeFax);
faxEl.addEventListener('click', function(e){ if(e.target === faxEl) closeFax(); });

addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(zoomEl.classList.contains('open')) closeZoom();
    else if(faxEl.classList.contains('open')) closeFax();
  }
  if(e.key === 'l' || e.key === 'L') toggleLights();
});

/* ============================================================
   17b. THE TAP BADGES
   A baked room looks exactly as pressable as a photograph, and
   the name tag only turns up once the cursor is already on the
   thing. So the screen, the fax and the lamps each wear a
   small hand badge, pinned in screen space — which doubles as
   the keyboard's only route into a WebGL canvas.
   ============================================================ */
/* the lamps were built inside their own makers, so they are collected back
   out of the hoverables rather than by threading a second array through */
const lampObjs = hoverables.filter(function(o){ return o.userData.lampUnit; });
const faxMachine = hoverables.filter(function(o){ return o.userData.isFax; })[0];

const hints = TapHints.init({
  THREE: THREE, camera: camera,
  /* the blown-up screen and the opened sheet each own the whole screen */
  enabled: function(){
    return !zoomEl.classList.contains('open') && !faxEl.classList.contains('open');
  }
});

/* the group's own origin is the room's, so these are world numbers: the
   bottom-right corner of the panel, inside the bezel. Dead centre would
   sit the badge on top of the one thing it is asking to be read. */
hints.add({
  kind: 'tap',
  object: monitor,
  local: [PANEL_W/2 - 0.17, MON_Y - PANEL_H/2 + 0.15, MON_Z + 0.22],
  label: 'Skills',
  onActivate: function(){ openZoom(); }
});

/* pinned in the machine's own space rather than off its bounding box —
   the printed page runs a good way out across the desk, and the middle of
   the box that holds both is nowhere anyone would press. It floats in front
   of the standing page, which is the only part of this corner of the desk
   with nothing on it — over the body it covers the keypad, and over the
   printed page it covers the headline. */
if(faxMachine) hints.add({
  object: faxMachine, local: [0.055, 0.165, 0.14],
  label: faxMachine.userData.name,
  onActivate: function(){ openFax(); }
});

const lampHints = lampObjs.map(function(L){
  /* the standard lamps are tall enough that the middle of the box already
     falls on the stem, under the shade. The desk lamp is not: its box centre
     sits level with the head, which leaves the badge hanging in the air
     beside the shade. So that one is measured from its own base instead —
     down on the desk, under the lamp, and pulled forward off the metal. */
  const cfg = L.userData.isDeskLamp
    ? { object: L, local: [0, 0.03, 0], offset: [0, 0, 0.20] }
    : { object: L, offset: [0, 0.10, 0.14] };
  cfg.label = L.userData.name;
  cfg.onActivate = function(){
    L.userData.lampUnit.on = !L.userData.lampUnit.on;
  };
  return hints.add(cfg);
});

/* the badges and the room are two handles on one state, so the labels are
   painted from that state in the loop rather than hand-synced */
function paintHints(){
  lampHints.forEach(function(h, i){
    const L = lampObjs[i];
    h.label('Turn ' + L.userData.name.toLowerCase() +
            (L.userData.lampUnit.on ? ' off' : ' on'));
  });
}

/* ============================================================
   18. LOOP
   ============================================================ */
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), lookAt = new THREE.Vector3();

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  const k = Math.min(1, dt*4.2);

  look.x += (target.x - look.x)*Math.min(1, dt*3.0);
  look.y += (target.y - look.y)*Math.min(1, dt*3.0);
  yaw    += (yawT - yaw)*k;
  pitch  += (pitchT - pitch)*k;
  dolly  += (dollyT - dolly)*Math.min(1, dt*3.2);

  const ey = yaw   - look.x*0.085;              /* a little drift with the cursor — right
                                                  exposes the right of the room */
  const ep = pitch + look.y*0.055;
  camera.position.set(
    HOME.x + look.x*0.14,
    HOME.y + look.y*0.04 + Math.sin(t*0.42)*0.011,
    HOME.z - dolly
  );
  const cp = Math.cos(ep);
  fwd.set(-Math.sin(ey)*cp, Math.sin(ep), -Math.cos(ey)*cp);
  lookAt.copy(camera.position).addScaledVector(fwd, 8);
  camera.lookAt(lookAt);

  updateHover();
  paintHints();
  hints.update();

  /* the ceiling comes up and goes down rather than snapping */
  lightLevel += ((lightsOn ? 1 : 0) - lightLevel) * Math.min(1, dt*4.5);
  const L = lightLevel;
  spots.forEach(function(s){ s.intensity = s.userData.base * (0.05 + 0.95*L); });
  /* the fill tracks the switch but stays tiny at both ends — with the ceiling
     off the room is meant to be carried by the lamps alone */
  hemi.intensity = 0.030 + 0.055*L;
  amb.intensity  = 0.018 + 0.022*L;
  M.lens.emissiveIntensity = 0.04 + 1.86*L;
  const flick = 1 + Math.sin(t*7.3)*0.006;
  halos.forEach(function(h){ h.material.opacity = 0.30*L*flick; });
  pools.forEach(function(p){ p.material.opacity = p.userData.baseOpacity * L; });

  /* every lamp is its own switch, and each fades rather than snapping */
  lampUnits.forEach(function(u){
    u.level += ((u.on ? 1 : 0) - u.level) * Math.min(1, dt*5.0);
    const v = u.level;
    u.bulbs.forEach(function(l){ l.intensity = l.userData.base * v; });
    u.shades.forEach(function(m){ m.emissiveIntensity = m.userData.base * v; });
    u.washes.forEach(function(w){ w.material.opacity = w.userData.baseOpacity * v; });
  });

  /* the terminal throws more when the ceiling is off */
  const spill = 1 - 0.42*L;
  screenLight.intensity = 0.30 + 0.85*spill;
  screenPool.material.opacity = 0.05 + 0.15*spill;

  /* the caret blinks */
  cursorMesh.visible = (t % 1.06) < 0.60;

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  frameCamera();
  fitZoom();
});

/* Lift on a composited frame rather than on a guessed delay. Two rAFs
   deep, so the first render has actually been painted and not merely
   queued — the veil comes off a finished picture, never a half-built
   one, and it comes off the instant that picture exists. */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  fadeEl.classList.add('hidden');
}); });

})();
</script>
<script src="house-nav.js"></script>
</body>
