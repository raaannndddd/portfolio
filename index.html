<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/img/logo.png" />

  <!-- Resource hints for external domains -->

  <meta name="description"
    content="Portfolio of Rand, a final year Software Engineering student at the University of Sydney passionate about SEO, marketing automation, and Artificial Intelligence." />
  <meta name="keywords"
    content="Rand, Software Engineer, Portfolio, Developer, Artificial Intelligence, AI, SEO, Marketing Automation, Full Stack, Sydney" />
  <meta name="author" content="Rand" />

  <!-- GEO Tags -->
  <meta name="geo.region" content="AU-NSW" />
  <meta name="geo.placename" content="Sydney" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />

    content="A showcase of my software engineering projects, SEO work, and personal interests." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Rand - Software Engineer Portfolio" />

    content="A showcase of my software engineering projects, SEO work, and personal interests." />
  <meta name="twitter:image" content="https://raaannndddd.github.io/portfolio/img/logo.png" />

  <!-- JSON-LD Structured Data (Person) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rand",
    "url": "https://raaannndddd.github.io/portfolio/",
    "jobTitle": "Software Engineer",
    "description": "Final year Software Engineering student at the University of Sydney, passionate about SEO, AI and full-stack development.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Sydney",
      "addressRegion": "NSW",
      "addressCountry": "AU"
    },
    "sameAs": [
      "https://github.com/raaannndddd",
      "https://linkedin.com/in/randhalasa"
    ]
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    const theme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (theme === 'dark' || (!theme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</body>

</html>
