/* --- first, the rug the whole seating group stands on ------------------- */
(function rug(){
  const RW = 4.0, RD = 3.2;                 /* along x, along z */
  function rugCanvas(){
    const w = 1024, h = 852, c = cvs(w,h), g = c.getContext('2d');
    const K = {field:'#e8e0cd', border:'#cbbc9e', deep:'#b1a184',
               sage:'#a9b2a2', rose:'#c9aba1', edge:'#ddd3bd'};
    g.clearRect(0,0,w,h);
    const FR = 26;                          /* fringe margin on the short ends */
    /* ground, then a pair of quiet borders */
    g.fillStyle = K.edge;  g.fillRect(FR, 0, w - FR*2, h);
    g.fillStyle = K.field; g.fillRect(FR+14, 14, w-(FR+14)*2, h-28);
    g.strokeStyle = K.border; g.lineWidth = 10;
    g.strokeRect(FR+34, 34, w-(FR+34)*2, h-68);
    g.lineWidth = 3;
    g.strokeRect(FR+56, 56, w-(FR+56)*2, h-112);
    /* a running vine in the outer border */
    g.strokeStyle = K.deep; g.lineWidth = 2.4;
    for(let x=FR+60; x<w-FR-80; x+=52){
      g.beginPath(); g.arc(x, 44, 9, 0.4, Math.PI - 0.4); g.stroke();
      g.beginPath(); g.arc(x + 26, h - 44, 9, Math.PI + 0.4, -0.4); g.stroke();
    }
    const fx0 = FR+70, fx1 = w-FR-70, fy0 = 70, fy1 = h-70;
    const mx = (fx0+fx1)/2, my = (fy0+fy1)/2;
    /* the central medallion: three soft lobed rings and a small diamond heart */
    function lobedRing(r, col, width){
      g.strokeStyle = col; g.lineWidth = width;
      g.beginPath();
      for(let a=0; a<=Math.PI*2 + 0.01; a += Math.PI/32){
        const rr = r*(1 + 0.07*Math.sin(a*8));
        const px = mx + Math.cos(a)*rr*1.25, py = my + Math.sin(a)*rr;
        if(a === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.stroke();
    }
    lobedRing(150, K.deep, 5);
    lobedRing(118, K.sage, 4);
    lobedRing(86, K.rose, 4);
    g.fillStyle = K.deep;
    g.beginPath();
    g.moveTo(mx, my-34); g.lineTo(mx+30, my); g.lineTo(mx, my+34); g.lineTo(mx-30, my);
    g.closePath(); g.fill();
    /* quarter medallions tucked into the field corners */
    [[fx0,fy0],[fx1,fy0],[fx0,fy1],[fx1,fy1]].forEach(function(c2){
      g.strokeStyle = K.deep; g.lineWidth = 4;
      g.beginPath(); g.arc(c2[0], c2[1], 92, 0, Math.PI*2); g.stroke();
      g.strokeStyle = K.sage; g.lineWidth = 3;
      g.beginPath(); g.arc(c2[0], c2[1], 64, 0, Math.PI*2); g.stroke();
    });
    /* sprigs scattered thin across the open field */
    for(let i=0;i<40;i++){
      const sx = fx0 + Math.random()*(fx1-fx0), sy = fy0 + Math.random()*(fy1-fy0);
      if(Math.hypot((sx-mx)/1.25, sy-my) < 190) continue;
      g.fillStyle = Math.random() < 0.5 ? K.sage : K.rose;
      g.globalAlpha = 0.5;
      for(let p2=0;p2<5;p2++){
        const pa = p2*Math.PI*2/5;
        g.beginPath(); g.arc(sx + Math.cos(pa)*7, sy + Math.sin(pa)*7, 3.6, 0, Math.PI*2); g.fill();
      }
      g.globalAlpha = 1;
    }
    /* the weave: pale rows where the weft shows through, then wear */
    g.globalAlpha = 0.13;
    for(let y=0;y<h;y+=3){
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,244,224,.5)' : 'rgba(40,24,12,.5)';
      g.fillRect(FR, y, w-FR*2, 1.4);
    }
    g.globalAlpha = 1;
    blotch(g, w, h, K.field, 26, 1.2, 0.14);   /* abrash, the dye lot shifting */
    speckle(g, w, h, 3200, 0.06);
    /* fringe at the short ends */
    g.strokeStyle = '#ddd2b8'; g.lineWidth = 3; g.lineCap = 'round';
    for(let y=8; y<h-4; y+=9){
      g.beginPath(); g.moveTo(FR+2, y); g.lineTo(4, y + (Math.random()-0.5)*6); g.stroke();
      g.beginPath(); g.moveTo(w-FR-2, y); g.lineTo(w-4, y + (Math.random()-0.5)*6); g.stroke();
    }
    return c;
  }
  const rugC = rugCanvas();
  const rug = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD),
    new THREE.MeshStandardMaterial({map:tex(rugC), bumpMap:dataTex(rugC),
      bumpScale:0.006, roughness:0.97, transparent:true}));

  rug.position.set(1.30, 0.008, 0.30);
  rug.receiveShadow = true;
  rug.renderOrder = 1;
  scene.add(rug);
})();

/* ============================================================
   9b. THE LETTERS ON THE TABLE
   The contact details in this house are a thing you pick up, not
   a link in a footer. Three envelopes sit fanned on the coffee
   table between the couches — the one place in the room a visitor
   is already looking down at — and pressing them opens a letter.

   Built rather than textured onto the table so they cast their own
   shadow and can be lifted on hover; the words themselves live in
   the DOM, where they can be selected, copied and read out.
   ============================================================ */
const letters = new THREE.Group();
const LETTER = {w:0.235, d:0.158, t:0.006};
(function(){
  /* the face of an envelope: laid paper, a stamp in the corner, a postmark
     over it and three ruled lines where an address would go. Drawn once and
     shared — three envelopes in a stack are never read as three designs. */
  function faceCanvas(){
    const W = 470, H = 316, c = cvs(W, H), g = c.getContext('2d');
    g.fillStyle = '#e6d9b6'; g.fillRect(0, 0, W, H);
    blotch(g, W, H, '#e6d9b6', 30, 0.9, 0.34);
    /* laid lines — the ribbing in decent writing paper */
    g.strokeStyle = 'rgba(110,94,60,.11)'; g.lineWidth = 1;
    for(let x = 0; x < W; x += 7){
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    /* the flap seam, running down from the top corners to a point */
    g.strokeStyle = 'rgba(116,96,58,.46)'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(W/2, H*0.44); g.lineTo(W, 0); g.stroke();
    /* the stamp: a perforated square with a scrap of a picture in it */
    const sx = W - 108, sy = 26, sw = 76, sh = 92;
    g.fillStyle = '#f4ecd8'; g.fillRect(sx - 4, sy - 4, sw + 8, sh + 8);
    g.fillStyle = '#c96a4a'; g.fillRect(sx, sy, sw, sh);
    g.fillStyle = '#f3e7cf'; g.fillRect(sx + 8, sy + 8, sw - 16, sh - 30);
    g.fillStyle = '#7d9a86';
    g.beginPath();
    g.moveTo(sx + 10, sy + sh - 24); g.lineTo(sx + 32, sy + 30);
    g.lineTo(sx + 50, sy + sh - 24); g.closePath(); g.fill();
    g.fillStyle = '#e8c46a';
    g.beginPath(); g.arc(sx + 56, sy + 26, 9, 0, Math.PI*2); g.fill();
    /* perforations, bitten out of the edges */
    g.fillStyle = '#e6d9b6';
    for(let i = 0; i <= sw; i += 9){
      g.beginPath(); g.arc(sx + i, sy, 3.4, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(sx + i, sy + sh, 3.4, 0, Math.PI*2); g.fill();
    }
    for(let i = 0; i <= sh; i += 9){
      g.beginPath(); g.arc(sx, sy + i, 3.4, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(sx + sw, sy + i, 3.4, 0, Math.PI*2); g.fill();
    }
    /* the postmark, half on the stamp and half off it, as they always are */
    g.save();
    g.globalAlpha = 0.34; g.strokeStyle = '#3d4a58'; g.lineWidth = 3.4;
    g.translate(sx + 4, sy + sh - 8); g.rotate(-0.24);
    g.beginPath(); g.arc(0, 0, 30, 0, Math.PI*2); g.stroke();
    g.lineWidth = 2.2;
    for(let i = -2; i <= 2; i++){
      g.beginPath(); g.moveTo(34, i*7); g.lineTo(96, i*7); g.stroke();
    }
    g.restore();
    /* the address: three lines of writing that never resolves into words */
    g.strokeStyle = 'rgba(52,62,78,.66)'; g.lineWidth = 3.4; g.lineCap = 'round';
    [0, 1, 2].forEach(function(i){
      const y = H*0.60 + i*30, x0 = 74, x1 = x0 + 190 - i*34;
      g.beginPath(); g.moveTo(x0, y);
      for(let x = x0; x < x1; x += 11){
        g.lineTo(x, y + Math.sin(x*0.4 + i)*3.4);
      }
      g.stroke();
    });
    speckle(g, W, H, 900, 0.06);
    return c;
  }
  const faceC = faceCanvas();
  const faceMat = new THREE.MeshStandardMaterial({
    map:tex(faceC), bumpMap:dataTex(faceC), bumpScale:0.0018, roughness:0.88});
  const paperMat = new THREE.MeshStandardMaterial({color:'#d9cba6', roughness:0.92});
  /* [+x, -x, +y, -y, +z, -z] — only the face that shows is printed */
  const mats = [paperMat, paperMat, faceMat, paperMat, paperMat, paperMat];

  /* Five, dropped rather than squared. A neat fan reads as a display; the
     post actually lands in a heap, and a heap is the thing that says
     somebody left these here. Each one is offset, turned and tipped a
     little further than the last, and the top two sit right across the
     stack rather than on it. [x, z, turn, tilt] */
  [[-0.030, -0.022, -0.42, -0.020],
   [ 0.026,  0.014,  0.21,  0.016],
   [-0.014,  0.034, -0.11, -0.012],
   [ 0.040, -0.030,  0.62,  0.022],
   [-0.006,  0.008, -0.86,  0.014]].forEach(function(o, i){
    const e = new THREE.Mesh(new THREE.BoxGeometry(LETTER.w, LETTER.t, LETTER.d), mats);
    e.position.set(o[0], LETTER.t/2 + i*LETTER.t*0.9, o[1]);
    e.rotation.y = o[2];
    e.rotation.z = o[3];              /* the tip a slid envelope actually takes */
    e.castShadow = true; e.receiveShadow = true;
    letters.add(e);
  });

  /* a blob of sealing wax on the top one, so the heap has a full stop */
  const wax = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.019, 0.005, 18),
    new THREE.MeshStandardMaterial({color:'#8f3a34', roughness:0.42}));
  wax.position.set(0.054, LETTER.t*4.6 + 0.003, 0.014);
  wax.rotation.y = -0.06;
  wax.castShadow = true;
  letters.add(wax);

  /* On the left of the table, out past the stone figure. They used to sit
     at the front lip, where the near couch arm cut across them — so the one
     thing in the room that opens a way to write to me was invisible until
     you dollied in. Here they are clear of the figure, clear of the plant,
     and in frame from the moment the room opens. */
  letters.position.set(TAB.x - 0.55, TAB.h, TAB.z + 0.06);
  letters.rotation.y = 0.34;
  scene.add(letters);
})();

/* --- the shaft of sun itself, standing in the air ----------------------
   three additive quads laid along the light's own direction, each fading
   to nothing at its far end and feathered top and bottom. */
const SUN_DIR = new THREE.Vector3(-13.9, -5.9, -7.1).normalize();
const SUN_SIDE = new THREE.Vector3().crossVectors(SUN_DIR, new THREE.Vector3(0,1,0)).normalize();
const SUN_UP = new THREE.Vector3().crossVectors(SUN_SIDE, SUN_DIR).normalize();
function shaftStart(cz){ return new THREE.Vector3(SIDE_X - 0.12, (WIN.y0 + WIN.y1)/2, cz); }
(function shaft(){
  const q = new THREE.Quaternion().setFromRotationMatrix(
    new THREE.Matrix4().makeBasis(SUN_DIR, SUN_UP, SUN_SIDE));
  const len = 5.4;
  const shaftTex = tex((function(){
    const w = 256, h = 128, cc = cvs(w,h), gg = cc.getContext('2d');
    gg.clearRect(0,0,w,h);
    const gr = gg.createLinearGradient(0,0,w,0);
    gr.addColorStop(0.00, 'rgba(255,240,214,.85)');
    gr.addColorStop(0.45, 'rgba(255,240,214,.30)');
    gr.addColorStop(1.00, 'rgba(255,240,214,0)');
    gg.fillStyle = gr; gg.fillRect(0,0,w,h);
    gg.globalCompositeOperation = 'destination-in';
    const gm = gg.createLinearGradient(0,0,0,h);
    gm.addColorStop(0, 'rgba(255,255,255,0)');
    gm.addColorStop(0.3, 'rgba(255,255,255,1)');
    gm.addColorStop(0.7, 'rgba(255,255,255,1)');
    gm.addColorStop(1, 'rgba(255,255,255,0)');
    gg.fillStyle = gm; gg.fillRect(0,0,w,h);
    gg.globalCompositeOperation = 'source-over';
    return cc;
  })());
  WIN.czs.forEach(function(cz){
    [[-0.5, 0.035], [0.05, 0.05], [0.6, 0.035]].forEach(function(o){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(len, WIN.h*0.85),
        new THREE.MeshBasicMaterial({map:shaftTex, transparent:true, opacity:o[1],
          blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
      m.quaternion.copy(q);
      m.position.copy(shaftStart(cz)).addScaledVector(SUN_DIR, len/2).addScaledVector(SUN_SIDE, o[0]);
      m.renderOrder = 5;
      scene.add(m);
    });
  });
})();

/* dir: +1 turns forward, -1 turns back, 0 lays the page in with no flick */
function renderPage(i, dir){

  g2.fillStyle = vg; g2.fillRect(0,0,w,h);

  g2.lineWidth = 5;   g2.strokeRect(26, 26, w-52, h-52);

  g2.fillStyle = '#d9b96f'; g2.textAlign = 'center';
  g2.font = '600 64px Georgia, "Times New Roman", serif';
  g2.fillText("RAND'S", w/2, h*0.34);
  g2.fillText('PROJECTS', w/2, h*0.34 + 78);
  g2.fillRect(w*0.32, h*0.505, w*0.36, 2);
  g2.save();                                       /* a small stamped diamond */
  g2.translate(w/2, h*0.505 + 1); g2.rotate(Math.PI/4);
  g2.fillRect(-7, -7, 14, 14);
  g2.restore();
  g2.font = '400 21px Georgia, serif';
  g2.fillText('SELECTED WORK', w/2, h*0.80);
  speckle(g2, w, h, 900, 0.05);

const bookCoverMat = new THREE.MeshStandardMaterial({map:tex(bookCoverCanvas()),

const bookBackMat  = new THREE.MeshStandardMaterial({color:shift(P.accentDeep, -0.04),

const bookSpineMat = new THREE.MeshStandardMaterial({map:tex(bookSpineCanvas()),
  roughness:0.55, metalness:0.05, envMapIntensity:0.3});
/* [+x, -x, +y, -y, +z, -z] — cover faces +z, spine on the left */
const bookMesh = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.46, 0.06),
  [M.pages, bookSpineMat, M.pages, M.pages, bookCoverMat, bookBackMat]);
bookMesh.visible = false;

/* --- one invisible plane over the shelf face takes the click ------------ */
const shelfHit = new THREE.Mesh(new THREE.PlaneGeometry(SH.w, SH.top),
  new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false}));
shelfHit.position.set(0, SH.top/2, SH.front + 0.02);
scene.add(shelfHit);

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();

/* Everything solid standing between the eye and the shelf wall. The hit plane
   sits flat on the front of the joinery and knows nothing about the room in
   front of it, so a press on the couch back or the standing lamp used to sail
   straight through and pull a book off a shelf two metres behind them.

   Gathered once, because none of it moves. The library subtree is excluded on
   purpose: the books, the sphere, the vases and the bowls all stand slightly
   proud of the hit plane, and pressing one of those *is* pressing the shelf.
   Anything see-through is excluded too — the contact shadows on the floor,
   the window glass and the lamp halos are not things you can stand behind. */
const shelfBlockers = [];
(function(){
  /* the ladder counts as part of the shelves: it leans on them, it is what
     you would climb to reach the top bay, and a press landing on a rail is
     nobody's idea of "I meant the couch" */
  const inLibrary = new Set();
  library.traverse(function(o){ inLibrary.add(o); });
  ladder.traverse(function(o){ inLibrary.add(o); });
  scene.traverse(function(o){
    if(!o.isMesh || o === shelfHit || inLibrary.has(o)) return;
    const m = o.material;
    if(!m) return;
    const mats = Array.isArray(m) ? m : [m];
    const solid = mats.some(function(x){
      return x && !(x.transparent && (x.opacity < 0.92 || x.depthWrite === false));
    });
    if(solid) shelfBlockers.push(o);
  });
})();

function shelfAt(cx, cy){
  ndc.set((cx/innerWidth)*2 - 1, -(cy/innerHeight)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObject(shelfHit);
  if(!h.length) return null;
  /* a shade nearer than the plane itself, so the joinery's own front face and
     the plane hovering 2 cm off it never argue about which came first */
  const reach = h[0].distance - 0.03;
  const blocked = ray.intersectObjects(shelfBlockers, false);
  for(let i = 0; i < blocked.length; i++){
    if(blocked[i].distance > reach) break;          /* sorted: the rest are behind */
    if(blocked[i].object.visible) return null;
  }
  return h[0].point;
}

/* --- the flight --------------------------------------------------------- */
let bookState = 'idle';            /* idle | rising | open | returning */
let bookP = 0;
const bookFrom = new THREE.Vector3(), bookMid = new THREE.Vector3(),
      bookQ0 = new THREE.Quaternion();
const _bm = new THREE.Matrix4(), _bq = new THREE.Quaternion(),
      _bp = new THREE.Vector3(), _bd = new THREE.Vector3();
const _bTilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.04, 0, -0.05));

function bookTarget(out){
  camera.getWorldDirection(_bd);
  out.copy(camera.position).addScaledVector(_bd, 0.85);
  out.y -= 0.02;
  return out;
}
function bookFaceQ(pos){
  _bm.lookAt(camera.position, pos, camera.up);       /* +z of the box → camera */
  return _bq.setFromRotationMatrix(_bm).multiply(_bTilt);
}
function openBookAt(){
  if(bookState !== 'idle') return;
  renderPage(0, 0);                                  /* it opens to the first page */
  overlay.setAttribute('aria-hidden', 'false');
  if(reduced){ bookState = 'open'; overlay.classList.add('open'); playOpenAnim(); return; }
  /* wherever the press lands, the book always slides out of the middle bay's
     centre shelf — the one with books in it, above the armillary sphere */
  const midRow = rows[2];
  bookFrom.set(0, (midRow.y0 + midRow.y1)/2, SH.front - 0.10);
  bookMid.copy(bookFrom).add(new THREE.Vector3(0, 0.5, 1.4));
  bookMesh.position.copy(bookFrom);
  bookMesh.quaternion.setFromEuler(new THREE.Euler(0, 0.9, 0));
  bookQ0.copy(bookMesh.quaternion);
  bookMesh.visible = true;
  bookState = 'rising'; bookP = 0;
}
function closeBook(){
  if(bookState === 'open'){
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    if(!bookMesh.visible){ bookState = 'idle'; return; }
    bookState = 'returning'; bookP = 0;
  } else if(bookState === 'rising'){
    bookState = 'returning'; bookP = 1 - bookP;
  }
}
function bookEase(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
function bookTick(dt){
  if(bookState === 'rising' || bookState === 'returning'){
    bookP = Math.min(1, bookP + dt/0.9);
    let k = bookEase(bookP);
    if(bookState === 'returning') k = 1 - k;
    const tgt = bookTarget(_bp), ik = 1 - k;
    /* a quadratic arc: off the shelf, up and out, into the hand */
    bookMesh.position.set(
      ik*ik*bookFrom.x + 2*k*ik*bookMid.x + k*k*tgt.x,
      ik*ik*bookFrom.y + 2*k*ik*bookMid.y + k*k*tgt.y,
      ik*ik*bookFrom.z + 2*k*ik*bookMid.z + k*k*tgt.z);
    bookMesh.quaternion.copy(bookQ0).slerp(bookFaceQ(bookMesh.position), k);
    if(bookP >= 1){
      if(bookState === 'rising'){ bookState = 'open'; overlay.classList.add('open'); playOpenAnim(); }
      else { bookState = 'idle'; bookMesh.visible = false; }
    }
  } else if(bookState === 'open' && bookMesh.visible){
    /* keep station in front of the drifting camera */
    const tgt = bookTarget(_bp), k = Math.min(1, dt*8);
    bookMesh.position.lerp(tgt, k);
    bookMesh.quaternion.slerp(bookFaceQ(bookMesh.position), k);
  }
}

/* ============================================================
   13. INTERACTION
   ============================================================ */
const dom = renderer.domElement;
const look = {x:0, y:0}, target = {x:0, y:0};
let dolly = 0, dollyTarget = 0, yaw = 0, pitch = 0;
let dragging = false, lastX = 0, lastY = 0;
let pressX = 0, pressY = 0, pressT = 0;
dom.style.cursor = 'default';

/* `dragging` no longer turns the room — it only remembers that a press is in
   flight, so a press that slides off its mark can be told from a click */
dom.addEventListener('pointerdown', function(e){
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  pressX = e.clientX; pressY = e.clientY; pressT = performance.now();
  dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  target.x =  (e.clientX/innerWidth)*2 - 1;
  target.y = -(e.clientY/innerHeight)*2 + 1;
  /* a held press does not turn the room — the cursor's own position is the
     only thing the camera answers to */
  if(bookState === 'idle' && !letterOpen){
    /* the shelves and the letters are clickable, and the hand should say so */
    dom.style.cursor = (letterAt(e.clientX, e.clientY) ||
                        shelfAt(e.clientX, e.clientY)) ? 'pointer' : 'default';
  }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  dom.style.cursor = 'default';
}
dom.addEventListener('pointerup', function(e){
  /* nothing moves under a held press any more, so only a press that slid off
     its mark stops being a click — a slow, still press is still a press */
  const wasDrag = Math.abs(e.clientX - pressX) + Math.abs(e.clientY - pressY) > 12;
  endDrag();
  if(!wasDrag && bookState === 'idle' && !letterOpen){
    if(letterAt(e.clientX, e.clientY)){ openLetter(); return; }
    const pt = shelfAt(e.clientX, e.clientY);
    if(pt){ openBookAt(pt); }
  }
});
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', function(e){
  dollyTarget = THREE.MathUtils.clamp(dollyTarget - e.deltaY*0.0024, -0.30, 4.20);
}, {passive:true});

addEventListener('keydown', function(e){
  if(letterOpen){
    if(e.key === 'Escape') closeLetter();
    return;
  }
  if(bookState === 'open' || bookState === 'rising'){
    if(e.key === 'Escape') closeBook();
    else if(e.key === 'ArrowRight' && bookState === 'open') renderPage(pageIdx + 1, 1);
    else if(e.key === 'ArrowLeft'  && bookState === 'open') renderPage(pageIdx - 1, -1);
    return;
  }
});

/* the reading lamp switches. The shade's emissive and the halo over it are
   the whole of the change — there is no real light in this room to turn off,
   the bake already did that — so both are driven from one level that the
   loop eases towards `on`. */
function toggleReadingLamp(){
  readingLamp.on = !readingLamp.on;
}
const LAMP_EMISSIVE = 0.55, LAMP_GLOW = 0.10;
function updateReadingLamp(dt){
  const want = readingLamp.on ? 1 : 0;
  if(Math.abs(readingLamp.level - want) < 0.001){
    if(readingLamp.level === want) return;
    readingLamp.level = want;
  } else {
    readingLamp.level += (want - readingLamp.level) * Math.min(1, dt*5.0);
  }
  const L = readingLamp.level;
  readingLamp.mat.emissiveIntensity = LAMP_EMISSIVE * L;
  readingLamp.glow.material.opacity = LAMP_GLOW * L;
  readingLamp.glow.visible = L > 0.02;
  lampHint.label(readingLamp.on ? 'Turn the lamp off' : 'Turn the lamp on');
}

/* ============================================================
   13b. THE TAP BADGES
   A wall of baked joinery gives no sign of being pressable, and
   nor does a stack of envelopes on a table. The hand marks the
   shelves, the tick marks the letters, and between them they are
   the keyboard's only way into either.
   ============================================================ */
const shelfMid = rows[2];
const hints = TapHints.init({
  THREE: THREE, camera: camera,
  /* once the book or the letter is out, it owns the screen */
  enabled: function(){ return bookState === 'idle' && !letterOpen; }
});
hints.add({
  kind: 'tap',
  position: [0, (shelfMid.y0 + shelfMid.y1)/2, SH.front + 0.10],
  label: 'Projects',
  onActivate: function(){ openBookAt(); }
});
/* the envelopes on the coffee table are the room's one secondary answer, so
   they get the tick. It rides above the stack rather than on it — a badge
   flat on the table would cover the thing it is naming. */
hints.add({
  kind: 'write',
  object: letters, offset: [0, 0.11, 0.02],
  label: 'Leave me a letter',
  onActivate: function(){ openLetter(); }
});

/* the reading lamp behind the armchair. A plain circle, because a lamp
   switch needs noticing rather than explaining — and it sits at the foot of
   the stem, where the switch on a standard lamp actually is. */
const lampHint = hints.add({
  position: readingLamp.stem,
  label: 'Turn the lamp off',
  onActivate: toggleReadingLamp
});

/* ============================================================
   14. LOOP
   ============================================================ */
const lookAt = new THREE.Vector3();
const clock = new THREE.Clock();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  const k = Math.min(1, dt*3.0);
  look.x += (target.x - look.x)*k;
  look.y += (target.y - look.y)*k;
  dolly  += (dollyTarget - dolly)*Math.min(1, dt*3.2);

  /* the head never sits perfectly still, but only if they want it moving */
  const drift = reduced ? 0 : Math.sin(t*0.37)*0.012;

  camera.position.set(
    THREE.MathUtils.clamp(HOME.x + look.x*0.40 + yaw*2.4, -2.9, 1.6),
    HOME.y + look.y*0.14 + pitch*1.8 + drift,
    HOME.z - dolly
  );
  lookAt.set(0.12 + look.x*0.85 + yaw*2.1, 1.40 + look.y*0.24 + pitch*1.5, SHELF_Z);
  camera.lookAt(lookAt);

  bookTick(dt);
  updateReadingLamp(dt);
  hints.update();

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  frameCamera();
});

/* Lift on a composited frame rather than on a guessed delay. Two rAFs
   deep, so the first render has actually been painted and not merely
   queued — the veil comes off a finished picture, never a half-built
   one, and it comes off the instant that picture exists. */
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  fadeEl.classList.add('hidden');
}); });

})();
</script>
