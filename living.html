<style>
  :root{
    --ink:#1c1a17;
    --card:#fffdf9;
    --shadow:0 8px 30px rgba(28,22,14,.20);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;margin:0;padding:0;background:#0e0c09;overflow:hidden}
  body{
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* lens pass */
  .lens{position:fixed;inset:0;pointer-events:none;z-index:3}
  #vignette{background:radial-gradient(122% 92% at 50% 46%,
      rgba(0,0,0,0) 40%, rgba(34,26,16,.15) 74%, rgba(22,16,9,.42) 100%);}
  #bloom{background:radial-gradient(46% 68% at 78% 40%, rgba(255,232,196,.16), rgba(255,232,196,0) 64%);
         mix-blend-mode:screen;}
  #grain{opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");}

  /* hud */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .pill{
    position:absolute;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);border:0;color:var(--ink);
    display:flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:.01em;font-family:inherit;
    padding:12px 16px;cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(0)}
  .pill:focus-visible{outline:2px solid #1c1a17;outline-offset:3px}
  .square{padding:12px;width:46px;height:46px;justify-content:center}

  #plaque{top:22px;left:22px;cursor:default}
  #plaque:hover{transform:none}
  #plaque b{font-weight:600}
  #plaque span{color:#8c8375}



  /* --- the projects book -------------------------------------------- */
  #bookOverlay{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:rgba(14,10,5,.52);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .45s ease}
  #bookOverlay.open{opacity:1;pointer-events:auto}
  #spread{position:relative;display:flex;width:min(940px,94vw);height:min(560px,78vh);
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.55));
    transform:translateY(16px) scale(.97);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  #bookOverlay.open #spread{transform:none}
  .page{flex:1;position:relative;overflow:hidden;min-width:0}
  .pageL{background:#efe8d8;border-radius:8px 0 0 8px;transform-origin:right center;
    box-shadow:inset -20px 0 30px -18px rgba(60,40,15,.55)}
  .pageR{background:#f9f3e4;border-radius:0 8px 8px 0;transform-origin:left center;
    box-shadow:inset 20px 0 30px -18px rgba(60,40,15,.45);
    padding:44px 46px 40px;display:flex;flex-direction:column}
  /* the stack of pages showing at each fore-edge */
  .pageL::before,.pageR::before{content:"";position:absolute;top:6px;bottom:6px;width:7px;
    background:repeating-linear-gradient(90deg,#e6dcc4 0 1.6px,#f6efdd 1.6px 3px)}
  .pageL::before{left:0;border-radius:8px 0 0 8px}
  .pageR::before{right:0;border-radius:0 8px 8px 0}
  /* the screenshot is laid on the page, not cropped into it: whatever shape it
     arrives in, it is scaled to fit and the paper carries the rest. the shadow
     is a drop-shadow so it hugs the picture, not the empty page around it */
  #pgImg{position:absolute;inset:26px 22px 26px 28px;width:calc(100% - 50px);height:calc(100% - 52px);
    object-fit:contain;object-position:center;background:none;
    filter:drop-shadow(0 2px 5px rgba(70,52,22,.28))}
  #pgKicker{margin:0 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8c8375}
  #pgTitle{margin:0 0 14px;font-size:26px;line-height:1.15;font-weight:600;color:#241f18;
    font-family:Georgia,"Times New Roman",serif}
  #pgBody{margin:0;font-size:14.5px;line-height:1.65;color:#3c3730;overflow:auto;white-space:pre-line}
  #pgTech{margin:14px 0 0;font-size:12.5px;color:#8c8375;letter-spacing:.03em}
  #pgLink{margin-top:18px;align-self:flex-start;font-size:13px;color:#2c4a66;text-decoration:none;
    border-bottom:1px solid rgba(44,74,102,.4);padding-bottom:1px}
  /* the standing footer on every right-hand page — the book is a selection,
     the rest of the work is on github */
  #pgGithub{margin:auto 70px 0 0;padding-top:12px;border-top:1px solid rgba(90,70,40,.18);
    font-size:12.5px;color:#8c8375;letter-spacing:.01em}
  #pgGithub a{color:#2c4a66;text-decoration:none;border-bottom:1px solid rgba(44,74,102,.4);
    padding-bottom:1px}
  #pgGithub a:hover{border-bottom-color:#2c4a66}
  #pgNum{position:absolute;right:20px;bottom:14px;font-size:11px;color:#a39781;letter-spacing:.08em}
  .pgArrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
    background:var(--card);box-shadow:var(--shadow);color:var(--ink);
    font-size:26px;line-height:1;font-family:inherit;
    display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .pgArrow:hover{transform:translateY(-50%) scale(1.08)}
  .pgArrow:focus-visible,#pgClose:focus-visible{outline:2px solid #fffdf9;outline-offset:3px}
  #pgPrev{left:-24px} #pgNext{right:-24px}
  #pgClose{position:absolute;top:22px;right:22px;z-index:2}
  /* the cover swinging open: the left page starts folded over the right one
     and falls flat, overshooting a touch the way a heavy board cover does */
  #spread.opening .pageL{animation:coverL .95s cubic-bezier(.16,.9,.28,1)}
  #spread.opening .pageR{animation:coverR .95s cubic-bezier(.16,.9,.28,1)}
  @keyframes coverL{
    0%{transform:perspective(1400px) rotateY(150deg);filter:brightness(.55)}
    62%{filter:brightness(1.06)}
    78%{transform:perspective(1400px) rotateY(-7deg)}
    100%{transform:none;filter:none}}
  @keyframes coverR{
    0%{transform:perspective(1400px) rotateY(-16deg);filter:brightness(.8)}
    100%{transform:none;filter:none}}
  /* a page turn: the arriving page swings right over from the far side while
     the other page counter-flexes — a real flick, not a shiver */
  #spread.turnF .pageR{animation:turnFR .62s cubic-bezier(.2,.75,.25,1)}
  #spread.turnF .pageL{animation:turnFL .62s cubic-bezier(.2,.75,.25,1)}
  #spread.turnB .pageL{animation:turnBL .62s cubic-bezier(.2,.75,.25,1)}
  #spread.turnB .pageR{animation:turnBR .62s cubic-bezier(.2,.75,.25,1)}
  @keyframes turnFR{
    0%{opacity:0;transform:perspective(1400px) rotateY(-104deg);filter:brightness(.6)}
    38%{opacity:1}
    82%{transform:perspective(1400px) rotateY(5deg)}
    100%{transform:none;filter:none}}
  @keyframes turnFL{
    0%{transform:perspective(1400px) rotateY(34deg);filter:brightness(.72)}
    100%{transform:none;filter:none}}
  @keyframes turnBL{
    0%{opacity:0;transform:perspective(1400px) rotateY(104deg);filter:brightness(.6)}
    38%{opacity:1}
    82%{transform:perspective(1400px) rotateY(-5deg)}
    100%{transform:none;filter:none}}
  @keyframes turnBR{
    0%{transform:perspective(1400px) rotateY(-34deg);filter:brightness(.72)}
    100%{transform:none;filter:none}}
  @media (max-width:820px){
    #spread{flex-direction:column;width:min(94vw,430px);height:min(82vh,720px)}

    #pgImg{inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}

  /* --- the letter off the coffee table ------------------------------- */
  #letter{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:rgba(14,10,5,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .35s ease;padding:20px}
  #letter.open{opacity:1;pointer-events:auto}
  /* a sheet of writing paper, not a dialog box: torn-cream ground, a ruled

  #ltSheet{position:relative;width:min(94vw,500px);max-height:88vh;overflow:auto;
    background:#f7f1e1;color:#2b2823;border-radius:3px;
    padding:38px 40px 34px 46px;

    transform:scale(.96) rotate(-.7deg);
    transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  #letter.open #ltSheet{transform:rotate(-.7deg)}

  #ltSheet::before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;
    background:#f7f1e1;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 11px);

  #ltClose{position:absolute;top:10px;right:12px;background:none;border:0;

  #ltClose:hover{color:#1c1a17}
  #ltClose:focus-visible{outline:2px solid #7a3f38;outline-offset:2px;border-radius:6px}
  #ltSheet .lt-stamp{position:absolute;top:20px;right:22px;width:52px;height:64px;
    background:#c96a4a;border:4px solid #efe6d0;
    box-shadow:0 1px 0 rgba(120,90,60,.35);transform:rotate(3deg)}
  #ltSheet .lt-stamp::after{content:"";position:absolute;inset:6px 6px 20px;background:#f3e7cf}
  #ltSheet h2{margin:0 0 4px;font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(26px,5vw,34px);line-height:1.1;font-weight:600;color:#241f18;
    padding-right:70px}
  #ltSheet .lt-lede{margin:0 0 22px;font-size:15px;line-height:1.7;color:#4a443b;
    padding-right:56px}
  #ltWays{display:flex;flex-direction:column;gap:2px}
  #ltWays a{display:flex;align-items:center;gap:14px;padding:11px 10px;margin:0 -10px;
    border-radius:9px;text-decoration:none;color:#2b2823;

  #ltWays a:hover{background:rgba(122,63,56,.09);transform:translateX(3px)}
  #ltWays a:focus-visible{outline:2px solid #7a3f38;outline-offset:2px}
  #ltWays svg{flex:none;color:#7a3f38}
  #ltWays .what{font-weight:600;font-size:15px;color:#241f18}
  #ltWays .where{font-size:13px;color:#7d7466;word-break:break-all}
  #ltSign{margin:22px 0 0;font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:15px;color:#6b6255}
  @media (max-width:820px){ #ltSheet{padding:30px 22px 26px 34px} }

  #fade{position:fixed;inset:0;background:#0e0c09;z-index:9;
        transition:opacity .45s ease;pointer-events:none}
  #fade.hidden{opacity:0}

  @media (max-width:820px){
    #plaque{top:14px;left:14px;font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>

<script>
(function(){
"use strict";
/* the phone never gets here — lite.js has already sent it to the
   written version — but the scene is guarded at its own door so
   that it can only ever run on the branch that loaded three.js */
if(window.HOUSE_LITE) return;
if(!window.THREE) return;

/* ============================================================
   0. HUD
   ============================================================ */
const fadeEl = document.getElementById('fade');

/* ============================================================
   1. PALETTE
   ============================================================ */
/*  >>> EVERY COLOUR IN THE ROOM IS SET HERE. Edit a hex, reload. <<< */
const P = {
  /* --- shell --- */
  plaster:  '#ecdfc6',   // walls — warm cream, not gallery grey
  ceiling:  '#f6f0e2',
  cornice:  '#f0e9db',   // crown moulding
  skirt:    '#e6ddcb',   // skirting board
  floor:    '#8b6743',   // oak boards

  /* --- the shelf wall --- */
  shelf:    '#f0ebdf',   // the built-in is painted white — the books carry the colour
  shelfBack:'#eae3d3',   // bay backs a shade warmer than the carcass

  /* --- soft furnishing --- */
  couch:    '#e0795a',   // coral weave — plays off the teal pillows
  couchTrim:'#c4614a',   // the base rail, a shade deeper
  accent:   '#1c6b70',   // >>> pillows AND curtains share this one <<< (peacock teal)
  accentDeep:'#11454a',  // the fold shadow inside that same cloth

  /* --- objects --- */
  table:    '#5c422d',   // dark wood — couch and chair feet keep it
  paint:    '#f2eee3',   // white-painted furniture: coffee table, doors, casings
  ladder:   '#e9e7de',   // the ladder is painted white like the shelves
  console:  '#452e1f',   // the dark walnut cabinet by the garden doors
  pot:      '#cfc8b8',   // pale ceramic
  leaf:     '#35603a',
  brass:    '#c9a763'
};

/* the book spines. many colours, deliberately unmatched */
const BOOKS = ['#7d2f24','#26425e','#3d6b60','#b07f24','#77485f','#2d4a2b',
               '#95431f','#2c3760','#68222c','#4c5a26','#9c6528','#22514c',
               '#5a3868','#86322c','#374f6b','#b08c3c','#2b3c29','#6b4224'];

/* ============================================================
   2. RENDERER / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.90;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dcd2be');

/* room box. the camera looks down -z at the shelf wall. */
const SHELF_Z = -5.0;          // far wall, carries the library
const REAR_Z  =  5.0;          // wall behind the camera
const SIDE_X  =  3.8;          // +x is the window wall, -x is the TV wall
const WALL_H  =  3.30;
const DEPTH   = REAR_Z - SHELF_Z;
const MID_Z   = (SHELF_Z + REAR_Z)/2;

const HOME = new THREE.Vector3(-0.20, 1.75, 4.35);

const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 120);
camera.position.copy(HOME);

const H_HALF = 38 * Math.PI/180;                 /* constant horizontal FOV */
function frameCamera(){
  camera.aspect = innerWidth / innerHeight;
  const v = 2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180/Math.PI;
  camera.fov = THREE.MathUtils.clamp(v, 30, 64);
  camera.updateProjectionMatrix();
}
frameCamera();

/* ============================================================
   3. TEXTURE FOUNDRY
   every surface in the room is painted onto a canvas here. nothing
   loads from the network, so the room is one file and starts instantly.
   ============================================================ */
function cvs(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = ANISO;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
/* a linear (non-colour) copy of a canvas, for bump and roughness maps */
function dataTex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.anisotropy = ANISO;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
function shift(hex, dL, dS){
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, THREE.MathUtils.clamp(hsl.s + (dS||0), 0, 1),
                  THREE.MathUtils.clamp(hsl.l + dL, 0.02, 0.98));
  return '#' + c.getHexString();
}
function rgba(hex, a){
  const c = new THREE.Color(hex);
  return 'rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + a + ')';
}
function blotch(g, w, h, base, count, spread, alpha){
  for(let i=0;i<count;i++){
    const x = Math.random()*w, y = Math.random()*h;
    const r = (0.04 + Math.random()*0.22) * Math.max(w,h) * spread;
    const c = shift(base, (Math.random()-0.5)*0.10, (Math.random()-0.5)*0.06);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, rgba(c, alpha));
    grd.addColorStop(1, rgba(c, 0));
    g.fillStyle = grd; g.fillRect(x-r, y-r, r*2, r*2);
  }
}
function speckle(g, w, h, count, alpha){
  for(let i=0;i<count;i++){
    g.fillStyle = 'rgba(50,40,26,' + (Math.random()*alpha).toFixed(3) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 1.6, 1.1);
  }
}
/* linear black gradient — bakes an occlusion falloff straight into a map */
function ao(g, w, h, x0,y0,x1,y1, a){
  const d = g.createLinearGradient(x0,y0,x1,y1);
  d.addColorStop(0, 'rgba(40,30,18,' + a + ')');
  d.addColorStop(1, 'rgba(40,30,18,0)');
  g.fillStyle = d; g.fillRect(0,0,w,h);
}
/* soft round falloff, used for every contact shadow on the floor */
function radialCanvas(power, cut){
  const S = 256, c = cvs(S,S), g = c.getContext('2d');
  const grd = g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  for(let i=0;i<=10;i++){
    const t = i/10;
    grd.addColorStop(t, 'rgba(255,255,255,' + Math.pow(1-t, 1/(power||1)) * (1-(cut||0)) + ')');
  }
  g.fillStyle = grd; g.fillRect(0,0,S,S);
  return c;
}

/* --- walls ------------------------------------------------------------- */
function plasterCanvas(w, h, o){
  o = o || {};
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.plaster; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.plaster, 90, 1.0, 0.5);
  blotch(g, w, h, shift(P.plaster,-0.05), 40, 0.5, 0.28);
  g.globalAlpha = 0.06; g.lineCap = 'round';
  for(let i=0;i<70;i++){                                   /* trowel drag */
    g.strokeStyle = shift(P.plaster, (Math.random()-0.5)*0.14);
    g.lineWidth = 2 + Math.random()*14;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y);
    g.lineTo(x + (Math.random()-0.5)*w*0.28, y + (Math.random()-0.5)*h*0.12); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, Math.round(w*h/900), 0.04);
  if(o.bottom) ao(g, w, h, 0, h, 0, h*(1-o.bottom), 0.34);
  if(o.top)    ao(g, w, h, 0, 0, 0, h*o.top, 0.30);
  if(o.left)   ao(g, w, h, 0, 0, w*o.left, 0, 0.36);
  if(o.right)  ao(g, w, h, w, 0, w*(1-o.right), 0, 0.36);
  return c;
}

function trimCanvas(base){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 30, 0.8, 0.5);
  g.globalAlpha = 0.14;                      /* faint brush lay-off */
  for(let i=0;i<90;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.12);
    g.lineWidth = 0.8 + Math.random()*3;
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w, y + (Math.random()-0.5)*6); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 600, 0.04);
  return c;
}

/* --- timber ------------------------------------------------------------ */
/* one grain generator serves the floor, the shelves, the table and the
   ladder — only the base colour and the tightness of the grain change. */
function grainCanvas(base, tight, w, h){
  w = w || 512; h = h || 512;
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 40, 0.9, 0.40);
  /* long fibres running the length of the board */
  for(let i=0;i<Math.round(h*tight);i++){
    const y = Math.random()*h;
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.16, (Math.random()-0.5)*0.05);
    g.globalAlpha = 0.10 + Math.random()*0.30;
    g.lineWidth = 0.6 + Math.random()*2.6;
    g.beginPath(); g.moveTo(0, y);
    for(let x=0; x<=w; x+=w/8) g.lineTo(x, y + Math.sin(x*0.012 + i)*2.4 + (Math.random()-0.5)*2);
    g.stroke();
  }
  /* a few knots and the cathedral figure that runs around them */
  g.globalAlpha = 1;
  for(let k=0;k<3;k++){
    const kx = Math.random()*w, ky = Math.random()*h, kr = 4 + Math.random()*8;
    for(let r=kr*5; r>kr*0.6; r-=2.2){
      g.strokeStyle = shift(base, -0.10 - Math.random()*0.06);
      g.globalAlpha = 0.12;
      g.beginPath(); g.ellipse(kx, ky, r, r*0.42, 0.4, 0, Math.PI*2); g.stroke();
    }
    g.globalAlpha = 0.5;
    g.fillStyle = shift(base, -0.20);
    g.beginPath(); g.ellipse(kx, ky, kr*0.8, kr*0.34, 0.4, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 700, 0.05);
  return c;
}

/* the floor gets board joints and an end-stop drawn over the grain, so the
   planks read as separate pieces rather than one printed sheet */
function floorCanvas(){
  const w = 1024, h = 1024, c = cvs(w,h), g = c.getContext('2d');
  const rows = 6, rowH = h/rows;
  for(let r=0;r<rows;r++){
    /* every board is a slightly different piece of timber */
    const base = shift(P.floor, (Math.random()-0.5)*0.10, (Math.random()-0.5)*0.05);
    const board = grainCanvas(base, 0.9, w, Math.round(rowH));
    g.drawImage(board, 0, r*rowH);
    /* butt joints, staggered row to row */
    const offset = Math.random()*w;
    for(let j=0;j<2;j++){
      const x = (offset + j*w/2) % w;
      g.fillStyle = 'rgba(30,20,10,.42)';
      g.fillRect(x, r*rowH, 2.2, rowH);
    }
    /* the shadow line where one board meets the next */
    g.fillStyle = 'rgba(28,18,8,.50)'; g.fillRect(0, r*rowH, w, 2.4);
    g.fillStyle = 'rgba(255,244,222,.12)'; g.fillRect(0, r*rowH + 2.4, w, 1.6);
  }
  blotch(g, w, h, P.floor, 40, 1.1, 0.20);          /* wear across the whole floor */
  speckle(g, w, h, 2400, 0.045);
  return c;
}

/* --- cloth ------------------------------------------------------------- */
/* a real weave: two sets of threads crossing, so the couch catches a
   grazing light the way linen does instead of reading as flat paint */
function weaveCanvas(base, scale){
  const S = 512, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,S,S);
  const step = scale || 6;
  /* each thread is a ridge: lit along one edge, shaded along the other,
     so the cloth catches a grazing light instead of reading as print */
  for(let x=0;x<S;x+=step){
    g.globalAlpha = 0.22;
    g.fillStyle = shift(base, 0.05 + Math.random()*0.04);
    g.fillRect(x, 0, step*0.5, S);
    g.globalAlpha = 0.30;
    g.fillStyle = rgba(shift(base, 0.16), 0.5);
    g.fillRect(x, 0, 1, S);
    g.fillStyle = rgba(shift(base, -0.18), 0.5);
    g.fillRect(x + step*0.5, 0, 1, S);
  }
  for(let y=0;y<S;y+=step){
    g.globalAlpha = 0.22;
    g.fillStyle = shift(base, -0.05 - Math.random()*0.04);
    g.fillRect(0, y, S, step*0.5);
    g.globalAlpha = 0.26;
    g.fillStyle = rgba(shift(base, 0.13), 0.5);
    g.fillRect(0, y, S, 1);
    g.fillStyle = rgba(shift(base, -0.16), 0.5);
    g.fillRect(0, y + step*0.5, S, 1);
  }
  g.globalAlpha = 1;
  blotch(g, S, S, base, 34, 0.8, 0.26);
  /* slubs — the odd fat thread pulled through the weave */
  g.globalAlpha = 0.5;
  for(let i=0;i<26;i++){
    const hor = Math.random() < 0.5, p = Math.random()*S, l0 = Math.random()*S,
          len = 20 + Math.random()*70;
    g.fillStyle = shift(base, 0.10 + Math.random()*0.06);
    if(hor) g.fillRect(l0, p, len, 1.6); else g.fillRect(p, l0, 1.6, len);
  }
  g.globalAlpha = 1;
  speckle(g, S, S, 1800, 0.05);
  return c;
}

/* velvet: the pattern is not a weave but a nap — broad soft patches where
   the pile lies toward the light or away from it, smeared and directionless,
   the way a crushed velvet cover photographs */
function velvetCanvas(base, pattern){
  const S = 512, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,S,S);
  if(pattern){
    /* peacock eyes, barely there — the print reads at a glance, never loud */
    for(let i=0;i<26;i++){
      const x = Math.random()*S, y = Math.random()*S,
            s = 18 + Math.random()*20, a = Math.random()*Math.PI*2;
      g.save(); g.translate(x,y); g.rotate(a);
      g.globalAlpha = 0.16;
      g.strokeStyle = shift(base, 0.16, 0.10); g.lineWidth = 2;
      g.beginPath(); g.ellipse(0, 0, s*0.55, s, 0, 0, Math.PI*2); g.stroke();
      g.globalAlpha = 0.20;
      g.fillStyle = shift(base, -0.08, 0.12);
      g.beginPath(); g.ellipse(0, s*0.15, s*0.30, s*0.45, 0, 0, Math.PI*2); g.fill();
      g.globalAlpha = 0.26;
      g.fillStyle = shift(base, 0.24, 0.02);
      g.beginPath(); g.arc(0, s*0.26, s*0.13, 0, Math.PI*2); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
  }
  for(let i=0;i<46;i++){
    const x = Math.random()*S, y = Math.random()*S, r = S*(0.08 + Math.random()*0.22);
    const lighter = Math.random() < 0.5;
    const col = shift(base, lighter ? 0.07 + Math.random()*0.07 : -(0.05 + Math.random()*0.06),
                            lighter ? -0.06 : 0.02);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, rgba(col, 0.55));
    grd.addColorStop(1, rgba(col, 0));
    g.save();
    g.translate(x,y); g.rotate(Math.random()*Math.PI); g.scale(1.6, 0.7); g.translate(-x,-y);
    g.fillStyle = grd; g.fillRect(x-r*2, y-r*2, r*4, r*4);
    g.restore();
  }
  /* faint strokes, the brush of a hand over the pile */
  g.globalAlpha = 0.10; g.lineCap = 'round';
  for(let i=0;i<160;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.18);
    g.lineWidth = 1 + Math.random()*3;
    const x = Math.random()*S, y = Math.random()*S,
          a = Math.random()*Math.PI, l = 10 + Math.random()*40;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, S, S, 900, 0.04);
  return c;
}
/* where the pile catches the light it goes glossy; a roughness map in grey */
function velvetRoughCanvas(){
  const S = 512, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = '#c2c2c2'; g.fillRect(0,0,S,S);
  for(let i=0;i<34;i++){
    const x = Math.random()*S, y = Math.random()*S, r = S*(0.08 + Math.random()*0.20);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, 'rgba(120,120,120,.5)');
    grd.addColorStop(1, 'rgba(120,120,120,0)');
    g.save();
    g.translate(x,y); g.rotate(Math.random()*Math.PI); g.scale(1.6, 0.7); g.translate(-x,-y);
    g.fillStyle = grd; g.fillRect(x-r*2, y-r*2, r*4, r*4);
    g.restore();
  }
  return c;
}

/* the curtain carries its own fold shading in the map as well as in the
   geometry — the light through it is soft, and soft light alone will not
   separate one fold from the next */
function curtainCanvas(){
  const w = 512, h = 1024, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.accent; g.fillRect(0,0,w,h);
  /* the peacock print goes down first, before the folds shade it */
  for(let i=0;i<40;i++){
    const x = Math.random()*w, y = Math.random()*h,
          s = 26 + Math.random()*26, a = (Math.random()-0.5)*0.8;
    g.save(); g.translate(x,y); g.rotate(a);
    g.globalAlpha = 0.20;
    g.strokeStyle = shift(P.accent, 0.15, 0.08); g.lineWidth = 2.4;
    g.beginPath(); g.ellipse(0, 0, s*0.5, s, 0, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(0, s); g.quadraticCurveTo(s*0.12, s*1.5, 0, s*1.9); g.stroke();
    g.globalAlpha = 0.22;
    g.fillStyle = shift(P.accent, -0.06, 0.14);
    g.beginPath(); g.ellipse(0, s*0.15, s*0.26, s*0.42, 0, 0, Math.PI*2); g.fill();
    g.globalAlpha = 0.30;
    g.fillStyle = '#cfe8e2';
    g.beginPath(); g.arc(0, s*0.28, s*0.12, 0, Math.PI*2); g.fill();
    g.restore();
  }
  g.globalAlpha = 1;
  const folds = 9;
  for(let i=0;i<folds;i++){
    const x0 = (i/folds)*w, x1 = ((i+1)/folds)*w;
    const grd = g.createLinearGradient(x0,0,x1,0);
    grd.addColorStop(0.00, rgba(P.accentDeep, 0.78));
    grd.addColorStop(0.38, rgba(P.accent, 0.0));
    grd.addColorStop(0.58, 'rgba(255,246,226,.26)');
    grd.addColorStop(0.66, 'rgba(255,246,226,.08)');
    grd.addColorStop(1.00, rgba(P.accentDeep, 0.78));
    g.fillStyle = grd; g.fillRect(x0, 0, x1-x0, h);
  }
  /* weave over the top of the shading */
  g.globalAlpha = 0.16;
  for(let y=0;y<h;y+=5){
    g.fillStyle = shift(P.accent, (Math.random()-0.5)*0.10);
    g.fillRect(0, y, w, 2.4);
  }
  /* the nap streaking down the drop, the way the pile of the cloth falls */
  g.globalAlpha = 0.10; g.lineCap = 'round';
  for(let i=0;i<120;i++){
    const x = Math.random()*w, y0 = Math.random()*h, len = 60 + Math.random()*220;
    g.strokeStyle = shift(P.accent, (Math.random()-0.5)*0.16);
    g.lineWidth = 1 + Math.random()*2.4;
    g.beginPath(); g.moveTo(x, y0);
    g.lineTo(x + (Math.random()-0.5)*6, y0 + len); g.stroke();
  }
  g.globalAlpha = 1;
  /* dye lots — the colour drifts a little across the piece */
  blotch(g, w, h, P.accent, 24, 0.9, 0.20);
  ao(g, w, h, 0, 0, 0, h*0.10, 0.34);       /* gathered dark at the heading */
  ao(g, w, h, 0, h, 0, h*0.86, 0.20);       /* dust and shade at the hem */
  speckle(g, w, h, 1200, 0.04);
  return c;
}

/* --- the library ------------------------------------------------------- */
/* one cloth map, tinted per book by the material colour. binding bands top
   and bottom, and a blocked panel where the title would be stamped. */
function spineCanvas(){
  const w = 128, h = 512, c = cvs(w,h), g = c.getContext('2d');
  /* mid grey, not white — the material colour multiplies through this map,
     and a white ground turns every binding into a pastel */
  g.fillStyle = '#c8c8c8'; g.fillRect(0,0,w,h);
  /* the curve of the spine, brightest along its crown */
  const grd = g.createLinearGradient(0,0,w,0);
  grd.addColorStop(0.00, 'rgba(0,0,0,.46)');
  grd.addColorStop(0.30, 'rgba(255,255,255,.06)');
  grd.addColorStop(0.52, 'rgba(255,255,255,.13)');
  grd.addColorStop(1.00, 'rgba(0,0,0,.50)');
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  /* raised bands */
  g.fillStyle = 'rgba(0,0,0,.20)';
  g.fillRect(0, h*0.13, w, 5); g.fillRect(0, h*0.85, w, 5);
  /* the stamped panel — a suggestion of type, never readable */
  g.fillStyle = 'rgba(255,255,255,.10)';
  g.fillRect(w*0.18, h*0.24, w*0.64, h*0.20);
  g.fillStyle = 'rgba(0,0,0,.18)';
  for(let i=0;i<4;i++) g.fillRect(w*0.26, h*(0.27 + i*0.04), w*(0.20+Math.random()*0.28), 4);
  g.globalAlpha = 0.30;
  for(let y=0;y<h;y+=3){                                   /* buckram weave */
    g.fillStyle = Math.random()>0.5 ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
    g.fillRect(0, y, w, 1.4);
  }
  g.globalAlpha = 1;
  return c;
}

/* the block of pages seen from the top and the fore-edge */
function pagesCanvas(){
  const S = 256, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = '#e8dfc8'; g.fillRect(0,0,S,S);
  for(let i=0;i<S;i+=2){
    g.fillStyle = 'rgba(120,104,74,' + (0.05 + Math.random()*0.20).toFixed(3) + ')';
    g.fillRect(i, 0, 1, S);
  }
  blotch(g, S, S, '#ddd2b6', 20, 0.7, 0.35);               /* foxing */
  ao(g, S, S, 0, 0, 0, S*0.5, 0.22);
  return c;
}

/* --- greenery ---------------------------------------------------------- */
/* a leaf silhouette on transparent ground. one plane per leaf with this as
   both map and alphaMap is far cheaper, and reads better, than leaf geometry. */
function leafCanvas(){
  const w = 256, h = 384, c = cvs(w,h), g = c.getContext('2d');
  g.clearRect(0,0,w,h);
  const cx = w/2;
  g.beginPath();
  g.moveTo(cx, h*0.02);
  g.bezierCurveTo(w*0.98, h*0.30, w*0.90, h*0.78, cx, h*0.99);
  g.bezierCurveTo(w*0.10, h*0.78, w*0.02, h*0.30, cx, h*0.02);
  g.closePath();
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0.00, shift(P.leaf, 0.05));
  grd.addColorStop(0.45, P.leaf);
  grd.addColorStop(1.00, shift(P.leaf, -0.11));
  g.fillStyle = grd; g.fill();
  g.save(); g.clip();
  /* midrib and the veins running off it */
  g.strokeStyle = rgba(shift(P.leaf, 0.16), 0.75); g.lineWidth = 5;
  g.beginPath(); g.moveTo(cx, h*0.03); g.lineTo(cx, h*0.97); g.stroke();
  g.lineWidth = 2.2;
  for(let i=1;i<11;i++){
    const y = h*(0.06 + i*0.085);
    g.strokeStyle = rgba(shift(P.leaf, 0.12), 0.55);
    g.beginPath(); g.moveTo(cx, y); g.quadraticCurveTo(cx + w*0.22, y + h*0.02, cx + w*0.40, y + h*0.075); g.stroke();
    g.beginPath(); g.moveTo(cx, y); g.quadraticCurveTo(cx - w*0.22, y + h*0.02, cx - w*0.40, y + h*0.075); g.stroke();
  }
  blotch(g, w, h, P.leaf, 18, 0.6, 0.30);
  /* a highlight down one side, so the leaves are not all one flat green */
  const sh = g.createLinearGradient(0,0,w,0);
  sh.addColorStop(0, 'rgba(255,255,235,.10)');
  sh.addColorStop(0.5, 'rgba(255,255,235,0)');
  sh.addColorStop(1, 'rgba(0,20,0,.22)');
  g.fillStyle = sh; g.fillRect(0,0,w,h);
  g.restore();
  return c;
}

/* ============================================================
   4. MATERIALS
   ============================================================ */
const floorTex   = tex(floorCanvas(), 3, 3);
const floorBump  = dataTex(floorCanvas(), 3, 3);
const shelfTex   = tex(grainCanvas(P.shelf, 1.2), 2, 2);
const shelfBackTex = tex(grainCanvas(P.shelfBack, 0.7), 2, 2);
const tableTex   = tex(grainCanvas(P.table, 1.4), 1, 1);
const ladderTex  = tex(grainCanvas(P.ladder, 1.1), 1, 4);
const consoleTex = tex(grainCanvas(P.console, 1.2), 2, 1);
const corniceTex = tex(trimCanvas(P.cornice), 4, 1);
const skirtTex   = tex(trimCanvas(P.skirt), 6, 1);
const couchTex   = tex(weaveCanvas(P.couch, 6), 6, 6);
const couchBump  = dataTex(weaveCanvas(P.couch, 6), 6, 6);
const trimClothTex = tex(weaveCanvas(P.couchTrim, 5), 2, 2);
const accentTex  = tex(velvetCanvas(P.accent, true), 1, 1);
const accentBump = dataTex(weaveCanvas(P.accent, 4), 3, 3);
const accentRough= dataTex(velvetRoughCanvas(), 1, 1);
const curtainTex = tex(curtainCanvas());
const spineTex   = tex(spineCanvas());
const spineBump  = dataTex(spineCanvas());
const pagesTex   = tex(pagesCanvas());
const leafTex    = tex(leafCanvas());

const M = {
  floor:   new THREE.MeshStandardMaterial({map:floorTex, bumpMap:floorBump, bumpScale:0.010,
                                           roughness:0.42, metalness:0.02}),
  wall:    new THREE.MeshStandardMaterial({roughness:0.96}),   /* map set per wall */
  ceiling: new THREE.MeshStandardMaterial({color:P.ceiling, roughness:1}),
  cornice: new THREE.MeshStandardMaterial({map:corniceTex, bumpMap:corniceTex, bumpScale:0.004, roughness:0.82}),
  skirt:   new THREE.MeshStandardMaterial({map:skirtTex, bumpMap:skirtTex, bumpScale:0.004, roughness:0.80}),

  shelf:   new THREE.MeshStandardMaterial({map:shelfTex, bumpMap:shelfTex, bumpScale:0.005,
                                           roughness:0.52, metalness:0.03}),
  shelfBack:new THREE.MeshStandardMaterial({map:shelfBackTex, roughness:0.88}),
  table:   new THREE.MeshStandardMaterial({map:tableTex, bumpMap:tableTex, bumpScale:0.005,
                                           roughness:0.34, metalness:0.04}),
  ladder:  new THREE.MeshStandardMaterial({map:ladderTex, bumpMap:ladderTex, bumpScale:0.006, roughness:0.60}),
  console: new THREE.MeshStandardMaterial({map:consoleTex, bumpMap:consoleTex, bumpScale:0.005, roughness:0.40}),

  /* vertexColors carries the baked crevice shade on the cushions — every
     geometry this touches supplies a colour attribute (white on the frames) */
  couch:   new THREE.MeshStandardMaterial({map:couchTex, bumpMap:couchBump, bumpScale:0.032,
                                           roughnessMap:couchBump, roughness:0.96, metalness:0,
                                           vertexColors:true}),
  couchTrim:new THREE.MeshStandardMaterial({map:trimClothTex, bumpMap:trimClothTex, bumpScale:0.010, roughness:0.95}),
  /* velvet: smooth to the touch (tiny bump) but the roughness swims across
     the nap, so the pile catches a soft sheen where it faces the window */
  accent:  new THREE.MeshStandardMaterial({map:accentTex, bumpMap:accentBump, bumpScale:0.010,
                                           roughnessMap:accentRough, roughness:1.0, metalness:0,
                                           vertexColors:true}),
  /* the emissive is the afternoon coming through the cloth — it follows the
     fold map, so the crowns of the folds glow and the returns stay dark */
  curtain: new THREE.MeshStandardMaterial({map:curtainTex, bumpMap:curtainTex, bumpScale:0.028,
                                           roughness:0.88, side:THREE.DoubleSide,
                                           emissive:'#93a49f', emissiveMap:curtainTex,
                                           emissiveIntensity:0.55}),
  pages:   new THREE.MeshStandardMaterial({map:pagesTex, roughness:0.92}),
  /* no alphaMap: three multiplies alpha by that map's GREEN channel, and a
     mid-green leaf then tests out everywhere. the canvas carries a real
     alpha channel already, so alphaTest reads it straight off `map` — and
     testing rather than blending keeps overlapping blades depth-sorted. */
  leaf:    new THREE.MeshStandardMaterial({map:leafTex,
                                           alphaTest:0.5, side:THREE.DoubleSide,
                                           roughness:0.62, metalness:0.02}),
  stem:    new THREE.MeshStandardMaterial({color:'#4a5f38', roughness:0.72}),
  pot:     new THREE.MeshStandardMaterial({color:P.pot, roughness:0.62, metalness:0.03}),
  soil:    new THREE.MeshStandardMaterial({color:'#3a2c20', roughness:1}),
  brass:   new THREE.MeshStandardMaterial({color:P.brass, roughness:0.28, metalness:0.90}),
  iron:    new THREE.MeshStandardMaterial({color:'#2d2a26', roughness:0.42, metalness:0.70}),
  glass:   new THREE.MeshStandardMaterial({color:'#dfeaf2', roughness:0.03, metalness:0.25,
                                           transparent:true, opacity:0.07, side:THREE.DoubleSide})
};
/* the pillow pile is all teal, three depths of it, all patterned */
function velvetMat(hex){
  return new THREE.MeshStandardMaterial({map:tex(velvetCanvas(hex, true)),
    bumpMap:accentBump, bumpScale:0.010, roughnessMap:accentRough, roughness:1.0,
    metalness:0, vertexColors:true});
}
M.velvetTeal2 = velvetMat('#2b7f83');    /* a step lighter */
M.velvetTeal3 = velvetMat('#123f46');    /* nearly petrol */

/* ============================================================
   5. HELPERS
   ============================================================ */
function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* a box with its corners taken off. everything upholstered uses this —
   a hard 90 degree edge is the single clearest tell that a couch is a box. */
function roundedGeo(w,h,d,r,seg){
  r = Math.min(r, w/2-0.002, h/2-0.002);
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);   s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);   s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  const bev = Math.min(0.045, d*0.34);
  const g = new THREE.ExtrudeGeometry(s,{depth:Math.max(0.02, d - bev*2), bevelEnabled:true,
    bevelSize:bev, bevelThickness:bev, bevelSegments:seg||3, curveSegments:seg||6});
  g.center();
  /* a white vertex-colour ground, so this geometry can share a
     vertex-coloured material with the shaded cushions */
  const n = g.attributes.position.count, col = new Float32Array(n*3);
  col.fill(1);
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return g;
}
function soft(w,h,d,r,mat,x,y,z){
  const m = new THREE.Mesh(roundedGeo(w,h,d,r), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* a cushion is a rounded slab pinched at the middle of each face, so it
   swells the way a filled one does rather than staying a slab */
function cushionGeo(w,h,d,r){
  const g = roundedGeo(w,h,d,r,5);
  const p = g.attributes.position;
  const col = g.attributes.color;
  const v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    const ax = Math.min(1, Math.abs(v.x)/(w/2)), ay = Math.min(1, Math.abs(v.y)/(h/2));
    /* swell strongest at the centre of the face, nothing at the seams */
    const swell = Math.cos(ax*Math.PI/2) * Math.cos(ay*Math.PI/2);
    p.setZ(i, v.z * (1 + swell*0.55));
    p.setX(i, v.x * (1 - swell*0.03));
    p.setY(i, v.y * (1 - swell*0.03));
    /* occlusion baked into the vertices: the seams sink into shade where
       one cushion presses the next, the crown of the swell comes up */
    const c = 0.78 + 0.25*swell;
    col.setXYZ(i, c, c, c);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
function cushion(w,h,d,r,mat,x,y,z){
  const m = new THREE.Mesh(cushionGeo(w,h,d,r), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
/* a throw pillow is the same slab stuffed harder: a fatter swell, the corners
   pulled out into the little ears the seam leaves, and a faint crumple over
   each face so the fill reads as down rather than foam */
function pillowGeo(w,h,d){
  const g = roundedGeo(w,h,d,Math.min(w,h)*0.12,7);
  const p = g.attributes.position;
  const col = g.attributes.color;
  const v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    const nx = v.x/(w/2), ny = v.y/(h/2);
    const ax = Math.min(1, Math.abs(nx)), ay = Math.min(1, Math.abs(ny));
    const swell = Math.cos(ax*Math.PI/2) * Math.cos(ay*Math.PI/2);
    /* down fill: the crumple is broad and soft, never crinkly */
    const crumple = Math.sin(v.x*11.0 + v.y*5.0) * Math.sin(v.y*13.0 - v.x*2.0);
    /* the karate-chop dip at the top centre, where a hand set it down */
    const dip = Math.exp(-Math.pow(nx/0.36, 2)) * Math.pow(Math.max(0, ny), 2.2);
    /* the fill has settled: the bottom swells wider */
    const settle = Math.pow(Math.max(0, -ny), 1.6);
    p.setZ(i, v.z * (1 + swell*1.18 + settle*swell*0.26 - dip*0.45)
              + crumple*d*(0.045 + settle*0.06)*swell);
    const ear = Math.pow(ax*ay, 2.4) * 0.15;
    p.setX(i, v.x * (1 + ear) * (1 - swell*0.055) * (1 + settle*0.06));
    p.setY(i, v.y * (1 + ear) * (1 - swell*0.055) - dip*h*0.12);
    const c = 0.72 + 0.30*swell - dip*0.10;
    col.setXYZ(i, c, c, c);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}
/* the dark that gathers where a leg or a base meets the floor. the shadow
   map alone goes soft and grey down there; this puts the contact back. */
const contactTex = new THREE.CanvasTexture(radialCanvas(1.6, 0.15));
function contact(w, d, opacity, x, z, rot){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({map:contactTex, color:0x241a0e, transparent:true,
      opacity:opacity, depthWrite:false}));
  m.rotation.x = -Math.PI/2;
  m.rotation.z = rot || 0;
  m.position.set(x, 0.010, z);
  m.renderOrder = 2;
  return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x||0, y||0, z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ============================================================
   6. THE SHELL — floor, walls, ceiling, and the hole for the window
   ============================================================ */
/* two of them now, standing shoulder to shoulder down the wall, a pier of
   plaster between carrying the middle curtain */
const WIN = {
  w: 2.20,          // each, along z
  h: 1.78,
  sill: 0.94,
  czs: [-1.30, 1.50],   // centres, on the z axis
  jamb: 0.16        // how deep the reveal is
};
WIN.y0 = WIN.sill;  WIN.y1 = WIN.sill + WIN.h;
WIN.zEdges = WIN.czs.map(function(cz){ return [cz - WIN.w/2, cz + WIN.w/2]; });

/* --- floor --- */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(SIDE_X*2, DEPTH), M.floor);
floor.rotation.x = -Math.PI/2;
floor.position.set(0, 0, MID_Z);
floor.receiveShadow = true;
scene.add(floor);

/* --- ceiling --- */
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(SIDE_X*2, DEPTH), M.ceiling);
ceil.rotation.x = Math.PI/2;
ceil.position.set(0, WALL_H, MID_Z);
ceil.receiveShadow = true;
/* and it has to stop the sun as well. rays that clear the top of the window
   wall would otherwise fall straight through it into the room. */
ceil.castShadow = true;
M.ceiling.shadowSide = THREE.DoubleSide;
scene.add(ceil);

/* --- walls -------------------------------------------------------------
   each wall gets its own plaster bake with the occlusion painted into the
   corners it actually has, so the room darkens where two surfaces meet
   without a single extra light doing the work. */
function wallMat(canvas, rx, ry){
  const t = tex(canvas, rx, ry);
  return new THREE.MeshStandardMaterial({map:t, bumpMap:dataTex(canvas, rx, ry),
                                         bumpScale:0.004, roughness:0.96,
                                         shadowSide:THREE.DoubleSide});
}
function wallPlane(w, h, mat, x, y, z, ry){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x,y,z);
  if(ry) m.rotation.y = ry;
  m.receiveShadow = true;
  /* the walls have to stop the sun. without this the opening is decoration
     and the room lights evenly from every side. */
  m.castShadow = true;
  scene.add(m);
  return m;
}

/* the shelf wall — almost entirely covered, so it only needs a plain bake */
wallPlane(SIDE_X*2, WALL_H, wallMat(plasterCanvas(512, 512, {bottom:0.20, top:0.14}), 2, 1),
          0, WALL_H/2, SHELF_Z, 0);

/* the garden-door wall, on the left. takes the window light square on, so
   its bake is the one that carries the most contrast. */
const DOOR = {cz: -0.75, w: 1.90, h: 2.30};
DOOR.z0 = DOOR.cz - DOOR.w/2;  DOOR.z1 = DOOR.cz + DOOR.w/2;
(function doorWall(){
  const x = -SIDE_X, ry = Math.PI/2;
  const matD = wallMat(plasterCanvas(512, 512, {bottom:0.22, top:0.16, left:0.12}), 1, 1);
  /* over the doors */
  wallPlane(DOOR.w, WALL_H - DOOR.h, matD, x, (WALL_H + DOOR.h)/2, DOOR.cz, ry);
  /* either side */
  const backW = DOOR.z0 - SHELF_Z;
  wallPlane(backW, WALL_H, matD, x, WALL_H/2, SHELF_Z + backW/2, ry);
  const frontW = REAR_Z - DOOR.z1;
  wallPlane(frontW, WALL_H, matD, x, WALL_H/2, DOOR.z1 + frontW/2, ry);
})();

/* behind the camera */
wallPlane(SIDE_X*2, WALL_H, wallMat(plasterCanvas(512, 512, {bottom:0.20, top:0.14}), 2, 1),
          0, WALL_H/2, REAR_Z, Math.PI);

/* the window wall, on the right — pieces around both openings */
const winWallMat = wallMat(plasterCanvas(512, 512, {bottom:0.18, top:0.14}), 1, 1);
(function windowWall(){
  const x = SIDE_X, ry = -Math.PI/2;
  WIN.czs.forEach(function(cz){
    /* under the sill */
    wallPlane(WIN.w, WIN.y0, winWallMat, x, WIN.y0/2, cz, ry);
    /* over the head */
    wallPlane(WIN.w, WALL_H - WIN.y1, winWallMat, x, (WALL_H + WIN.y1)/2, cz, ry);
  });
  /* three piers: far side, the one between, near side */
  const backW = WIN.zEdges[0][0] - SHELF_Z;
  wallPlane(backW, WALL_H, winWallMat, x, WALL_H/2, SHELF_Z + backW/2, ry);
  const midW = WIN.zEdges[1][0] - WIN.zEdges[0][1];
  wallPlane(midW, WALL_H, winWallMat, x, WALL_H/2, WIN.zEdges[0][1] + midW/2, ry);
  const frontW = REAR_Z - WIN.zEdges[1][1];
  wallPlane(frontW, WALL_H, winWallMat, x, WALL_H/2, WIN.zEdges[1][1] + frontW/2, ry);
})();

/* --- skirting, all four walls ------------------------------------------ */
const SKIRT_H = 0.16, SKIRT_T = 0.035;
function skirting(len, x, z, ry){
  const g = new THREE.Group();
  g.add(box(len, SKIRT_H, SKIRT_T, M.skirt, 0, SKIRT_H/2, 0));
  g.add(box(len, 0.022, SKIRT_T*1.45, M.skirt, 0, SKIRT_H, 0));   /* the moulded top */
  g.position.set(x, 0, z);
  if(ry) g.rotation.y = ry;
  scene.add(g);
  return g;
}
skirting(SIDE_X*2, 0, SHELF_Z + SKIRT_T/2, 0);
skirting(SIDE_X*2, 0, REAR_Z - SKIRT_T/2, Math.PI);
/* the left wall's skirting parts around the garden doors */
skirting(DOOR.z0 - SHELF_Z, -SIDE_X + SKIRT_T/2, (SHELF_Z + DOOR.z0)/2, Math.PI/2);
skirting(REAR_Z - DOOR.z1, -SIDE_X + SKIRT_T/2, (DOOR.z1 + REAR_Z)/2, Math.PI/2);
/* the window wall's skirting stops short of nothing — the sill is above it */
skirting(DEPTH, SIDE_X - SKIRT_T/2, MID_Z, -Math.PI/2);

/* --- cornice ------------------------------------------------------------ */
const CORN_H = 0.13, CORN_T = 0.10;
function cornice(len, x, z, ry){
  const g = new THREE.Group();
  g.add(box(len, CORN_H, CORN_T, M.cornice, 0, WALL_H - CORN_H/2, 0));
  g.add(box(len, 0.035, CORN_T*1.5, M.cornice, 0, WALL_H - CORN_H, 0));
  g.position.set(x, 0, z);
  if(ry) g.rotation.y = ry;
  scene.add(g);
}
cornice(SIDE_X*2, 0, SHELF_Z + CORN_T/2, 0);
cornice(SIDE_X*2, 0, REAR_Z - CORN_T/2, Math.PI);
cornice(DEPTH, -SIDE_X + CORN_T/2, MID_Z, Math.PI/2);
cornice(DEPTH, SIDE_X - CORN_T/2, MID_Z, -Math.PI/2);

/* ============================================================
   7. THE LIBRARY — the whole of the shelf wall
   ============================================================ */
const SH = {
  w: 7.10,          // overall width
  d: 0.34,          // carcass depth
  top: 3.06,        // height of the top slab
  t: 0.05,          // divider thickness
  slab: 0.04,       // shelf thickness
  plinth: 0.10,
  cab: 0.86,        // the base cabinets come up to here
  bays: 7
};
SH.x0 = -SH.w/2;  SH.front = SHELF_Z + SH.d;
SH.pitch = SH.w / SH.bays;
SH.bayW = SH.pitch - SH.t;

const library = new THREE.Group();
scene.add(library);

/* the back of each bay is darker and carries occlusion on all four edges —
   this is what gives the shelves depth without lighting the inside of them */
const bayBackTex = tex((function(){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.drawImage(grainCanvas(P.shelfBack, 0.7, w, h), 0, 0);
  ao(g, w, h, 0, 0, w*0.30, 0, 0.42);
  ao(g, w, h, w, 0, w*0.70, 0, 0.42);
  ao(g, w, h, 0, 0, 0, h*0.34, 0.46);
  ao(g, w, h, 0, h, 0, h*0.66, 0.40);
  return c;
})());
const bayBackMat = new THREE.MeshStandardMaterial({map:bayBackTex, roughness:0.90});

/* --- the carcass: base cabinets below, open shelving above --------------- */
/* plinth, the run of cabinets, and the counter they carry */
library.add(box(SH.w, SH.plinth, SH.d + 0.02, M.shelf, 0, SH.plinth/2, SHELF_Z + (SH.d + 0.02)/2));
library.add(box(SH.w, SH.cab - SH.plinth - SH.slab, SH.d + 0.06, M.shelf,
                0, SH.plinth + (SH.cab - SH.plinth - SH.slab)/2, SHELF_Z + (SH.d + 0.06)/2));
library.add(box(SH.w + 0.08, SH.slab, SH.d + 0.10, M.shelf, 0, SH.cab - SH.slab/2, SHELF_Z + (SH.d + 0.10)/2));
/* top slab, and a cap moulding over it */
library.add(box(SH.w, SH.slab, SH.d, M.shelf, 0, SH.top - SH.slab/2, SHELF_Z + SH.d/2));
library.add(box(SH.w + 0.06, 0.05, SH.d + 0.05, M.shelf, 0, SH.top + 0.025, SHELF_Z + (SH.d + 0.05)/2));

/* shaker doors, one per bay, knobs pairing left and right */
(function cabinetDoors(){
  const CABF = SHELF_Z + SH.d + 0.06;          /* face of the cabinet run */
  for(let b=0; b<SH.bays; b++){
    const cx = SH.x0 + (b + 0.5)*SH.pitch;
    const dw = SH.bayW - 0.03;
    const dh = SH.cab - SH.plinth - SH.slab - 0.05;
    const dy = SH.plinth + dh/2 + 0.012;
    const fr = 0.055;
    library.add(box(dw, dh, 0.012, M.shelf, cx, dy, CABF + 0.000));       /* field */
    library.add(box(dw, fr, 0.016, M.shelf, cx, dy + dh/2 - fr/2, CABF + 0.008));
    library.add(box(dw, fr, 0.016, M.shelf, cx, dy - dh/2 + fr/2, CABF + 0.008));
    library.add(box(fr, dh, 0.016, M.shelf, cx - dw/2 + fr/2, dy, CABF + 0.008));
    library.add(box(fr, dh, 0.016, M.shelf, cx + dw/2 - fr/2, dy, CABF + 0.008));
    const kn = new THREE.Mesh(new THREE.SphereGeometry(0.015, 12, 10), M.brass);
    kn.position.set(cx + (b % 2 ? -1 : 1)*(dw/2 - 0.09), dy + dh/2 - 0.09, CABF + 0.022);
    kn.castShadow = true;
    library.add(kn);
  }
})();

/* the eight verticals, cabinet top to counter of the crown */
for(let i=0;i<=SH.bays;i++){
  const x = SH.x0 + i*SH.pitch;
  library.add(box(SH.t, SH.top - SH.cab - SH.slab, SH.d, M.shelf,
                  x, SH.cab + (SH.top - SH.cab - SH.slab)/2, SHELF_Z + SH.d/2));
}

/* --- shelf levels, shared across every bay so the unit reads as built in - */
const ROW_GAPS = [0.44, 0.39, 0.43, 0.37, 0.41];
const rows = [];          /* {y0, y1} — the clear opening of each row */
(function(){
  let y = SH.cab;
  for(let r=0; r<ROW_GAPS.length; r++){
    const gap = ROW_GAPS[r];
    rows.push({y0:y, y1:y + gap});
    y += gap;
    if(r < ROW_GAPS.length - 1){
      library.add(box(SH.w - SH.t, SH.slab, SH.d - 0.015, M.shelf,
                      0, y + SH.slab/2, SHELF_Z + (SH.d - 0.015)/2));
      y += SH.slab;
    }
  }
  /* the last row runs up to the underside of the top slab */
  rows[rows.length-1].y1 = SH.top - SH.slab;
})();

/* --- a back panel per bay, above the cabinets ---------------------------- */
for(let b=0; b<SH.bays; b++){
  const cx = SH.x0 + (b + 0.5)*SH.pitch;
  const p = new THREE.Mesh(new THREE.PlaneGeometry(SH.bayW, SH.top - SH.cab), bayBackMat);
  p.position.set(cx, SH.cab + (SH.top - SH.cab)/2, SHELF_Z + 0.012);
  p.receiveShadow = true;
  library.add(p);
}

/* --- the books ----------------------------------------------------------
   generated, not placed. each row of each bay is filled left to right by
   picking a run type — a block of uprights, a flat stack, or a leaner that
   needs the gap after it — until the row is full. */
const clothBump = dataTex(weaveCanvas('#8a8a8a', 4), 1, 1);
const spineTexH = (function(){                    /* the same map, turned for a book on its side */
  const t = tex(spineCanvas());
  t.center.set(0.5, 0.5); t.rotation = Math.PI/2;
  return t;
})();

const matCache = {};
function bookMats(hex, flat){
  const key = hex + (flat ? 'f' : 'v');
  if(matCache[key]) return matCache[key];
  const spine = new THREE.MeshStandardMaterial({
    map: flat ? spineTexH : spineTex, bumpMap:spineBump, bumpScale:0.004,
    color: hex, roughness:0.78, metalness:0.02
  });
  const cover = new THREE.MeshStandardMaterial({
    color: shift(hex, -0.05), bumpMap:clothBump, bumpScale:0.003, roughness:0.84
  });
  /* [+x, -x, +y, -y, +z, -z] — the spine always faces the room */
  const list = flat ? [M.pages, M.pages, cover, cover, spine, M.pages]
                    : [cover, cover, M.pages, M.pages, spine, M.pages];
  matCache[key] = list;
  return list;
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rand(a,b){ return a + Math.random()*(b-a); }

const bookGroup = new THREE.Group();
library.add(bookGroup);

function addBook(w, h, d, hex, flat, x, y, z, tilt){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bookMats(hex, flat));
  m.position.set(x, y, z);
  if(tilt) m.rotation.z = tilt;
  m.castShadow = true; m.receiveShadow = true;
  bookGroup.add(m);
  return m;
}

/* a few cells are kept for objects, not books */
const RESERVED = {'1,3':1, '3,1':1, '5,2':1};

for(let b=0; b<SH.bays; b++){
  const bayL = SH.x0 + b*SH.pitch + SH.t/2;
  for(let r=0; r<rows.length; r++){
    if(RESERVED[b + ',' + r]) continue;
    const row = rows[r];
    const gap = row.y1 - row.y0;
    let x = bayL + rand(0.008, 0.03);
    const limit = bayL + SH.bayW - 0.01;
    /* one row in nine is left part empty — a full wall with no air in it
       looks printed rather than lived in */
    const slack = Math.random() < 0.11 ? rand(0.25, 0.55) : 0;

    while(x < limit - slack - 0.03){
      const roll = Math.random();
      const room = limit - slack - x;

      if(roll < 0.60){
        /* --- a run of uprights ------------------------------------- */
        const n = 2 + Math.floor(Math.random()*6);
        for(let i=0; i<n && x < limit - slack - 0.03; i++){
          const t  = rand(0.024, 0.058);
          const h  = Math.min(gap - 0.012, rand(0.70, 0.97) * gap);
          const d  = Math.min(SH.d - 0.05, rand(0.15, 0.26));
          const set= rand(0.006, 0.045);                     /* how far back it sits */
          addBook(t, h, d, pick(BOOKS), false,
                  x + t/2, row.y0 + h/2, SH.front - set - d/2, 0);
          x += t + rand(0.0006, 0.004);
        }

      } else if(roll < 0.78 && room > 0.20){
        /* --- a flat stack ------------------------------------------- */
        const len = Math.min(room - 0.02, rand(0.17, 0.26));
        const n = 2 + Math.floor(Math.random()*3);
        let sy = row.y0;
        for(let i=0;i<n;i++){
          const t = rand(0.028, 0.050);
          if(sy + t > row.y1 - 0.01) break;
          const d = Math.min(SH.d - 0.05, rand(0.16, 0.24));
          const jitter = rand(-0.012, 0.012);                /* never a perfect stack */
          const bk = addBook(len - Math.abs(jitter)*0.4, t, d, pick(BOOKS), true,
                             x + len/2 + jitter, sy + t/2, SH.front - rand(0.01, 0.04) - d/2, 0);
          bk.rotation.y = rand(-0.03, 0.03);
          sy += t;
        }
        x += len + rand(0.004, 0.02);

      } else if(room > 0.16){
        /* --- a leaner, propped on whatever is to its left ------------ */
        const t = rand(0.030, 0.055);
        const h = Math.min(gap - 0.02, rand(0.74, 0.94) * gap);
        const d = Math.min(SH.d - 0.05, rand(0.16, 0.25));
        const dir = Math.random() < 0.5 ? 1 : -1;
        const tilt = dir * rand(0.13, 0.30);
        /* a tilted book pivots about its bottom corner, so it leans into
           the space beside it and its base stays on the shelf */
        const lean = Math.sin(Math.abs(tilt)) * h/2;
        /* clamped to its own bay: the lean offset would otherwise walk the
           end book out through the side of the carcass */
        const half = t/2 + lean;
        const lx = THREE.MathUtils.clamp(x + t/2 + dir*lean*0.5,
                                         bayL + half, bayL + SH.bayW - half);
        addBook(t, h, d, pick(BOOKS), false,
                lx, row.y0 + Math.cos(tilt)*h/2 + 0.004,
                SH.front - rand(0.01, 0.04) - d/2, tilt);
        x += t + lean + rand(0.01, 0.03);

      } else {
        break;
      }
    }
  }
}

      coming back toward the camera

  seatX0: 2.42,   // where the long arm's seat stops
  seatZ0: -1.55,  // the far end of the long arm

/* --- horizontal pad: thickness ends up vertical ------------------------- */
function padH(w, dep, th, mat, x, y, z, ry){
  const m = new THREE.Mesh(cushionGeo(w, dep, th, Math.min(w,dep)*0.14), mat);
  m.rotation.x = -Math.PI/2;
  if(ry) m.rotation.z = ry;
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  couch.add(m);
  return m;
}
/* --- upright pad: faces -z by default, ry turns it ---------------------- */
function padV(len, h, th, mat, x, y, z, ry){
  const m = new THREE.Mesh(cushionGeo(len, h, th, Math.min(len,h)*0.16), mat);
  if(ry) m.rotation.y = ry;
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  couch.add(m);
  return m;
}
/* --- a scatter pillow: ry aims it, tilt leans it back, roll knocks it
       off square. nothing on a real couch is plumb. its height is not
       picked by eye — the tilt says how tall the slab stands, and it is
       set down on the seat from that, pressed in a touch. --------------- */
function pillow(size, mat, x, z, ry, tilt, roll){
  const th = 0.19;
  tilt = tilt || 0;
  /* the seat under it: platform + cushion, plus a little of the swell */
  const seatTop = C.seatY + SEAT_T + 0.02;
  const fullT = th*2.15;                      /* seam thickness once stuffed */
  const halfV = (size*0.94/2)*Math.abs(Math.cos(tilt)) + (fullT/2)*Math.abs(Math.sin(tilt));
  const y = seatTop + Math.max(halfV, fullT/2) - 0.03;
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry || 0;
  const m = new THREE.Mesh(pillowGeo(size, size*0.94, th), mat);
  m.rotation.x = tilt;
  m.rotation.z = roll || 0;
  m.castShadow = true; m.receiveShadow = true;
  g.add(m);
  couch.add(g);
  /* the dark it presses into the seat — sat above the cushion's swell so
     the plane never cuts the cloth */
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(size*1.30, size*1.10),
    new THREE.MeshBasicMaterial({map:contactTex, color:0x1a1208, transparent:true,
      opacity:0.26, depthWrite:false}));
  sh.rotation.x = -Math.PI/2;
  sh.position.set(x, C.seatY + SEAT_T + 0.062, z);
  sh.renderOrder = 2;
  couch.add(sh);
  return g;
}

/* --- sash, glazing bars, glass ----------------------------------------- */
(function sash(){
  const x = SIDE_X - WIN.jamb + 0.03, f = 0.055;
  const frameMat = new THREE.MeshStandardMaterial({map:tex(trimCanvas('#f4eee2'), 2, 2), roughness:0.62});
  /* --- the reflection standing in the glass: three diagonal streaks of the
     room's own light, additive and faint, just inside each pane ----------- */
  const streakTex = tex((function(){
    const w = 256, h = 256, cc = cvs(w,h), gg = cc.getContext('2d');
    gg.clearRect(0,0,w,h);
    gg.save();
    gg.translate(w/2,h/2); gg.rotate(-0.5); gg.translate(-w/2,-h/2);
    [[w*0.10, w*0.10, 0.16], [w*0.38, w*0.05, 0.11], [w*0.62, w*0.16, 0.08]]
    .forEach(function(b){
      const gr = gg.createLinearGradient(b[0], 0, b[0]+b[1], 0);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.5, 'rgba(235,242,252,' + b[2] + ')');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      gg.fillStyle = gr; gg.fillRect(b[0]-2, -h*0.4, b[1]+4, h*1.8);
    });
    gg.restore();
    return cc;
  })());
  WIN.czs.forEach(function(cz, i){
    const z0 = WIN.zEdges[i][0], z1 = WIN.zEdges[i][1];
    /* outer frame */
    windowGrp.add(box(f, WIN.h, f, frameMat, x, (WIN.y0+WIN.y1)/2, z0 + f/2));
    windowGrp.add(box(f, WIN.h, f, frameMat, x, (WIN.y0+WIN.y1)/2, z1 - f/2));
    windowGrp.add(box(f, f, WIN.w, frameMat, x, WIN.y0 + f/2, cz));
    windowGrp.add(box(f, f, WIN.w, frameMat, x, WIN.y1 - f/2, cz));
    /* one mullion and two transoms — two lights over three */
    windowGrp.add(box(f*0.7, WIN.h, f*0.62, frameMat, x, (WIN.y0+WIN.y1)/2, cz));
    for(let k=1;k<3;k++){
      windowGrp.add(box(f*0.7, f*0.55, WIN.w, frameMat, x, WIN.y0 + WIN.h*k/3, cz));
    }
    /* the glass itself */
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w - 0.06, WIN.h - 0.06), M.glass);
    glass.rotation.y = -Math.PI/2;
    glass.position.set(x - 0.012, (WIN.y0+WIN.y1)/2, cz);
    windowGrp.add(glass);
    /* its reflection — mirrored in the second pane so they do not match */
    const refl = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w - 0.08, WIN.h - 0.08),
      new THREE.MeshBasicMaterial({map:streakTex, transparent:true,
        blending:THREE.AdditiveBlending, depthWrite:false}));
    refl.rotation.y = -Math.PI/2;
    refl.position.set(x - 0.006, (WIN.y0+WIN.y1)/2, cz);
    if(i === 1) refl.scale.x = -1;
    refl.renderOrder = 3;
    windowGrp.add(refl);
  });

  /* --- what stands outside: two painted planes, sky well back and the
     garden nearer, so they slide over each other as the camera moves ----- */
  function skyCanvas(){
    const w = 1024, h = 512, cc = cvs(w,h), gg = cc.getContext('2d');
    const gr = gg.createLinearGradient(0,0,0,h);
    gr.addColorStop(0.00, '#5c99d2');
    gr.addColorStop(0.30, '#8fbde4');
    gr.addColorStop(0.55, '#cbe1ef');
    gr.addColorStop(0.68, '#f0ead2');
    gr.addColorStop(1.00, '#e9e6c2');
    gg.fillStyle = gr; gg.fillRect(0,0,w,h);
    /* fair-weather cumulus, small and scattered — this room's sky carries
       cloud flecks where the terrace doors around the corner stay clear.
       shaded base first, dropped a touch, then the sunlit body over it */
    for(let i=0;i<8;i++){
      const cx = Math.random()*w, cy = h*(0.05 + Math.random()*0.32),
            r = 24 + Math.random()*52, a = 0.55 + Math.random()*0.35;
      const far = cy/h/0.4;                       /* lower = nearer horizon */
      gg.globalAlpha = a*0.55;
      gg.fillStyle = 'rgba(170,182,198,0.7)';
      gg.beginPath(); gg.ellipse(cx, cy + r*0.22, r*0.9, r*0.26, 0, 0, Math.PI*2); gg.fill();
      gg.globalAlpha = a*(1 - far*0.35);
      [[0,0,1],[-0.7,0.1,0.66],[0.65,0.08,0.7],[-0.2,-0.28,0.55],[0.28,-0.24,0.5]].forEach(function(p){
        const px = cx + p[0]*r, py = cy + p[1]*r*0.8;
        const cg = gg.createRadialGradient(px - r*0.2, py - r*0.25, r*0.05, px, py, r*p[2]);
        cg.addColorStop(0, 'rgba(255,255,255,.95)');
        cg.addColorStop(0.7, 'rgba(250,251,253,.75)');
        cg.addColorStop(1, 'rgba(244,247,251,0)');
        gg.fillStyle = cg;
        gg.beginPath(); gg.ellipse(px, py, r*p[2], r*p[2]*0.55, 0, 0, Math.PI*2); gg.fill();
      });
      gg.globalAlpha = 1;
    }
    /* two ridges of distant ground, solid enough to read as land */
    gg.fillStyle = '#9db584';
    gg.beginPath(); gg.moveTo(0, h*0.68);
    gg.quadraticCurveTo(w*0.25, h*0.60, w*0.50, h*0.66);
    gg.quadraticCurveTo(w*0.75, h*0.71, w, h*0.63);
    gg.lineTo(w,h); gg.lineTo(0,h); gg.closePath(); gg.fill();
    gg.fillStyle = '#7d9765';
    gg.beginPath(); gg.moveTo(0, h*0.76);
    gg.quadraticCurveTo(w*0.30, h*0.70, w*0.60, h*0.75);
    gg.quadraticCurveTo(w*0.85, h*0.79, w, h*0.74);
    gg.lineTo(w,h); gg.lineTo(0,h); gg.closePath(); gg.fill();
    /* a breath of haze on the far ridge only, not over the whole sky */
    const hz = gg.createLinearGradient(0, h*0.58, 0, h*0.80);
    hz.addColorStop(0, 'rgba(240,244,238,0)');
    hz.addColorStop(0.5, 'rgba(240,244,238,.20)');
    hz.addColorStop(1, 'rgba(240,244,238,0)');
    gg.fillStyle = hz; gg.fillRect(0, h*0.55, w, h*0.30);
    return cc;

  function gardenCanvas(){
    const w = 1024, h = 512, cc = cvs(w,h), gg = cc.getContext('2d');
    gg.clearRect(0,0,w,h);
    /* the lawn */
    const lg = gg.createLinearGradient(0, h*0.66, 0, h);
    lg.addColorStop(0, '#a9bd78'); lg.addColorStop(1, '#7c9955');
    gg.fillStyle = lg; gg.fillRect(0, h*0.68, w, h*0.32);
    /* stripes of mowing, faint */
    gg.globalAlpha = 0.10;
    for(let i=0;i<7;i++){

      gg.closePath(); gg.fill();
    }
    gg.globalAlpha = 1;
    /* a hedge running the width, its top broken by hand, lit along the crown */
    gg.beginPath(); gg.moveTo(0, h*0.80);
    for(let x2=0; x2<=w; x2+=28)
      gg.lineTo(x2, h*0.635 + Math.sin(x2*0.045)*7 + (Math.random()-0.5)*10);
    gg.lineTo(w, h*0.80); gg.closePath();
    const hg = gg.createLinearGradient(0, h*0.60, 0, h*0.80);
    hg.addColorStop(0, '#6e8f4c'); hg.addColorStop(0.5, '#54713c'); hg.addColorStop(1, '#3e5730');

      gg.beginPath(); gg.arc(lx, ly, 2 + Math.random()*3.5, 0, Math.PI*2); gg.fill();
    }

    gg.lineWidth = 8;
    gg.beginPath(); gg.moveTo(w*(TX-0.004), h*0.54);

    gg.beginPath(); gg.moveTo(w*(TX-0.008), h*0.47);
    gg.quadraticCurveTo(w*(TX-0.055), h*0.38, w*(TX-0.075), h*0.30); gg.stroke();
    function clump(cx2, cy2, cr, tone){

      const cg = gg.createRadialGradient(cx2 - cr*0.25, cy2 - cr*0.3, cr*0.1, cx2, cy2, cr);
      cg.addColorStop(0, shift(tone, 0.10));
      cg.addColorStop(0.75, tone);
      cg.addColorStop(1, shift(tone, -0.07));
      gg.fillStyle = cg;
      gg.beginPath(); gg.arc(cx2, cy2, cr, 0, Math.PI*2); gg.fill();
      for(let i=0;i<Math.round(cr*0.7);i++){
        const a = Math.random()*Math.PI*2, rr = cr*(0.55 + Math.random()*0.5);

    const CAN = [[ -0.075, 0.30, 0.052, '#6f9450'],[ -0.030, 0.24, 0.060, '#7aa258'],

                 [  0.000, 0.315,0.070, '#5d8044'],[ -0.052, 0.375,0.048, '#688c4b'],

    [[0.60, 0.045, '#6f9450'], [0.665, 0.06, '#5d8044'], [0.73, 0.04, '#7aa258'],
     [0.12, 0.05, '#688c4b'], [0.88, 0.055, '#5d8044']].forEach(function(s){
      clump(w*s[0], h*0.665, w*s[1]*0.5, s[2]);
    });
    /* the flower border along the hedge foot. the far window owns the tree;
       the near window looks onto this instead — so the bed thickens toward
       the near end and thins to strays under the tree */
    for(let i=0;i<44;i++){
      const nearSide = Math.random() < 0.72;
      const fx = w*(nearSide ? 0.52 + Math.random()*0.44 : Math.random()*0.52);
      const fy = h*(0.660 + Math.random()*0.035);
      const r = 2.2 + Math.random()*2.8, kind = Math.random();
      if(kind < 0.55){                        /* a rose: petals rounding a heart */
        const col = Math.random() < 0.6 ? '#c96a8f' : '#d9536a';
        gg.fillStyle = rgba(shift(col, -0.08), 0.9);
        gg.beginPath(); gg.arc(fx, fy, r, 0, Math.PI*2); gg.fill();
        gg.fillStyle = rgba(shift(col, 0.08), 0.9);
        gg.beginPath(); gg.arc(fx - r*0.2, fy - r*0.2, r*0.62, 0, Math.PI*2); gg.fill();
        gg.fillStyle = rgba(shift(col, 0.16), 0.85);
        gg.beginPath(); gg.arc(fx - r*0.3, fy - r*0.3, r*0.3, 0, Math.PI*2); gg.fill();
      }else if(kind < 0.8){                   /* white — the bed needs its rests */
        for(let p=0;p<5;p++){
          const a = p/5*Math.PI*2 + Math.random()*0.5;
          gg.fillStyle = 'rgba(240,239,232,0.9)';
          gg.beginPath();
          gg.ellipse(fx + Math.cos(a)*r*0.55, fy + Math.sin(a)*r*0.38, r*0.45, r*0.24, a, 0, Math.PI*2);

        }
        gg.fillStyle = '#dcb84e';
        gg.beginPath(); gg.arc(fx, fy, r*0.26, 0, Math.PI*2); gg.fill();
      }else{                                  /* a foxglove spike standing taller */
        gg.strokeStyle = 'rgba(74,100,56,0.85)'; gg.lineWidth = 1.6;
        gg.beginPath(); gg.moveTo(fx, fy + r); gg.lineTo(fx, fy - r*3.4); gg.stroke();
        for(let b=0;b<5;b++){
          gg.fillStyle = rgba('#a982c9', 0.9 - b*0.1);
          gg.beginPath();
          gg.arc(fx + (b%2 ? 1.4 : -1.4), fy - r*(0.2 + b*0.7), r*(0.55 - b*0.06), 0, Math.PI*2);
          gg.fill();

    }
    /* daisies strayed out of the bed into the mown lawn */
    for(let i=0;i<16;i++){
      const t = Math.random();
      const fx = Math.random()*w, fy = h*(0.72 + t*0.24), r = 2 + t*3;
      for(let p=0;p<5;p++){
        const a = p/5*Math.PI*2 + Math.random()*0.5;

        gg.ellipse(fx + Math.cos(a)*r*0.55, fy + Math.sin(a)*r*0.38, r*0.45, r*0.24, a, 0, Math.PI*2);

      gg.beginPath(); gg.arc(fx, fy, r*0.26, 0, Math.PI*2); gg.fill();

    gg.globalCompositeOperation = 'source-atop';
    gg.fillStyle = 'rgba(255,250,230,.05)'; gg.fillRect(0,0,w,h);
    gg.globalCompositeOperation = 'source-over';

  }

     the openings in every direction — at a hard angle through the glass the

  const OUT_MID = (WIN.zEdges[0][0] + WIN.zEdges[1][1])/2;
  const OUT_SPAN = WIN.zEdges[1][1] - WIN.zEdges[0][0];

    new THREE.MeshBasicMaterial({map:tex(gardenCanvas()), transparent:true}));

})();

/* --- the curtains -------------------------------------------------------
   a plane pushed into folds. the folds are pinched at the heading where the
   tape gathers them and open out toward the hem, and the whole panel bows
   away from the wall as it falls — hang it dead flat and it reads as card. */
function curtainPanel(w, h, folds, amp, tied){
  const segX = 96, segY = 40;
  const g = new THREE.PlaneGeometry(w, h, segX, segY);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), y = p.getY(i);
    const u = (x + w/2)/w;                       /* 0..1 across the panel  */
    const v = 1 - (y + h/2)/h;                   /* 0 at the heading, 1 at the hem */
    /* a tieback gathers the cloth to a waist about two-thirds down,
       and the folds fan out again below it */
    const pinch = tied ? 1 - 0.62*Math.exp(-Math.pow((v - 0.60)/0.09, 2)) : 1;
    const open = (0.30 + 0.70*Math.pow(v, 0.7)) * pinch;
    let z = Math.sin(u * folds * Math.PI*2) * amp * open;
    z += Math.sin(u * folds * Math.PI*4 + 1.1) * amp * 0.22 * open;   /* secondary break */
    z += Math.sin(u * folds * Math.PI*6 + v*9.0) * amp * 0.10 * open; /* and the cloth's own tremble */
    z -= Math.pow(v, 1.8) * amp * 1.5;           /* the bow away from the wall */
    /* the cloth loses a little width to the folds, and the hem hangs uneven */
    p.setX(i, x * (1 - 0.06*open) * (tied ? 0.52 + 0.48*pinch : 1));
    p.setY(i, y - Math.sin(u*folds*Math.PI*2 + 0.6) * 0.02 * Math.pow(v, 6));
    p.setZ(i, z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, M.curtain);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* --- what stands beyond: a paved terrace, the green behind it ------------ */

      g2.lineTo(x2, h*0.565 + Math.sin(x2*0.05)*7 + (Math.random()-0.5)*9);
    g2.lineTo(w, h); g2.closePath();
    const hg = g2.createLinearGradient(0, h*0.54, 0, h);
    hg.addColorStop(0, '#6b8a4c'); hg.addColorStop(0.55, '#4b6636'); hg.addColorStop(1, '#3a512c');
    g2.fillStyle = hg; g2.fill();
    /* leaf speckle over the hedge face */
    g2.save();
    g2.beginPath(); g2.rect(0, h*0.54, w, h*0.46); g2.clip();
    for(let i=0;i<500;i++){
      const lx = Math.random()*w, ly = h*(0.56 + Math.random()*0.44);
      g2.fillStyle = rgba(Math.random() < 0.5 ? '#7ea25a' : '#3f5731', 0.5);
      g2.beginPath(); g2.arc(lx, ly, 2 + Math.random()*4, 0, Math.PI*2); g2.fill();
    }
    g2.restore();
    /* hydrangeas standing against the hedge. each shrub is a stagger of
       two or three heads over its own leaf mass, set at its own height
       and size, so the row reads as planting and never as a line of
       balloons on sticks */
    ['#c96a8f', '#a982c9', '#dfe3ea', '#c96a8f', '#a982c9'].forEach(function(col, i){
      const sx = w*(0.07 + i*0.20 + (Math.random()-0.5)*0.05);
      const sy = h*(0.79 + (Math.random()-0.5)*0.045);
      const sr = 20 + Math.random()*14;
      /* the leaf mass first: a few dark lobes, wider than they are tall */
      for(let l2=0;l2<4;l2++){
        g2.fillStyle = rgba(l2%2 ? '#43603a' : '#54744a', 0.92);
        g2.beginPath();
        g2.ellipse(sx + (Math.random()-0.5)*sr*1.7, sy + sr*0.4 + Math.random()*sr*0.4,
                   sr*(0.6 + Math.random()*0.4), sr*(0.4 + Math.random()*0.25), 0, 0, Math.PI*2);
        g2.fill();
      }
      /* then the heads, each its own mound of florets */
      const heads = 2 + Math.floor(Math.random()*2);
      for(let n2=0;n2<heads;n2++){
        const hx = sx + (n2 - (heads-1)/2)*sr*0.95 + (Math.random()-0.5)*sr*0.4;
        const hy = sy - sr*0.15 + (Math.random()-0.5)*sr*0.5;
        const hr = sr*(0.45 + Math.random()*0.3);
        const cg = g2.createRadialGradient(hx - hr*0.3, hy - hr*0.3, hr*0.1, hx, hy, hr);
        cg.addColorStop(0, shift(col, 0.08)); cg.addColorStop(1, shift(col, -0.10));
        g2.fillStyle = cg;
        g2.beginPath(); g2.ellipse(hx, hy, hr, hr*0.85, 0, 0, Math.PI*2); g2.fill();
        for(let p2=0;p2<16;p2++){
          const a2 = Math.random()*Math.PI*2, rr2 = hr*Math.sqrt(Math.random())*0.85;
          g2.fillStyle = rgba(shift(col, Math.random() < 0.5 ? 0.14 : -0.06), 0.8);
          g2.beginPath();
          g2.arc(hx + Math.cos(a2)*rr2, hy + Math.sin(a2)*rr2*0.8, 2 + Math.random()*2.5, 0, Math.PI*2);
          g2.fill();
        }

    /* a lavender row in front of them, spikes leaning as they please */
    for(let i=0;i<38;i++){
      const lx = w*Math.random(), ly = h*(0.90 + Math.random()*0.06);
      const lean = (Math.random()-0.5)*6, tall = 16 + Math.random()*12;

      g2.beginPath(); g2.moveTo(lx, ly); g2.quadraticCurveTo(lx + lean*0.5, ly - tall*0.6, lx + lean, ly - tall); g2.stroke();
      for(let b=0;b<4;b++){
        g2.fillStyle = rgba('#8a7ab8', 0.9 - b*0.12);
        g2.beginPath();
        g2.arc(lx + lean*(0.7 + b*0.1), ly - tall + b*3.2, 2.6 - b*0.35, 0, Math.PI*2);
        g2.fill();

    }

  function paverCanvas(){

/* --- the plant ---------------------------------------------------------- */
(function plant(){
  const g = new THREE.Group();
  const PX = 3.05, PZ = 4.15;      /* the corner past the armchair, by the window */

  /* pot: a lathe profile, so it has a lip and a foot rather than being a tube */
  const prof = [];
  const pts = [[0.00,0.00],[0.20,0.00],[0.215,0.035],[0.24,0.10],[0.285,0.30],
               [0.305,0.46],[0.315,0.52],[0.335,0.545],[0.315,0.565],[0.295,0.555],
               [0.29,0.50],[0.0,0.50]];
  pts.forEach(function(p){ prof.push(new THREE.Vector2(p[0], p[1])); });
  const pot = new THREE.Mesh(new THREE.LatheGeometry(prof, 40), M.pot);
  pot.castShadow = true; pot.receiveShadow = true;
  g.add(pot);
  /* soil, dished slightly below the rim */
  const soil = new THREE.Mesh(new THREE.CircleGeometry(0.285, 32), M.soil);
  soil.rotation.x = -Math.PI/2; soil.position.y = 0.485;
  soil.receiveShadow = true;
  g.add(soil);

  /* three stems out of the pot, each leaning its own way */
  const STEMS = [[0.02, 1.32, 0.10, 0.06],[-0.09, 1.10, -0.16, -0.20],[0.11, 0.92, 0.20, 0.26]];
  STEMS.forEach(function(s, si){
    const sx = s[0], len = s[1], leanX = s[2], leanZ = s[3];
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(sx, 0.44, s[3]*0.1),
      new THREE.Vector3(sx + leanX*0.25, 0.44 + len*0.38, leanZ*0.25),
      new THREE.Vector3(sx + leanX*0.70, 0.44 + len*0.74, leanZ*0.70),
      new THREE.Vector3(sx + leanX, 0.44 + len, leanZ)
    ]);
    const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.019, 7, false), M.stem);
    stem.castShadow = true;
    g.add(stem);

    /* leaves up the stem, alternating side and opening out toward the top */
    const n = 16 + si*2;
    for(let i=0;i<n;i++){
      const t = 0.10 + (i/n)*0.90;
      const at = curve.getPoint(t);
      const size = 0.34 + (1 - Math.abs(t - 0.55))*0.26 + Math.random()*0.09;
      const leaf = new THREE.Mesh(new THREE.PlaneGeometry(size*0.72, size, 3, 4), M.leaf);
      /* give the blade a curl so it is never a flat card */
      const lp = leaf.geometry.attributes.position;
      for(let k=0;k<lp.count;k++){
        const lx = lp.getX(k), ly = lp.getY(k);
        lp.setZ(k, -Math.pow(lx/(size*0.36), 2)*size*0.10 + (ly/size)*size*0.06);
      }
      lp.needsUpdate = true; leaf.geometry.computeVertexNormals();

      const spin = (i*2.399) + si*1.1;                  /* golden-angle phyllotaxis */
      const lg = new THREE.Group();
      lg.position.copy(at);
      lg.rotation.y = spin;
      leaf.position.set(0, size*0.42, size*0.30);
      leaf.rotation.x = 0.55 + Math.random()*0.45;      /* droop */
      leaf.rotation.z = (Math.random()-0.5)*0.4;
      leaf.castShadow = true; leaf.receiveShadow = true;
      lg.add(leaf);
      g.add(lg);
    }
  });

  g.position.set(PX, 0, PZ);
  scene.add(g);
  scene.add(contact(1.5, 1.5, 0.52, PX, PZ));
})();
