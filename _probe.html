    /* the bloom each globe throws — the part you actually read as "lit".
       A sprite, not a sphere: a sphere's silhouette is a hard-edged disc,
       and glow that ends on an edge reads as a decal. */
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map:haloTex, color:0xffb257, transparent:true, opacity:0.85,
      fog:false, depthWrite:false, blending:THREE.AdditiveBlending}));
    halo.scale.set(0.42, 0.42, 1);
    halo.position.set(gx, gy, gz);
    halo.renderOrder = 4;
    ringLamp.group.add(halo);
    ringLamp.halos.push(halo);
  }
  /* its warmth pooled over the glass and gold */
  const warm = new THREE.PointLight(0xffb257, 1.55, 6.5, 2);
  warm.position.set(cx, ringY - 0.1, cz);
  ringLamp.group.add(warm);
  ringLamp.light = warm;
  /* the whole fixture is the switch — press it and the lights go out */
  ringLamp.group.userData.pick = {name:'Turn the lights off', lamp:true};
  scene.add(ringLamp.group);
})();

/* ---- the switch ----------------------------------------------- */
/* Off is not black: the perimeter LED and the two candles carry the room,
   which is the whole point of being able to turn this off. The ambient and
   hemisphere levels ease down with it so the drop actually reads. */
const LAMP_KEY = 'dining-ring-lamp';
let lampOn = true, lampMix = 1;          /* mix is the eased value the loop uses */
const lampBtn = document.getElementById('lamp');

function setLamp(on, instant){
  lampOn = on;
  if(instant) lampMix = on ? 1 : 0;
  lampBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  lampBtn.classList.toggle('off', !on);
  lampBtn.setAttribute('aria-label', on ? 'Turn the table lights off'
                                        : 'Turn the table lights on');
  ringLamp.group.userData.pick.name = on ? 'Turn the lights off' : 'Turn the lights on';
  try{ localStorage.setItem(LAMP_KEY, on ? '1' : '0'); }catch(e){}
}
function toggleLamp(){ setLamp(!lampOn); }
lampBtn.addEventListener('click', toggleLamp);

/* the two ends of the fade, so the loop only ever lerps between them */
const CORE_ON   = new THREE.Color('#ffcf82'), CORE_OFF  = new THREE.Color('#3a3129');
const GLOBE_ON  = new THREE.Color('#ffe9c6'), GLOBE_OFF = new THREE.Color('#cfc6b6');

/* what the eased mix drives, once per frame */
function paintLamp(){
  const m = lampMix;
  /* intensity only — hiding a light changes the light count, and three
     recompiles every material in the room when that happens */
  ringLamp.light.intensity = 1.55*m;
  for(let i=0;i<ringLamp.cores.length;i++){
    ringLamp.cores[i].material.color.copy(CORE_OFF).lerp(CORE_ON, m);
    ringLamp.halos[i].material.opacity = 0.85*m;
    ringLamp.halos[i].visible = m > 0.01;
    const gm = ringLamp.globes[i].material;
    gm.color.copy(GLOBE_OFF).lerp(GLOBE_ON, m);
    gm.opacity = 0.62 + 0.18*m;
  }
  /* the room's own fill leans back a little with it, so the drop reads */
  hemi.intensity = 0.13 + 0.07*m;
  amb.intensity  = 0.10 + 0.04*m;
}

/* ============================================================
   10. LIGHT — a low gold evening, lit from inside the room
   ============================================================ */
/* Almost none of the light in here comes from outside any more. The
   perimeter LED, the ring over the table and two candles do the work;
   everything below is only there to keep the shadows from going flat. */
const hemi = new THREE.HemisphereLight(0xffcf96, 0x3a2c1e, 0.20);
scene.add(hemi);

/* an even wash of candle-warm so nothing reads as a black hole */
const amb = new THREE.AmbientLight(0xffc487, 0.14);
scene.add(amb);

/* the last of the sun, raking in low through the window on the right */
const sun = new THREE.DirectionalLight(0xffb163, 0.34);
sun.position.set(11, 2.6, 2.2);
sun.target.position.set(-3, 0.7, -2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;   sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0008;
sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);

/* the faintest dusk bounce from the left — warm, or it fights the room */
const fill = new THREE.DirectionalLight(0xc98f5a, 0.10);
fill.position.set(-7, 4.5, 6);
scene.add(fill);

/* a warm, dim interior baked into an environment map, so the gold,
   glass and lacquer have something honest to reflect */
try{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.BoxGeometry(10,10,10),
    new THREE.MeshBasicMaterial({color:0x40311f, side:THREE.BackSide})));
  const win = new THREE.Mesh(new THREE.PlaneGeometry(4,3),
    new THREE.MeshBasicMaterial({color:0xffc27a}));
  win.rotation.y = -Math.PI/2; win.position.set(4.9, 1.5, 0);
  env.add(win);
  const dark = new THREE.Mesh(new THREE.PlaneGeometry(4,3),
    new THREE.MeshBasicMaterial({color:0x1a1410}));
  dark.position.set(0, 1.5, -4.9);
  env.add(dark);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(4,4),
    new THREE.MeshBasicMaterial({color:0x141010}));   /* the ceiling reflects black now */
  ceil.rotation.x = Math.PI/2; ceil.position.y = 4.9;
  env.add(ceil);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
  scene.traverse(function(o){
    if(o.isMesh && o.material && o.material.isMeshStandardMaterial){
      o.material.envMapIntensity = o.material.metalness > 0.5 ? 1.35 : 0.38;
    }
  });
}catch(e){ /* the environment is a bonus, not a requirement */ }

/* ============================================================
   11. INTERACTION
   ============================================================ */
const dom = renderer.domElement;
const pointer = new THREE.Vector2(0,0);
const look = {x:0,y:0}, target = {x:0,y:0};
let dolly = 0, dollyTarget = 0, yaw = 0, pitch = 0;
let dragging = false, dragged = false, lastX = 0, lastY = 0, pressX = 0, pressY = 0;
let swipe = 0, wheelAcc = 0, wheelLock = 0;   /* the gestures that change plate */

const raycaster = new THREE.Raycaster();
let hovered = null;
/* the table — glass, centrepiece, settings and all — plus the place card
   standing at the sixth setting */
const clickable = [table, centre, ringLamp.group, placeCard].concat(allSettings);

/* ---- the contact form ------------------------------------------
   There is no server behind this house, so the form does the one
   honest thing a static page can: it writes the message and hands
   it to the visitor's own mail client, addressed and ready. They
   see it before it goes and they press send themselves, which is
   also the only version of this that cannot quietly lose a message.
   The note under the button says so before anyone types a word. */
const CONTACT_EMAIL = 'hello@randhalasa.com';
const fmEl    = document.getElementById('form');
const fmForm  = document.getElementById('fmForm');
const fmClose = document.getElementById('fmClose');
const fmSaid  = document.getElementById('fmSaid');
const fmName  = document.getElementById('fmName');
const fmEmail = document.getElementById('fmEmail');
const fmMsg   = document.getElementById('fmMsg');
let formOpen = false;

function openForm(){
  if(formOpen) return;
  formOpen = true;
  fmSaid.textContent = '';
  fmEl.classList.add('open');
  fmEl.setAttribute('aria-hidden', 'false');
  fmName.focus();
}
function closeForm(){
  if(!formOpen) return;
  formOpen = false;
  fmEl.classList.remove('open');
  fmEl.setAttribute('aria-hidden', 'true');
}
fmClose.addEventListener('click', closeForm);
fmEl.addEventListener('click', function(e){ if(e.target === fmEl) closeForm(); });

fmForm.addEventListener('submit', function(e){
  e.preventDefault();
  /* checked here rather than by the browser so the message lands in the
     status line, where a screen reader will read it out */
  const fields = [fmName, fmEmail, fmMsg];
  fields.forEach(function(f){ f.classList.remove('bad'); });
  const missing = fields.filter(function(f){ return !f.value.trim(); });
  if(missing.length){
    missing.forEach(function(f){ f.classList.add('bad'); });
    missing[0].focus();
    fmSaid.textContent = 'Name, email and a message, and it is on its way.';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fmEmail.value.trim())){
    fmEmail.classList.add('bad');
    fmEmail.focus();
    fmSaid.textContent = 'That email address does not look quite right.';
    return;
  }
  const body = fmMsg.value.trim() +
    '\n\n\u2014 ' + fmName.value.trim() + '\n' + fmEmail.value.trim();
  location.href = 'mailto:' + CONTACT_EMAIL +
    '?subject=' + encodeURIComponent('Hello from the dining room \u2014 ' + fmName.value.trim()) +
    '&body=' + encodeURIComponent(body);
  fmSaid.textContent = 'Handed to your mail app. Press send there and it reaches me.';
});

const walk = {state:'idle', t:0,
              from:new THREE.Vector3(), to:new THREE.Vector3(),
              lookFrom:new THREE.Vector3(), lookTo:new THREE.Vector3()};
const restLook = LOOK_BASE.clone();
const ORIGIN = HOME.clone();
const atLook = new THREE.Vector3();
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---- one plate at a time -------------------------------------- */
/* the close-up stands back along the room's own view axis and looks down, so
   the logo still reads the right way up, and close enough that a single plate
   and the silver either side of it are the whole frame */
const PLATE_R    = 0.158;   /* the gold charger — the widest thing on the mat */
const PLATE_TILT = 0.80;    /* radians above the glass, a shade over 45° */
const PLATE_FILL = 0.60;    /* how much of the tighter screen axis it takes */
const PLATE_LIFT = 0.06;    /* aims a touch low, lifting the plate off the card */

/* where the camera has to stand for this plate to fill the frame. A narrow
   phone in portrait steps further back and looks down harder rather than
   cropping the rim, so the framing survives any aspect */
function plateView(i, pos, aim){
  const a = expAnchors[i] || expAnchors[0];
  if(!a) return;
  const tilt  = THREE.MathUtils.clamp(PLATE_TILT + (1.25 - camera.aspect)*0.30, PLATE_TILT, 1.30);
  const vHalf = THREE.MathUtils.degToRad(camera.fov)*0.5;
  const hHalf = Math.atan(Math.tan(vHalf)*camera.aspect);
  const d = Math.max(PLATE_R / (PLATE_FILL*Math.tan(hHalf)),
                     PLATE_R*Math.sin(tilt) / (PLATE_FILL*Math.tan(vHalf)));
  const back = Math.cos(tilt)*d;
  pos.set(a.x - FWD.x*back, a.y + Math.sin(tilt)*d, a.z - FWD.z*back);
  aim.set(a.x, a.y - PLATE_LIFT, a.z);
}

const expName  = document.getElementById('expName');
const expRole  = document.getElementById('expRole');
const expBlurb = document.getElementById('expBlurb');
const expText  = document.getElementById('expText');
const expCount = document.getElementById('expCount');
let swapTimer = null;

function paintCard(){
  const e = EXPERIENCE[selectedExp];
  if(!e) return;
  expName.textContent  = e.name;
  expRole.textContent  = e.dates ? (e.role + '  \u00b7  ' + e.dates) : e.role;
  /* a blurb stays one paragraph; a list of points becomes a real <ul> so a
     screen reader announces how many there are */
  expBlurb.textContent = '';
  if(e.points && e.points.length){
    const ul = document.createElement('ul');
    e.points.forEach(function(t){
      const li = document.createElement('li');
      li.textContent = t;
      ul.appendChild(li);
    });
    expBlurb.appendChild(ul);
  } else {
    expBlurb.textContent = e.blurb || '';
  }
  expCount.textContent = (selectedExp + 1) + ' / ' + EXPERIENCE.length;
  expDots.forEach(function(b, k){ b.classList.toggle('sel', k === selectedExp); });
}

/* choosing a plate is choosing where the camera stands */
function selectEmployer(i, instant){
  if(!expAnchors[i]) return;
  const changed = i !== selectedExp;
  selectedExp = i;
  plateView(i, walk.to, walk.lookTo);
  clearTimeout(swapTimer);
  if(instant || REDUCED || !changed){
    paintCard();
    expText.classList.remove('swap');
  } else {
    /* the card swaps under the camera move rather than snapping with it */
    expText.classList.add('swap');
    swapTimer = setTimeout(function(){
      paintCard();
      expText.classList.remove('swap');
    }, 180);
  }
}
function stepEmployer(d){
  const n = EXPERIENCE.length;
  if(walk.state !== 'at' || n < 2) return;
  selectEmployer((selectedExp + d + n) % n);
}
document.getElementById('expPrev').addEventListener('click', function(){ stepEmployer(-1); });
document.getElementById('expNext').addEventListener('click', function(){ stepEmployer(1); });
selectEmployer(0, true);

function approachTo(pick){
  if(!expAnchors.length) return;      /* no employers, nothing to come to */
  const i = (pick && expAnchors[pick.exp]) ? pick.exp : 0;
  selectEmployer(i, true);            /* which also fills walk.to / walk.lookTo */
  walk.from.copy(camera.position);
  walk.lookFrom.copy(restLook);
  walk.t = 0; walk.state = 'in';
  backBtn.classList.add('show');
}
function stepBack(){
  if(walk.state !== 'at') return;
  walk.from.copy(camera.position);
  walk.to.copy(ORIGIN);
  walk.lookFrom.copy(atLook);
  walk.lookTo.copy(restLook);
  walk.t = 0; walk.state = 'out';
  backBtn.classList.remove('show');
  expEl.classList.remove('show');
  expEl.setAttribute('aria-hidden', 'true');
  hovered = null;
  dom.style.cursor = 'default';
}
backBtn.addEventListener('click', stepBack);

dom.style.cursor = 'default';
/* in the room `dragging` no longer turns anything — it only remembers that a
   press is in flight. At the table it still carries the lateral swipe. */
dom.addEventListener('pointerdown', function(e){
  dragging = true; dragged = false; swipe = 0;
  lastX = pressX = e.clientX; lastY = pressY = e.clientY;
  if(dom.setPointerCapture) dom.setPointerCapture(e.pointerId);
});
dom.addEventListener('pointermove', function(e){
  pointer.x =  (e.clientX/innerWidth)*2 - 1;
  pointer.y = -(e.clientY/innerHeight)*2 + 1;
  target.x = pointer.x; target.y = pointer.y;
  if(dragging){
    /* measured from where the press landed, not step to step, so a slow slide
       still counts as a slide rather than a click */
    if(Math.abs(e.clientX-pressX) + Math.abs(e.clientY-pressY) > 12) dragged = true;
    if(walk.state === 'at'){
      /* at the table the drag is lateral — it walks you along the settings.
         It never turns the room; it steps between plates. */
      swipe += e.clientX - lastX;
      if(Math.abs(swipe) > 70){ stepEmployer(swipe < 0 ? 1 : -1); swipe = 0; }
    }
    /* out in the room a held press moves nothing — the cursor does the looking */
    lastX = e.clientX; lastY = e.clientY;
  }
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  dom.style.cursor = hovered ? 'pointer' : 'default';
  if(dragged) return;
  if(walk.state === 'at'){
    /* at the table a press is the way out, wherever it lands — the plate fills
       the frame at this range, so anything narrower than "press to step back"
       reads as a dead click. Dragging, scrolling and the arrows move you
       between settings; pressing takes you back to the room. */
    stepBack();
    return;
  }
  if(hovered && walk.state === 'idle'){
    const pick = hovered.userData.pick;
    if(pick.lamp){ toggleLamp(); }
    else if(pick.form){ openForm(); }
    else approachTo(pick);
  }
}
dom.addEventListener('pointerup', endDrag);
dom.addEventListener('pointercancel', endDrag);
dom.addEventListener('wheel', function(e){
  if(walk.state === 'at'){
    /* one notch of scroll, one setting — held off until the glide has landed */
    const now = performance.now();
    if(now < wheelLock) return;
    wheelAcc += e.deltaY;
    if(Math.abs(wheelAcc) > 110){
      stepEmployer(wheelAcc > 0 ? 1 : -1);
      wheelAcc = 0; wheelLock = now + 460;
    }
    return;
  }
  if(walk.state !== 'idle') return;
  dollyTarget = THREE.MathUtils.clamp(dollyTarget - e.deltaY*0.0024, -1.8, 2.3);
}, {passive:true});

function updateHover(){
  if(formOpen){ hovered = null; return; }
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable, true)[0];
  let group = null;
  if(hit){
    let o = hit.object;
    while(o && !o.userData.pick) o = o.parent;
    group = o;
  }
  if(group !== hovered){
    hovered = group;
    dom.style.cursor = hovered ? 'pointer' : 'default';
  }
}

/* at the table there is nothing left to pick — a press anywhere steps back —
   so the frame does no raycasting at the range where fill rate is tightest.
   The cursor is the whole affordance. */
function updateHoverAt(){
  if(!dragging) dom.style.cursor = 'zoom-out';
}

addEventListener('keydown', function(e){
  if(formOpen){
    if(e.key === 'Escape') closeForm();
    return;                       /* the arrows belong to the textarea now */
  }
  if(e.key === 'Escape'){ stepBack(); }
  if(walk.state === 'at'){
    if(e.key === 'ArrowLeft'){  e.preventDefault(); stepEmployer(-1); }
    if(e.key === 'ArrowRight'){ e.preventDefault(); stepEmployer(1); }
  }
});

/* ============================================================
   11b. THE TAP BADGES
   A baked room looks exactly as pressable as a photograph, and
   the name tag only turns up once the cursor is already on the
   thing. So each laid place and the ring lamp wear a small hand
   badge, pinned in screen space — which doubles as the keyboard's
   only route into a WebGL canvas.
   ============================================================ */
const hints = TapHints.init({
  THREE: THREE, camera: camera,
  /* once the walk to the table starts, or the card is open, the badges are
     in the way */
  enabled: function(){ return walk.state === 'idle' && !formOpen; }
});

/* one badge per laid place — the bare settings are just table, and the
   table already takes a press anywhere on it */
/* one place, not four. The settings are all the same kind of thing, and
   once you are at the table the arrows and a swipe walk you along the rest
   — so the hand only marks the one the room opens on. */
if(expAnchors[0]) hints.add({
  kind: 'tap',
  position: [expAnchors[0].x, expAnchors[0].y + 0.05, expAnchors[0].z],
  /* the badge names the section, not the first employer on it — a visitor
     who has never heard of the company cannot tell what pressing it does,
     and the plate itself is already carrying the name */
  label: 'Experience',
  onActivate: function(){ approachTo({exp:0}); }
});

/* the ring itself, not the whole fitting — the group runs up to the canopy
   at the ceiling, and its middle is a metre of empty rod */
const lampRing = ringLamp.group.children.filter(function(c){
  return c.geometry && c.geometry.type === 'TorusGeometry';
})[0];
/* under the ring, not over it. A badge above the fixture sits against the
   dark ceiling with nothing behind it, and the visitor presses it looking at
   the wrong half of the room. Below the globes it hangs in the light the
   switch actually controls, so the change happens where the eye already is. */
const lampHint = lampRing && hints.add({
  object: lampRing, offset: [0, -0.24, 0],
  label: 'Switch the lamp off',
  onActivate: function(){ toggleLamp(); }
});

/* the sixth setting, the one nobody has been seated at. Its card is the way
   to write to me, so it wears the pen.

   The badge rides on the back of the empty chair, not over the card. Over
   the card it sat inside the table's own press target, and a press that
   missed the 29-pixel disc by a few pixels did not do nothing — it walked
   the camera down onto the plates, into the experience section, which is a
   long way from "leave your details" and takes a step back to undo. The
   chair is not clickable, so a near-miss there costs nothing at all. The
   badge also carries `roomy`, which widens what counts as a press well past
   the drawn circle — the one badge in the house where being slightly off
   ought to still work. */
if(CARD_SEAT !== undefined) hints.add({
  kind: 'write',
  roomy: true,
  object: chairs[CARD_SEAT],
  local: [0, 1.00, -0.16],          /* the top rail of the chair's back */
  label: 'Leave your details',
  onActivate: function(){ openForm(); }
});

/* the badge, the room and the remembered setting are three handles on one
   state, so the label is painted from that state in the loop */
function paintHints(){
  if(lampHint) lampHint.label(lampOn ? 'Switch the lamp off' : 'Switch the lamp on');
}

/* ============================================================
   12. LOOP
   ============================================================ */
const lookAt = new THREE.Vector3();
const clock = new THREE.Clock();

function easeInOut(p){ return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2; }

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  /* the ring lights come up and go down rather than snapping */
  const want = lampOn ? 1 : 0;
  if(lampMix !== want){
    lampMix = REDUCED ? want
            : Math.abs(want - lampMix) < 0.004 ? want
            : lampMix + (want - lampMix)*Math.min(1, dt*7);
    paintLamp();
  }

  /* the candles breathe — two sine rates beaten against each other so the
     flicker never finds a loop the eye can catch. Held still if the visitor
     has asked for reduced motion; they stay lit, they just stop moving. */
  if(!REDUCED){
    for(let i=0;i<flames.length;i++){
      const f = flames[i];
      const n = Math.sin(t*8.3 + f.phase)*0.5 + Math.sin(t*3.1 + f.phase*2.3)*0.5;
      f.flame.scale.set(1 + n*0.10, 2.1 + n*0.28, 1 + n*0.10);
      f.halo.material.opacity = 0.22 + n*0.06;
      if(f.light) f.light.intensity = 0.55 + n*0.14;
    }
  }

  if(walk.state === 'in' || walk.state === 'out'){
    walk.t = Math.min(1, walk.t + dt/1.5);
    const e = easeInOut(walk.t);
    camera.position.lerpVectors(walk.from, walk.to, e);
    lookAt.lerpVectors(walk.lookFrom, walk.lookTo, e);
    camera.lookAt(lookAt);
    if(walk.t >= 1){
      if(walk.state === 'out'){
        walk.state = 'idle';
        yaw = pitch = 0; dolly = dollyTarget = 0;
        look.x = look.y = target.x = target.y = 0;
      } else {
        walk.state = 'at';
        atLook.copy(walk.lookTo);
        expEl.classList.add('show');
        expEl.setAttribute('aria-hidden', 'false');
      }
    }
  } else if(walk.state === 'at'){
    /* the camera slides along the table to the chosen plate rather than cutting */
    const k = REDUCED ? 1 : Math.min(1, dt*4.6);
    camera.position.lerp(walk.to, k);
    atLook.lerp(walk.lookTo, k);
    camera.lookAt(atLook);
    updateHoverAt();
  } else {
    const k = Math.min(1, dt*3.0);
    look.x += (target.x - look.x)*k;
    look.y += (target.y - look.y)*k;
    dolly  += (dollyTarget - dolly)*Math.min(1, dt*3.2);
    const strafe = look.x*0.30 + yaw*1.0;      /* a little parallax, in camera space */
    const pan    = look.x*1.20 + yaw*7.5;      /* the aim does the turning */
    camera.position.set(
      HOME.x + RIGHT.x*strafe + FWD.x*dolly,
      HOME.y + look.y*0.16 + pitch*2.0 + Math.sin(t*0.4)*0.012,
      HOME.z + RIGHT.z*strafe + FWD.z*dolly
    );
    lookAt.set(
      LOOK_BASE.x + RIGHT.x*pan,
      LOOK_BASE.y + look.y*0.26 + pitch*1.5,
      LOOK_BASE.z + RIGHT.z*pan
    );
    camera.lookAt(lookAt);
    updateHover();
  }

  paintHints();
  hints.update();

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', function(){
  renderer.setSize(innerWidth, innerHeight);
  frameCamera();
  /* the lens just changed, so how far back the plate wants the camera did too */
  if(walk.state === 'in' || walk.state === 'at') plateView(selectedExp, walk.to, walk.lookTo);
});

/* a returning visitor gets the room the way they left it */
let lampSaved = null;
try{ lampSaved = localStorage.getItem(LAMP_KEY); }catch(e){}
setLamp(lampSaved !== '0', true);
paintLamp();

setTimeout(function(){ fadeEl.classList.add('hidden'); }, 220);
/* PROBE */
selectEmployer(0, true);
camera.position.copy(walk.to); atLook.copy(walk.lookTo); camera.lookAt(atLook);
walk.state = 'at'; expEl.classList.add('show');


})();
</script>
