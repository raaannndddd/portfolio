<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Salon Ocre — dining room</title>
<style>
  :root{
    --ink:#1c1a17;
    --card:#fffdf9;
    --shadow:0 8px 30px rgba(28,22,14,.20);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;margin:0;padding:0;background:#e9e5de;overflow:hidden}
  body{
    font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;width:100vw;height:100vh}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* lens pass */
  .lens{position:fixed;inset:0;pointer-events:none;z-index:3}
  #vignette{background:radial-gradient(122% 92% at 50% 46%,
      rgba(0,0,0,0) 44%, rgba(52,45,36,.14) 74%, rgba(40,34,26,.34) 100%);}
  #bloom{background:radial-gradient(58% 62% at 74% 38%, rgba(255,250,238,.20), rgba(255,250,238,0) 62%);
         mix-blend-mode:screen;}
  #grain{opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");}

  /* hud */
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .hud > *{pointer-events:auto}
  .pill{
    position:absolute;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);border:0;color:var(--ink);
    display:flex;align-items:center;gap:10px;
    font-size:15px;letter-spacing:.01em;font-family:inherit;
    padding:12px 16px;cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(0)}
  .pill:focus-visible{outline:2px solid #1c1a17;outline-offset:3px}
  .square{padding:12px;width:46px;height:46px;justify-content:center}

  #plaque{top:22px;left:22px;cursor:default}
  #plaque:hover{transform:none}
  #plaque b{font-weight:600}
  #plaque span{color:#8c8375}
  #lamp{bottom:22px;right:22px}
  /* off: the bulb greys back and its rays retract */
  #lamp svg{transition:opacity .3s ease}
  #lamp .rays{transition:opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
              transform-origin:12px 12px}
  #lamp.off svg{opacity:.45}
  #lamp.off .rays{opacity:0;transform:scale(.6)}
  #back{bottom:22px;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;
        transition:opacity .3s, transform .25s cubic-bezier(.2,.8,.2,1)}
  #back.show{opacity:1;pointer-events:auto}
  #back.show:hover{transform:translateX(-50%) translateY(-2px)}




  /* the experience layer — lives only while you are at the table */
  #exp{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;
       transition:opacity .5s ease}
  #exp.show{opacity:1;visibility:visible}
  #expTitle{
    position:absolute;top:24px;left:50%;transform:translateX(-50%);
    background:var(--card);color:var(--ink);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px 22px;
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;
    white-space:nowrap;
  }
  #expTitle small{
    display:inline-block;margin-left:11px;padding-left:11px;
    border-left:1px solid rgba(28,26,23,.18);
    font-size:12px;letter-spacing:.16em;color:#8c8375;font-weight:600;
  }
  /* one card, for the one place setting in front of you */
  #expCard{
    position:absolute;left:50%;bottom:82px;transform:translateX(-50%);
    width:min(430px, calc(100vw - 148px));
    background:var(--card);color:var(--ink);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 22px 15px;text-align:center;
  }
  #expText{transition:opacity .18s ease, transform .18s ease}
  #expText.swap{opacity:0;transform:translateY(5px)}
  #expText b{display:block;font-size:12.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:600}
  #expText .role{display:block;font-size:11.5px;letter-spacing:.05em;color:#8c8375;margin-top:3px}
  #expText .blurb{display:block;font-size:13px;line-height:1.55;color:#3c3730;margin-top:9px}
  #expText .blurb ul{margin:0;padding:0;list-style:none}
  #expText .blurb li{position:relative;padding-left:14px;margin-top:7px}
  #expText .blurb li:first-child{margin-top:0}
  #expText .blurb li:before{content:'';position:absolute;left:2px;top:.62em;
    width:4px;height:4px;border-radius:50%;background:rgba(28,26,23,.42)}
  #expDots{display:flex;justify-content:center;gap:8px;margin-top:14px;pointer-events:auto}
  #expDots button{
    width:8px;height:8px;padding:0;border:0;border-radius:999px;cursor:pointer;
    background:rgba(28,26,23,.22);transition:background .25s, transform .25s;
  }
  #expDots button:hover{background:rgba(28,26,23,.45)}
  #expDots button.sel{background:var(--ink);transform:scale(1.3)}
  #expDots button:focus-visible{outline:2px solid #1c1a17;outline-offset:3px}
  /* the way through to the next setting */
  .expNav{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto}
  #expPrev{left:26px}
  #expNext{right:26px}
  #expPrev:hover{transform:translateY(-50%) translateX(-3px)}
  #expNext:hover{transform:translateY(-50%) translateX(3px)}
  #expPrev:active,#expNext:active{transform:translateY(-50%)}
  /* a single employer has nowhere to go */
  #exp.solo #expDots,#exp.solo .expNav,#exp.solo #expTitle small{display:none}

  /* --- the contact form, off the place card -------------------------- */
  #form{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
    background:rgba(20,14,8,.72);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .32s ease;padding:20px}
  #form.open{opacity:1;pointer-events:auto}
  /* cream stock and a gold rule — the place card, opened out to letter size */
  #fmCard{position:relative;width:min(94vw,470px);max-height:88vh;overflow:auto;
    background:#f7f2e6;color:#2b2823;border-radius:4px;
    padding:34px 34px 30px;
    box-shadow:0 32px 90px rgba(0,0,0,.62);
    outline:1px solid rgba(200,167,88,.55);outline-offset:-9px;
    transform:scale(.96);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
  #form.open #fmCard{transform:none}
  #fmClose{position:absolute;top:10px;right:12px;background:none;border:0;
    color:#8c8375;font-size:17px;line-height:1;cursor:pointer;padding:6px 8px;font-family:inherit}
  #fmClose:hover{color:#1c1a17}
  #fmClose:focus-visible{outline:2px solid #9a7c3c;outline-offset:2px;border-radius:6px}
  #fmCard h2{margin:0 0 6px;font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:clamp(24px,5vw,31px);line-height:1.12;color:#241f18;padding-right:34px}
  #fmCard .fm-lede{margin:0 0 20px;font-size:14.5px;line-height:1.65;color:#4d4638}
  #fmForm{display:flex;flex-direction:column;gap:13px}
  #fmForm label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:#8a7f68;margin:0 0 5px}
  #fmForm input,#fmForm textarea{width:100%;font-family:inherit;font-size:14.5px;
    color:#241f18;background:#fffdf7;border:1px solid #ddd2b6;border-radius:6px;
    padding:10px 12px;transition:border-color .2s, box-shadow .2s}
  #fmForm textarea{min-height:104px;resize:vertical;line-height:1.55}
  #fmForm input:focus,#fmForm textarea:focus{outline:none;border-color:#c8a758;
    box-shadow:0 0 0 3px rgba(200,167,88,.22)}
  #fmForm .bad{border-color:#b4675c;box-shadow:0 0 0 3px rgba(180,103,92,.18)}
  #fmSend{margin-top:4px;align-self:flex-start;font-family:inherit;font-size:14px;
    font-weight:600;letter-spacing:.02em;color:#f7f2e6;background:#3c3527;
    border:0;border-radius:999px;padding:11px 24px;cursor:pointer;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), background .2s}
  #fmSend:hover{background:#241f18;transform:translateY(-1px)}
  #fmSend:focus-visible{outline:2px solid #c8a758;outline-offset:3px}
  /* the honest bit: this opens their mail app, and it says so before they press */
  #fmNote{margin:12px 0 0;font-size:12.5px;line-height:1.55;color:#8a7f68}
  #fmNote a{color:#7a6329;text-underline-offset:3px}
  #fmNote a:hover{color:#241f18}
  #fmSaid{margin:12px 0 0;font-size:13px;color:#4a6b4e;min-height:1.2em}
  @media (max-width:820px){ #fmCard{padding:28px 20px 24px} }

  #fade{display:none;position:fixed;inset:0;background:#efece6;z-index:9;
        transition:opacity .8s ease;pointer-events:none}
  #fade.hidden{opacity:0}

  @media (max-width:820px){
    #plaque{top:14px;left:14px;font-size:13px}
    #lamp{bottom:14px;right:14px}
    #expTitle{top:66px;font-size:11px;letter-spacing:.16em;padding:10px 16px}
    #expCard{bottom:76px;width:calc(100vw - 112px);padding:13px 16px 12px;max-height:46vh;overflow-y:auto}
    #expText .blurb{font-size:12.5px}
    #expPrev{left:12px}#expNext{right:12px}
    .expNav{width:42px;height:42px;padding:11px}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="stage"></div>
<div class="lens" id="vignette"></div>
<div class="lens" id="bloom"></div>
<div class="lens" id="grain"></div>

<div class="hud">
  <div class="pill" id="plaque">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3v8"/><path d="M5.5 3v4a2.5 2.5 0 0 0 5 0V3"/><path d="M8 11v10"/>
      <path d="M17 3c-2 1.4-2.6 4-2.6 6.2 0 1.6 1 2.8 2.6 2.8V21"/>
    </svg>
    <b>Experience</b>
  </div>

  <button class="pill square" id="lamp" aria-pressed="true" aria-label="Turn the table lights off">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6"/><path d="M10 21h4"/>
      <path d="M12 3a6 6 0 0 0-3.6 10.8c.5.4.8 1 .9 1.7l.1.5h5.2l.1-.5c.1-.7.4-1.3.9-1.7A6 6 0 0 0 12 3z"/>
      <g class="rays"><path d="M12 .6v1.2"/><path d="m3.9 4 .9.9"/><path d="m20.1 4-.9.9"/><path d="M.8 12H2"/><path d="M22 12h1.2"/></g>
    </svg>
  </button>

  <button class="pill" id="back">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 6 4 12l6 6"/><path d="M4 12h16"/>
    </svg>
    Step back
  </button>


  <div id="exp" aria-hidden="true">
    <div id="expTitle">Experience<small id="expCount"></small></div>

    <button class="pill square expNav" id="expPrev" aria-label="Previous place setting">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 6 8 12l6 6"/>
      </svg>
    </button>
    <button class="pill square expNav" id="expNext" aria-label="Next place setting">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m10 6 6 6-6 6"/>
      </svg>
    </button>

    <div id="expCard">
      <div id="expText" aria-live="polite">
        <b id="expName"></b>
        <span class="role" id="expRole"></span>
        <div class="blurb" id="expBlurb"></div>
      </div>
      <!-- one dot per employer, injected from the EXPERIENCE list -->
      <div id="expDots"></div>
    </div>
  </div>

</div>

<div id="form" aria-hidden="true">
  <div id="fmCard" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <button id="fmClose" aria-label="Put the card back">&#10005;</button>
    <h2 id="fmTitle">The seat across from me is set for you</h2>
    <p class="fm-lede">Work, a project, or a restaurant recommendation, I want to hear it all.</p>

    <form id="fmForm" novalidate>
      <div>
        <label for="fmName">Your name</label>
        <input id="fmName" name="name" type="text" autocomplete="name" required />
      </div>
      <div>
        <label for="fmEmail">Your email</label>
        <input id="fmEmail" name="email" type="email" autocomplete="email" required />
      </div>
      <div>
        <label for="fmMsg">Message</label>
        <textarea id="fmMsg" name="message" required></textarea>
      </div>
      <button id="fmSend" type="submit">Send it</button>
    </form>

    <p id="fmNote">This opens your own mail app with the message already written,
    so nothing is stored here. Rather skip that? Write to
    <a href="mailto:hello@randhalasa.com">hello@randhalasa.com</a>, or find me on
    <a href="https://linkedin.com/in/randhalasa" rel="me" target="_blank">LinkedIn</a>.</p>
    <p id="fmSaid" role="status"></p>
  </div>
</div>

<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="tap-hints.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE) return;

/* ============================================================
   0. HUD
   ============================================================ */
const fadeEl = document.getElementById('fade');
const backBtn= document.getElementById('back');

/* ============================================================
   1. PALETTE
   ============================================================ */
/*  >>> EVERY COLOUR IN THE ROOM IS SET HERE. Edit a hex, reload. <<< */
const P = {
  /* walls */
  wall:      '#c9b7ae',   // mushroom-taupe side wall
  feature:   '#2b2723',   // the near-black wall behind the credenza
  wallLight: '#cdbb9a',   // the pale window wall
  ceiling:   '#040406',   // black ceiling — the LED does all the work up there
  ledLens:   '#ffc069',   // the perimeter LED itself — warm, not white
  ledChan:   '#26242b',   // the matte channel it is recessed into
  skirt:     '#d8c9ae',

  /* floor: big cream porcelain tiles */
  tileA:  '#b7a382',
  tileB:  '#ac9877',
  grout:  '#8d7a60',

  /* gold, lacquer, marble */
  gold:     '#c8a04b',
  goldDeep: '#8f6b26',
  lacquer:  '#1d1a17',    // the credenza
  marble:   '#e0d5bf',    // console and credenza tops

  /* glass, leather */
  leather: '#e5dac3',     // the white chairs
  glassT:  '#e8efec',     // table-top tint

  /* textiles */
  mat:     '#3d372f',     // espresso woven placemats
  napkin:  '#1f3d2c',     // emerald velvet napkins
  curtain: '#1e3a2c',     // and the drapes to match
  rug: { field:'#232019', border:'#b08c3a', accent:'#8a815f' },

  /* the centrepiece */
  vessel:    '#3f9c81',   // the bowl is tinted glass, not clear
  pebble:    '#232327',
  pebbleLt:  '#b9b4aa',
  airplant:  '#9fae94',
  airplant2: '#bcc7ae',
  orchid:  ['#7c1f4e', '#93295d', '#5e1638'],
  orchidHeart: '#f2d4e2',
  stem:    '#5c7042',

  /* the props */
  artglass: ['#3a5f8a', '#b96a3a', '#7a4a6e', '#d8cfc2'],
  artInk:   '#201d19',    // ground of the big framed abstract
  bottle:   '#17301f',    // champagne glass
  wax:      '#f3ead9',    // taper candles
  pot:      '#bdb2a1',    // the stone planter in the corner
  soil:     '#2a231c',
  leaf:     '#2f4a2c',    // the fiddle-leaf fig
  books:  ['#22201c', '#5c2a25', '#1e3529'],

  /* the meadow through the window */
  meadow: { sky0:'#33507c', sky1:'#c98a63', sky2:'#f7d193', far:'#5a5748',
            grass0:'#9c8a4d', grass1:'#3f3a24', poppy:'#a8412f',
            corn:'#535e88', daisy:'#efe2c4', butter:'#dfaa3b' }
};

/* ============================================================
   1b. EXPERIENCE
   ============================================================ */
/*  >>> EDIT YOUR EXPERIENCE HERE. One entry per employer, up to six. <<<
    Each entry becomes a plate on the table: the logo lands on the plate,
    the name, role and blurb go on the card underneath. Until the logo
    file exists the plate shows the employer's initials in gold.       */
const EXPERIENCE = [
  { name:'Search it Local', role:'Product Engineer', dates:'Aug 2026 — Present',
    points:[
      'Delivered systems and process improvement projects end to end — scoping, testing, implementation and monitoring — tracking status and outcomes in ClickUp for on-time, quality delivery.',
      'Identified and implemented automation and efficiency solutions that cut manual work and improved client experience, quantifying impact through estimated hours saved and measured outcomes post-launch.',
      'Worked with cross-functional stakeholders and process owners to design, test and document scalable solutions, surfacing risks early and recommending improvements grounded in real business needs.'
    ],
    logo:'images/logos/searchitlocal.jpeg' },
  { name:'Search It Local', role:'SEO Specialist', dates:'Apr 2026 — Aug 2026',
    points:[
      'Cut a recurring reporting process from 5 hours to 20 minutes by automating it end to end, removing roughly 15 hours of manual analyst work per month.',
      "Built automated data-retrieval tooling pulling the relevant metrics for each of the agency's 100 client accounts, integrating the Ahrefs, SE Ranking, Google Search Console and Apify REST APIs.",
      'Delivered first-page Google rankings for clients through on-page and off-page optimisation alongside site speed improvements.'
    ],
    logo:'images/logos/searchitlocal.jpeg' },
  { name:'WinBoard', role:'Software Engineering Intern', dates:'Aug 2024 — Nov 2024',
    points:[
      'Built a real-time computer vision pipeline in Python analysing advertising engagement from live camera feeds and recorded footage.',
      'Extracted dwell time, sentiment and demographic signals per viewer using YOLOv8 and FairFace, implementing GDPR-compliant anonymisation.',
      'Delivered interactive dashboards and configured cloud deployment supporting concurrent video processing streams.'
    ],
    logo:'images/logos/winboard.jpeg' },
  { name:'MobiSoft Mobility', role:'AI Development Intern', dates:'Nov 2023 — Feb 2024',
    points:[
      'Built AI tooling that automated customs tracking workflows for Middle Eastern government clients.',
      'Integrated multilingual semantic search over item descriptions with Apache Solr and Vectara.'
    ],
    logo:'images/logos/mobisoft.jpg' },
  { name:'Independent', role:'Programming Tutor', dates:'Feb 2023 — Present',
    points:[
      'Delivered one-on-one Java and Python tutoring to university students, improving average assessment scores by approximately 20 percent.'
    ],
    logo:'' }
];

/* ============================================================
   2. RENDERER / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#150f0a');
/* the far corners fall away into warm dark — that is what makes a big room
   feel like a small one */
scene.fog = new THREE.Fog(0x1d150e, 6, 26);

const BACK_Z = -7, SIDE_X = 6.5, WALL_H = 3.05, FRONT_Z = 9;
const SIDE_LEN = FRONT_Z - BACK_Z, SIDE_MID = (BACK_Z + FRONT_Z)/2;
const HOME = new THREE.Vector3(0.2, 1.52, 1.9);      /* stood back and turned into the corner */
const TABLE = new THREE.Vector3(2.7, 0, -3.8);       /* the table is pushed into the back-right corner */

/* the resting aim: straight down the diagonal, a little past the table, so the
   two walls meeting behind it stay in frame and the room stops reading as open */
const LOOK_BASE = TABLE.clone().sub(HOME).multiplyScalar(1.25).add(HOME);
LOOK_BASE.y = 1.28;
/* strafe, dolly and pan all run along the view, not along world x/z */
const FWD   = new THREE.Vector3(LOOK_BASE.x - HOME.x, 0, LOOK_BASE.z - HOME.z).normalize();
const RIGHT = new THREE.Vector3(-FWD.z, 0, FWD.x);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.copy(HOME);

const H_HALF = 30 * Math.PI/180;                 /* constant horizontal FOV */
function frameCamera(){
  camera.aspect = innerWidth / innerHeight;
  const v = 2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180/Math.PI;
  camera.fov = THREE.MathUtils.clamp(v, 24, 54);
  camera.updateProjectionMatrix();
}
frameCamera();

/* ============================================================
   3. TEXTURE FOUNDRY
   ============================================================ */
function cvs(w,h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(canvas, rx, ry){
  const t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = ANISO;
  if(rx){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); }
  return t;
}
function shift(hex, dL, dS){
  const c = new THREE.Color(hex), hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, THREE.MathUtils.clamp(hsl.s + (dS||0), 0, 1),
                  THREE.MathUtils.clamp(hsl.l + dL, 0.02, 0.98));
  return '#' + c.getHexString();
}
function rgba(hex, a){
  const c = new THREE.Color(hex);
  return 'rgba(' + Math.round(c.r*255) + ',' + Math.round(c.g*255) + ',' + Math.round(c.b*255) + ',' + a + ')';
}
function blotch(g, w, h, base, count, spread, alpha){
  for(let i=0;i<count;i++){
    const x = Math.random()*w, y = Math.random()*h;
    const r = (0.04 + Math.random()*0.22) * Math.max(w,h) * spread;
    const c = shift(base, (Math.random()-0.5)*0.08, (Math.random()-0.5)*0.05);
    const grd = g.createRadialGradient(x,y,0,x,y,r);
    grd.addColorStop(0, rgba(c, alpha));
    grd.addColorStop(1, rgba(c, 0));
    g.fillStyle = grd; g.fillRect(x-r, y-r, r*2, r*2);
  }
}
function speckle(g, w, h, count, alpha){
  for(let i=0;i<count;i++){
    g.fillStyle = 'rgba(60,54,44,' + (Math.random()*alpha).toFixed(3) + ')';
    g.fillRect(Math.random()*w, Math.random()*h, 1.6, 1.1);
  }
}
function ao(g, w, h, x0,y0,x1,y1, a){
  const d = g.createLinearGradient(x0,y0,x1,y1);
  d.addColorStop(0, 'rgba(64,56,44,' + a + ')');
  d.addColorStop(1, 'rgba(64,56,44,0)');
  g.fillStyle = d; g.fillRect(0,0,w,h);
}

/* smooth modern plaster — far quieter than a period wall */
function wallCanvas(w, h, base, o){
  o = o || {};
  const c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 60, 1.0, 0.30);
  blotch(g, w, h, shift(base,-0.03), 26, 0.5, 0.18);
  speckle(g, w, h, Math.round(w*h/2400), 0.03);
  if(o.bottom) ao(g, w, h, 0, h, 0, h*(1-o.bottom), 0.20);
  if(o.top)    ao(g, w, h, 0, 0, 0, h*o.top, 0.14);
  if(o.left)   ao(g, w, h, 0, 0, w*o.left, 0, 0.20);
  if(o.right)  ao(g, w, h, w, 0, w*(1-o.right), 0, 0.20);
  return c;
}

/* big cream porcelain tiles, 4×4 to a canvas, thin grout */
function tileCanvas(){
  const S = 1024, per = S/4, c = cvs(S,S), g = c.getContext('2d');
  g.fillStyle = P.grout; g.fillRect(0,0,S,S);
  for(let ty=0;ty<4;ty++) for(let tx=0;tx<4;tx++){
    const x = tx*per, y = ty*per;
    const base = shift((tx+ty)%2 ? P.tileA : P.tileB, (Math.random()-0.5)*0.03);
    g.fillStyle = base;
    g.fillRect(x+2.5, y+2.5, per-5, per-5);
    /* faint mineral cloud in each tile */
    g.save();
    g.beginPath(); g.rect(x+2.5, y+2.5, per-5, per-5); g.clip();
    blotch(g, per, per, base, 8, 0.9, 0.25);
    g.globalAlpha = 0.08;
    for(let i=0;i<4;i++){
      g.strokeStyle = shift(base, 0.10);
      g.lineWidth = 0.8 + Math.random()*1.6;
      let vx = x + Math.random()*per, vy = y + Math.random()*per;
      g.beginPath(); g.moveTo(vx,vy);
      for(let k=0;k<3;k++){
        vx += (Math.random()-0.3)*per*0.3; vy += (Math.random()-0.5)*per*0.25;
        g.lineTo(vx,vy);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
    /* soft sheen pooled off-centre, like light on a polished tile */
    const sx = x + per*(0.3+Math.random()*0.4), sy = y + per*(0.3+Math.random()*0.4);
    const sheen = g.createRadialGradient(sx,sy,0,sx,sy,per*0.6);
    sheen.addColorStop(0, 'rgba(255,255,252,.07)');
    sheen.addColorStop(1, 'rgba(255,255,252,0)');
    g.fillStyle = sheen; g.fillRect(x,y,per,per);
    g.restore();
  }
  speckle(g, S, S, 800, 0.025);
  return c;
}

/* brushed metal — tint it with the material colour */
function brushedCanvas(base){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  for(let i=0;i<600;i++){
    g.globalAlpha = 0.05 + Math.random()*0.15;
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.22);
    g.lineWidth = 0.5 + Math.random()*1.8;
    const y = Math.random()*h;
    g.beginPath(); g.moveTo(0,y); g.lineTo(w, y + (Math.random()-0.5)*3); g.stroke();
  }
  g.globalAlpha = 1;
  speckle(g, w, h, 500, 0.04);
  return c;
}

/* honed marble: grey and gold veins in a pale ground */
function marbleCanvas(){
  const w = 512, h = 512, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.marble; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.marble, 60, 0.9, 0.35);
  function vein(color, alpha, width){
    let x = Math.random()*w, y = Math.random()*h;
    g.strokeStyle = rgba(color, alpha);
    g.lineWidth = width;
    g.beginPath(); g.moveTo(x,y);
    for(let i=0;i<7;i++){
      const nx = x + (Math.random()-0.3)*w*0.22, ny = y + (Math.random()-0.5)*h*0.20;
      g.quadraticCurveTo(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40, nx, ny);
      x = nx; y = ny;
    }
    g.stroke();
  }
  for(let i=0;i<14;i++) vein('#6a6c78', 0.10 + Math.random()*0.16, 0.7 + Math.random()*2.4);
  for(let i=0;i<6;i++)  vein(P.goldDeep, 0.10 + Math.random()*0.10, 0.6 + Math.random()*1.4);
  speckle(g, w, h, 900, 0.04);
  return c;
}

/* velvet: a directional nap with a soft sheen pooled in the middle */
function velvetCanvas(base){
  const w = 256, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 30, 0.8, 0.35);
  g.globalAlpha = 0.10;
  for(let i=0;i<700;i++){
    g.strokeStyle = shift(base, (Math.random()-0.5)*0.22);
    g.lineWidth = 1;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x + (Math.random()-0.5)*3, y + 5 + Math.random()*9); g.stroke();
  }
  g.globalAlpha = 1;
  const sheen = g.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.7);
  sheen.addColorStop(0, rgba(shift(base, 0.13), 0.30));
  sheen.addColorStop(1, rgba(shift(base, 0.13), 0));
  g.fillStyle = sheen; g.fillRect(0,0,w,h);
  return c;
}

/* the credenza's fluted front: vertical ribs in black lacquer */
function flutedCanvas(){
  const w = 512, h = 256, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.lacquer; g.fillRect(0,0,w,h);
  const rib = 24;
  for(let x=0;x<w;x+=rib){
    const d = g.createLinearGradient(x,0,x+rib,0);
    d.addColorStop(0.00, shift(P.lacquer,-0.02));
    d.addColorStop(0.35, shift(P.lacquer, 0.10));
    d.addColorStop(0.55, shift(P.lacquer, 0.16));
    d.addColorStop(0.75, shift(P.lacquer, 0.05));
    d.addColorStop(1.00, shift(P.lacquer,-0.03));
    g.fillStyle = d; g.fillRect(x,0,rib,h);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x,0,1.6,h);
  }
  speckle(g, w, h, 300, 0.05);
  return c;
}

/* a fiddle-leaf fig leaf: a green ground, a pale midrib, veins running off it */
function figLeafCanvas(){
  const w = 128, h = 256, c = cvs(w,h), g = c.getContext('2d');
  const base = P.leaf;
  const d = g.createLinearGradient(0,h,0,0);
  d.addColorStop(0.00, shift(base,-0.06));
  d.addColorStop(0.55, base);
  d.addColorStop(1.00, shift(base, 0.07));
  g.fillStyle = d; g.fillRect(0,0,w,h);
  blotch(g, w, h, base, 22, 0.7, 0.22);
  g.strokeStyle = 'rgba(198,216,162,.42)'; g.lineWidth = 3.4;
  g.beginPath(); g.moveTo(w/2, h); g.lineTo(w/2, 8); g.stroke();
  g.lineWidth = 1.5;
  g.strokeStyle = 'rgba(188,208,152,.28)';
  for(let i=0;i<11;i++){
    const y = h - 20 - i*(h-42)/11, sp = 1 - i/13;
    [-1,1].forEach(function(s){
      g.beginPath(); g.moveTo(w/2, y);
      g.quadraticCurveTo(w/2 + s*w*0.22*sp, y - 11, w/2 + s*w*0.44*sp, y - 28);
      g.stroke();
    });
  }
  speckle(g, w, h, 300, 0.05);
  return c;
}

/* basketweave placemat. The tile is 16 cells square and is repeated 4x3 across
   the mat, which puts one woven cell at about 7mm — the plate close-up stands
   half a metre away, and at one cell per mat-sixteenth the weave magnified into
   noise rather than fabric. */
function matCanvas(){
  const s = 512, c = cvs(s,s), g = c.getContext('2d');
  g.fillStyle = shift(P.mat, -0.10); g.fillRect(0,0,s,s);
  const u = 32;
  for(let y=0;y<s;y+=u) for(let x=0;x<s;x+=u){
    const horiz = ((x/u + y/u) % 2) === 0;
    const col = shift(P.mat, (Math.random()-0.5)*0.06);
    g.fillStyle = col;
    g.fillRect(x+2, y+2, u-4, u-4);
    g.globalAlpha = 0.35;
    g.strokeStyle = shift(col, -0.10);
    g.lineWidth = 2;
    for(let k=6;k<u-4;k+=8){
      g.beginPath();
      if(horiz){ g.moveTo(x+2, y+k); g.lineTo(x+u-2, y+k); }
      else     { g.moveTo(x+k, y+2); g.lineTo(x+k, y+u-2); }
      g.stroke();
    }
    g.globalAlpha = 1;
  }
  speckle(g, s, s, 520, 0.05);
  return c;
}

/* the rug: near-black field, double gold border, a whisper of lattice */
function rugCanvas(){
  const w = 1024, h = 768, c = cvs(w,h), g = c.getContext('2d');
  const R = P.rug;
  g.fillStyle = R.field; g.fillRect(0,0,w,h);
  blotch(g, w, h, R.field, 50, 0.8, 0.30);
  g.strokeStyle = R.border; g.lineWidth = 10;
  g.strokeRect(26, 26, w-52, h-52);
  g.strokeStyle = R.border; g.lineWidth = 3;
  g.strokeRect(52, 52, w-104, h-104);
  g.strokeStyle = R.accent; g.lineWidth = 2;
  g.strokeRect(70, 70, w-140, h-140);
  /* faint gold lattice over the field */
  g.globalAlpha = 0.07;
  g.strokeStyle = R.border; g.lineWidth = 1.6;
  const step = 96;
  for(let x=-h;x<w+h;x+=step){
    g.beginPath(); g.moveTo(x,0); g.lineTo(x+h,h); g.stroke();
    g.beginPath(); g.moveTo(x+h,0); g.lineTo(x,h); g.stroke();
  }
  g.globalAlpha = 1;
  /* corner blossoms */
  [[96,96],[w-96,96],[96,h-96],[w-96,h-96]].forEach(function(p){
    g.globalAlpha = 0.8;
    g.fillStyle = R.border;
    for(let i=0;i<4;i++){
      g.save(); g.translate(p[0],p[1]); g.rotate(i*Math.PI/2);
      g.beginPath();
      g.moveTo(0,-4); g.quadraticCurveTo(9,-16, 0,-26); g.quadraticCurveTo(-9,-16, 0,-4);
      g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
  });
  /* pile */
  g.globalAlpha = 0.05;
  for(let i=0;i<6000;i++){
    const x = Math.random()*w, y = Math.random()*h;
    g.strokeStyle = Math.random() < 0.6 ? '#000' : '#cab98a';
    g.lineWidth = 1 + Math.random()*1.2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*7, y+(Math.random()-0.5)*7); g.stroke();
  }
  g.globalAlpha = 1;
  return c;
}

/* the big framed abstract: ink ground, gold gesture */
function artCanvas(){
  const w = 640, h = 480, c = cvs(w,h), g = c.getContext('2d');
  g.fillStyle = P.artInk; g.fillRect(0,0,w,h);
  blotch(g, w, h, P.artInk, 40, 0.9, 0.4);
  g.lineCap = 'round';
  /* broad gold sweeps */
  for(let i=0;i<5;i++){
    g.strokeStyle = rgba(shift(P.gold, (Math.random()-0.5)*0.14), 0.5 + Math.random()*0.4);
    g.lineWidth = 10 + Math.random()*26;
    const y0 = h*(0.2 + Math.random()*0.6);
    g.beginPath();
    g.moveTo(w*0.08, y0);
    g.bezierCurveTo(w*(0.3+Math.random()*0.2), y0 - h*(0.2+Math.random()*0.3),
                    w*(0.5+Math.random()*0.2), y0 + h*(0.1+Math.random()*0.3),
                    w*0.92, y0 - h*(Math.random()*0.35));
    g.stroke();
  }
  /* a heavy moon of gold leaf */
  const mx = w*0.66, my = h*0.34;
  const leaf = g.createRadialGradient(mx,my,4,mx,my,74);
  leaf.addColorStop(0, shift(P.gold, 0.16));
  leaf.addColorStop(0.7, P.gold);
  leaf.addColorStop(1, P.goldDeep);
  g.fillStyle = leaf;
  g.beginPath(); g.arc(mx,my,74,0,Math.PI*2); g.fill();
  /* thin ivory scratches */
  g.globalAlpha = 0.5;
  for(let i=0;i<7;i++){
    g.strokeStyle = '#e8e0cc';
    g.lineWidth = 1 + Math.random()*1.6;
    const y0 = h*Math.random();
    g.beginPath(); g.moveTo(w*Math.random()*0.3, y0);
    g.lineTo(w*(0.6+Math.random()*0.38), y0 + (Math.random()-0.5)*h*0.3);
    g.stroke();
  }
  g.globalAlpha = 1;
  /* canvas tooth */
  g.globalAlpha = 0.06;
  for(let i=0;i<1200;i++){
    g.strokeStyle = Math.random()<0.5 ? '#fff' : '#000';
    g.lineWidth = 1;
    const x = Math.random()*w, y = Math.random()*h;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+4+Math.random()*10, y+(Math.random()-0.5)*3); g.stroke();
  }
  g.globalAlpha = 1;
  ao(g, w, h, 0,0,0,h*0.2,0.25); ao(g, w, h, 0,h,0,h*0.8,0.3);
  return c;
}

/* the swirled art-glass vase, now on the credenza */
function artglassCanvas(){
  const s = 256, c = cvs(s,s), g = c.getContext('2d');
  g.fillStyle = P.artglass[3]; g.fillRect(0,0,s,s);
  for(let i=0;i<46;i++){
    const col = P.artglass[i % P.artglass.length];
    g.strokeStyle = rgba(shift(col,(Math.random()-0.5)*0.10), 0.35 + Math.random()*0.35);
    g.lineWidth = 5 + Math.random()*16;
    g.lineCap = 'round';
    const y = Math.random()*s, amp = 14 + Math.random()*30, ph = Math.random()*7;
    g.beginPath();
    for(let x=0;x<=s;x+=8){
      const yy = y + Math.sin(x*0.03 + ph)*amp;
      if(x===0) g.moveTo(x,yy); else g.lineTo(x,yy);
    }
    g.stroke();
  }
  const sheen = g.createLinearGradient(0,0,s,0);
  sheen.addColorStop(0.35,'rgba(255,255,255,0)');
  sheen.addColorStop(0.5,'rgba(255,255,255,.30)');
  sheen.addColorStop(0.62,'rgba(255,255,255,0)');
  g.fillStyle = sheen; g.fillRect(0,0,s,s);
  return c;
}

/* every lit wick in the room, so the tick can flicker them together */
const flames = [];

/* the meadow out the window: open country an hour before dark.
   the only window in the house that looks past the garden — long grass,
   poppies and cornflowers, and cirrus combed thin instead of cumulus.
   the sun sits low and just off frame, so the whole view is gold at the
   horizon and going blue overhead — it has to agree with the room. */
function meadowCanvas(){
  const w = 1024, h = 512, c = cvs(w,h), g = c.getContext('2d');
  const C = P.meadow;
  const sky = g.createLinearGradient(0,0,0,h*0.55);
  sky.addColorStop(0, C.sky0); sky.addColorStop(0.55, C.sky1); sky.addColorStop(1, C.sky2);
  g.fillStyle = sky; g.fillRect(0,0,w,h);
  /* the sun itself, low and swollen, just above the tree line */
  const sun = g.createRadialGradient(w*0.30,h*0.44,12,w*0.30,h*0.44,235);
  sun.addColorStop(0,'rgba(255,240,200,.88)');
  sun.addColorStop(0.30,'rgba(255,190,104,.34)');
  sun.addColorStop(1,'rgba(255,168,86,0)');
  g.fillStyle = sun; g.fillRect(0,0,w,h);
  /* cirrus: long translucent threads combed across the blue, nothing
     with a base or a body — the high-altitude answer to a cloud */
  for(let i=0;i<6;i++){
    const cy = h*(0.06 + Math.random()*0.28), cx = Math.random()*w;
    const len = w*(0.18 + Math.random()*0.28), lift = -len*(0.04 + Math.random()*0.05);
    g.strokeStyle = 'rgba(255,214,158,' + (0.12 + Math.random()*0.20).toFixed(2) + ')';
    g.lineWidth = 5 + Math.random()*9; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx, cy);
    g.quadraticCurveTo(cx + len*0.5, cy + lift, cx + len, cy + lift*0.4);
    g.stroke();
    /* a fainter echo under each streak, slightly offset, feathers it */
    g.strokeStyle = 'rgba(255,190,132,0.09)'; g.lineWidth = 14;
    g.beginPath(); g.moveTo(cx + 14, cy + 6);
    g.quadraticCurveTo(cx + len*0.5, cy + lift + 6, cx + len - 10, cy + lift*0.4 + 5);
    g.stroke();
  }
  /* the far tree line, blued by the miles — a solid band first, then
     crowns packed close along it, so the distance reads as woods */
  g.fillStyle = rgba(shift(C.far, 0.02, -0.08), 0.85);
  g.fillRect(0, h*0.49, w, h*0.04);
  g.globalAlpha = 0.8;
  for(let i=0;i<52;i++){
    const tx = (i + Math.random()*0.8)*w/52, ty = h*(0.487 + Math.random()*0.012), tr = 6 + Math.random()*10;
    g.fillStyle = shift(C.far, (Math.random()-0.5)*0.06, -0.28);
    g.beginPath(); g.arc(tx, ty, tr, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  /* the meadow itself, darkening as it nears */
  const grd = g.createLinearGradient(0, h*0.52, 0, h);
  grd.addColorStop(0, shift(C.grass0, 0.10, -0.08));
  grd.addColorStop(0.4, C.grass0);
  grd.addColorStop(1, C.grass1);
  g.fillStyle = grd; g.fillRect(0, h*0.52, w, h*0.48);
  /* long grass: strokes that lean with a wind out of the left, taller
     and looser toward the foot of the canvas */
  for(let i=0;i<1500;i++){
    const t = Math.random();
    const x = Math.random()*w, y = h*(0.54 + t*0.46);
    const tall = 3 + t*14, lean = 1 + t*4;
    g.strokeStyle = rgba(shift(t < 0.4 ? C.grass0 : C.grass1, (Math.random()-0.5)*0.16), 0.35);
    g.lineWidth = 0.8 + t*1.2;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + lean*0.4, y - tall*0.6, x + lean, y - tall);
    g.stroke();
  }
  /* the flowers, sown in drifts the way they actually seed: each drift
     one species, dots at the tree line growing to open blooms up close */
  function bloom(x, y, r, kind){
    if(r < 2.2){                                        /* too far to draw petals */
      g.fillStyle = rgba(kind === 0 ? C.poppy : kind === 1 ? C.corn : kind === 2 ? C.daisy : C.butter, 0.85);
      g.beginPath(); g.arc(x, y, Math.max(1, r*0.8), 0, Math.PI*2); g.fill();
      return;
    }
    if(r > 4){                                          /* the near ones stand on stems */
      g.strokeStyle = 'rgba(92,84,44,0.7)'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, y + r*2.4); g.quadraticCurveTo(x + 2, y + r, x, y); g.stroke();
    }
    if(kind === 0){                                     /* poppy — red bowl, dark heart */
      g.fillStyle = shift(C.poppy, (Math.random()-0.5)*0.08);
      g.beginPath(); g.arc(x, y, r*0.9, 0, Math.PI*2); g.fill();
      g.fillStyle = rgba(shift(C.poppy, 0.12), 0.8);
      g.beginPath(); g.arc(x - r*0.25, y - r*0.25, r*0.45, 0, Math.PI*2); g.fill();
      g.fillStyle = 'rgba(38,30,30,0.85)';
      g.beginPath(); g.arc(x, y, r*0.26, 0, Math.PI*2); g.fill();
    }else if(kind === 1){                               /* cornflower — ragged blue star */
      for(let p=0;p<6;p++){
        const a = p/6*Math.PI*2 + Math.random()*0.3;
        g.fillStyle = rgba(shift(C.corn, (Math.random()-0.5)*0.10), 0.9);
        g.beginPath();
        g.ellipse(x + Math.cos(a)*r*0.55, y + Math.sin(a)*r*0.42, r*0.42, r*0.2, a, 0, Math.PI*2);
        g.fill();
      }
      g.fillStyle = rgba(shift(C.corn, -0.18), 0.9);
      g.beginPath(); g.arc(x, y, r*0.24, 0, Math.PI*2); g.fill();
    }else if(kind === 2){                               /* daisy */
      for(let p=0;p<6;p++){
        const a = p/6*Math.PI*2 + Math.random()*0.4;
        g.fillStyle = rgba(C.daisy, 0.92);
        g.beginPath();
        g.ellipse(x + Math.cos(a)*r*0.6, y + Math.sin(a)*r*0.42, r*0.5, r*0.24, a, 0, Math.PI*2);
        g.fill();
      }
      g.fillStyle = C.butter;
      g.beginPath(); g.arc(x, y, r*0.28, 0, Math.PI*2); g.fill();
    }else{                                              /* buttercup — a small gold cup */
      g.fillStyle = rgba(shift(C.butter, (Math.random()-0.5)*0.08), 0.95);
      g.beginPath(); g.arc(x, y, r*0.6, 0, Math.PI*2); g.fill();
      g.fillStyle = rgba(shift(C.butter, 0.14), 0.9);
      g.beginPath(); g.arc(x - r*0.15, y - r*0.15, r*0.3, 0, Math.PI*2); g.fill();
    }
  }
  for(let d=0;d<9;d++){
    const kind = d % 4;
    const dx = Math.random()*w, dy = h*(0.56 + Math.random()*0.34), spread = w*(0.05 + Math.random()*0.08);
    const n = 10 + Math.floor(Math.random()*14);
    for(let i=0;i<n;i++){
      const fx = dx + (Math.random()-0.5)*spread*2, fy = dy + (Math.random()-0.5)*spread*0.5;
      if(fy < h*0.53 || fy > h) continue;
      const t = (fy/h - 0.52)/0.48;                     /* 0 at the horizon, 1 up close */
      bloom(fx, fy, 1.2 + t*6, kind);
    }
  }
  /* gold haze pooled low over the ground, the way it goes at this hour */
  const haze = g.createLinearGradient(0,h*0.66,0,h*0.40);
  haze.addColorStop(0,'rgba(255,190,110,.17)'); haze.addColorStop(1,'rgba(255,190,110,0)');
  g.fillStyle = haze; g.fillRect(0,0,w,h);
  return c;
}

/* plain white dinner plate, seen from above.
   The cap UVs run right to the edge of the square, so the china has to be
   painted edge to edge as well: a drawn circle leaves an unpainted margin
   outside it, and unpainted is transparent black — which is what put the
   speckled dark ring around every plate at close range. */
function plateCanvas(){
  const s = 512, c = cvs(s,s), g = c.getContext('2d');
  g.fillStyle = '#f5f4f0'; g.fillRect(0,0,s,s);
  /* the faintest turn of the rim, so the edge is not a dead flat white */
  const rim = g.createRadialGradient(s/2,s/2,s*0.40,s/2,s/2,s*0.50);
  rim.addColorStop(0, 'rgba(255,255,255,0)');
  rim.addColorStop(1, 'rgba(255,255,255,.55)');
  g.fillStyle = rim; g.fillRect(0,0,s,s);
  g.strokeStyle = rgba(P.gold, 0.9); g.lineWidth = s*0.016;
  g.beginPath(); g.arc(s/2,s/2,s*0.45,0,Math.PI*2); g.stroke();
  g.strokeStyle = rgba(P.gold, 0.55); g.lineWidth = s*0.006;
  g.beginPath(); g.arc(s/2,s/2,s*0.35,0,Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.045)';
  g.beginPath(); g.arc(s/2,s/2,s*0.33,0,Math.PI*2); g.fill();
  return c;
}

function radialCanvas(inner, mid){
  const s = 256, c = cvs(s,s), g = c.getContext('2d');
  const grd = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0, 'rgba(255,255,255,' + inner + ')');
  grd.addColorStop(mid || 0.45, 'rgba(255,255,255,' + (inner*0.5) + ')');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,s,s);
  return c;
}

/* an employer's mark for the middle of a plate: the logo file if it loads,
   the initials in gold until it does */
function logoTexture(emp){
  const s = 256, c = cvs(s,s), g = c.getContext('2d');
  g.fillStyle = rgba(P.goldDeep, 0.92);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 88px "Helvetica Neue", Helvetica, Arial, sans-serif';
  const initials = emp.name.split(/\s+/).map(function(w){ return w[0]; })
                     .join('').slice(0,3).toUpperCase();
  g.fillText(initials, s/2, s/2 + 4);
  const t = tex(c);
  if(emp.logo){
    const img = new Image();
    img.onload = function(){
      g.clearRect(0,0,s,s);
      const fit = s*0.74, r = Math.min(fit/img.width, fit/img.height);
      g.drawImage(img, (s - img.width*r)/2, (s - img.height*r)/2,
                  img.width*r, img.height*r);
      t.needsUpdate = true;
    };
    img.src = emp.logo;
  }
  return t;
}

/* ============================================================
   5. HELPERS
   ============================================================ */
function box(w,h,d,mat,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function moulding(w,h,t,d,mat){
  const g = new THREE.Group();
  g.add(box(w,t,d,mat,0, h/2-t/2,0));
  g.add(box(w,t,d,mat,0,-h/2+t/2,0));
  g.add(box(t,h-t*2,d,mat,-w/2+t/2,0,0));
  g.add(box(t,h-t*2,d,mat, w/2-t/2,0,0));
  return g;
}
/* a rounded, bevelled slab — how a cushion actually meets the light */
function roundedGeo(w,h,d,r){
  r = Math.min(r, w/2-0.002, h/2-0.002);
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y);   s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);   s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);     s.quadraticCurveTo(x,y,x+r,y);
  const g = new THREE.ExtrudeGeometry(s,{depth:Math.max(0.015,d-0.03), bevelEnabled:true,
    bevelSize:0.014, bevelThickness:0.014, bevelSegments:3, curveSegments:6});
  g.center();
  return g;
}
function soft(w,h,d,r,mat,x,y,z){
  const m = new THREE.Mesh(roundedGeo(w,h,d,r), mat);
  m.position.set(x||0,y||0,z||0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function turned(profile, segs){
  return new THREE.LatheGeometry(profile.map(function(p){
    return new THREE.Vector2(p[0], p[1]);
  }), segs || 48);
}
function tube(points, r, segs){
  const curve = new THREE.CatmullRomCurve3(points);
  return new THREE.TubeGeometry(curve, segs || 24, r, 8, false);
}
function contact(size, opacity, x, z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size,size),
    new THREE.MeshBasicMaterial({map:tex(radialCanvas(1, 0.20)), color:0x46403a, transparent:true,
      opacity:opacity, depthWrite:false}));
  m.rotation.x = -Math.PI/2;
  m.position.set(x, 0.012, z);
  m.renderOrder = 2;
  return m;
}

function buildWall(width, base, occ){
  const g = new THREE.Group();
  const pTex = tex(wallCanvas(Math.min(2048, Math.round(width*120)), 384, base, occ));
  const pm = new THREE.MeshStandardMaterial({map:pTex, bumpMap:pTex, bumpScale:0.002,
                                             roughness:0.95});
  const plaster = new THREE.Mesh(new THREE.BoxGeometry(width, WALL_H, 0.24), pm);
  plaster.position.set(0, WALL_H/2, -0.12);
  plaster.receiveShadow = true;
  g.add(plaster);
  g.add(box(width, 0.09, 0.035, M.skirt, 0, 0.045, 0.017));   /* modern flat skirting */
  g.traverse(function(o){ if(o.isMesh) o.castShadow = false; });
  return g;
}

(function(){
  function seg(len, midZ, y, h){
    const w = buildWall(len, P.wallLight, {});
    /* strip the skirting on segments that don't touch the floor */
    if(y > 0.01) w.children = w.children.filter(function(o){ return o.geometry === undefined || o.geometry.parameters.height !== 0.09; });
    w.rotation.y = -Math.PI/2;
    w.position.set(SIDE_X, 0, midZ);
    if(h){                       /* re-cut a partial-height band */
      w.children.forEach(function(o){
        if(o.geometry && o.geometry.parameters && o.geometry.parameters.height > 1){
          o.scale.y = h / WALL_H;
          o.position.y = y + h/2;
        }
      });
    }
    return w;
  }
  /* full-height stretches either side of the opening */
  const backLen  = WIN.z0 - BACK_Z;
  const frontLen = FRONT_Z - WIN.z1;
  scene.add(seg(backLen,  BACK_Z + backLen/2));
  scene.add(seg(frontLen, WIN.z1 + frontLen/2));
  /* band below the sill and above the head */
  const openLen = WIN.z1 - WIN.z0, openMid = (WIN.z0 + WIN.z1)/2;
  scene.add(seg(openLen, openMid, 0, WIN.sill));
  scene.add(seg(openLen, openMid, WIN.head, WALL_H - WIN.head));
})();

/* ---- the perimeter LED --------------------------------------------------
   One continuous square of light recessed into the black ceiling, run right
   round the edge of the room. It is the only ceiling fitting left. */
(function(){
  const INSET = 0.55, W = 0.055;
  const x0 = -SIDE_X + INSET, x1 = SIDE_X - INSET;
  const z0 =  BACK_Z + INSET, z1 = FRONT_Z - INSET;
  const yLens = WALL_H - 0.004;

  const chanM = new THREE.MeshStandardMaterial({color:P.ledChan, roughness:0.9});

  /* the soft bleed the strip throws onto the ceiling either side of itself */
  function bleedCanvas(acrossU){
    const s = 64, c = cvs(s,s), g = c.getContext('2d');
    const d = acrossU ? g.createLinearGradient(0,0,s,0) : g.createLinearGradient(0,0,0,s);
    d.addColorStop(0.00, rgba(P.ledLens, 0));
    d.addColorStop(0.40, rgba(P.ledLens, 0.24));
    d.addColorStop(0.50, rgba(P.ledLens, 0.50));
    d.addColorStop(0.60, rgba(P.ledLens, 0.24));
    d.addColorStop(1.00, rgba(P.ledLens, 0));
    g.fillStyle = d; g.fillRect(0,0,s,s);
    return c;
  }
  function bleedMat(acrossU){
    return new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(bleedCanvas(acrossU)),
      transparent:true, opacity:0.32, depthWrite:false,
      blending:THREE.AdditiveBlending, fog:false});
  }
  const bleedX = bleedMat(false), bleedZ = bleedMat(true);

  /* a run is three stacked planes, all facing straight down */
  function run(w, d, x, z, bleedMaterial){
    [[w + 0.08, d + 0.08, WALL_H - 0.002, chanM],
     [w,        d,        yLens,          M.lightLens]].forEach(function(L){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(L[0], L[1]), L[3]);
      m.rotation.x = Math.PI/2;
      m.position.set(x, L[2], z);
      scene.add(m);
    });
    const gw = (d > w) ? 0.95 : w, gd = (d > w) ? d : 0.95;
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(gw, gd), bleedMaterial);
    glow.rotation.x = Math.PI/2;
    glow.position.set(x, WALL_H - 0.008, z);
    glow.renderOrder = 3;
    scene.add(glow);
  }
  const spanX = (x1 - x0) + W, spanZ = (z1 - z0) + W, midX = (x0 + x1)/2, midZ = (z0 + z1)/2;
  run(spanX, W, midX, z0, bleedX);      /* back edge   */
  run(spanX, W, midX, z1, bleedX);      /* front edge  */
  run(W, spanZ, x0, midZ, bleedZ);      /* left edge   */
  run(W, spanZ, x1, midZ, bleedZ);      /* right edge  */

  /* and the light it actually casts, hung just under the channel */
  [[0, -5.0], [-4.6, 0.0], [4.6, -3.0], [0, 3.0]].forEach(function(p){
    const l = new THREE.PointLight(0xffb35e, 0.55, 7, 2);
    l.position.set(p[0], WALL_H - 0.55, p[1]);
    scene.add(l);

/* a fiddle-leaf fig in a stone pot fills the back-left corner — real leaves on
   real stems, because the old ball-of-foliage tree read as topiary, not a plant */

/* one blade: a violin-waisted outline, cupped across its width and nodding at
   the tip, with UVs rebuilt so the vein texture actually lands on it */
function figLeafGeo(L, W){
  const s = new THREE.Shape();
  s.moveTo(0,0);
  s.bezierCurveTo( W*0.30, L*0.10,  W*0.36, L*0.28,  W*0.24, L*0.44);
  s.bezierCurveTo( W*0.14, L*0.56,  W*0.58, L*0.68,  W*0.42, L*0.87);
  s.bezierCurveTo( W*0.32, L*0.96,  W*0.14, L*1.00,  0,      L);
  s.bezierCurveTo(-W*0.14, L*1.00, -W*0.32, L*0.96, -W*0.42, L*0.87);
  s.bezierCurveTo(-W*0.58, L*0.68, -W*0.14, L*0.56, -W*0.24, L*0.44);
  s.bezierCurveTo(-W*0.36, L*0.28, -W*0.30, L*0.10,  0,      0);
  const g = new THREE.ShapeGeometry(s, 14);
  const p = g.attributes.position, uv = g.attributes.uv;
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), y = p.getY(i);
    const t = THREE.MathUtils.clamp(y/L, 0, 1);
    p.setZ(i, -(x*x)*2.2 - t*t*L*0.16);
    uv.setXY(i, x/(W*0.95) + 0.5, t);
  }
  p.needsUpdate = true; uv.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

/* ---- one place setting ---------------------------------------- */
/* the cutlery is cut from real silhouettes — extruded outlines with a
   bevel, so every edge carries a highlight the way metal does */
function handleGeo(len, w){
  const s = new THREE.Shape();
  s.moveTo(-w*0.45,0);
  s.quadraticCurveTo(-w*0.62,-len*0.35, -w*0.30,-len*0.78);
  s.quadraticCurveTo(-w*0.55,-len*0.90, -w*0.42,-len*0.97);
  s.quadraticCurveTo(0,-len*1.05, w*0.42,-len*0.97);
  s.quadraticCurveTo(w*0.55,-len*0.90, w*0.30,-len*0.78);
  s.quadraticCurveTo(w*0.62,-len*0.35, w*0.45,0);
  s.closePath();
  return new THREE.ExtrudeGeometry(s,{depth:0.0032, bevelEnabled:true,
    bevelThickness:0.0011, bevelSize:0.0011, bevelSegments:2, curveSegments:8});
}
function forkHeadGeo(){
  const s = new THREE.Shape();
  const top = 0.062;
  s.moveTo(-0.0165, 0);
  s.lineTo(-0.019, 0.024);
  for(let i=0;i<4;i++){
    const x0 = -0.019 + i*0.0095 + 0.0013, x1 = x0 + 0.0069;
    const tip = top - Math.abs(i-1.5)*0.004;
    s.lineTo(x0, 0.026);
    s.lineTo(x0 + 0.0008, tip);
    s.quadraticCurveTo((x0+x1)/2, tip + 0.003, x1 - 0.0008, tip);
    s.lineTo(x1, 0.026);
  }
  s.lineTo(0.019, 0.024);
  s.lineTo(0.0165, 0);
  s.quadraticCurveTo(0, -0.006, -0.0165, 0);
  s.closePath();
  return new THREE.ExtrudeGeometry(s,{depth:0.0022, bevelEnabled:true,
    bevelThickness:0.0008, bevelSize:0.0008, bevelSegments:2, curveSegments:6});
}
function bladeGeo(){
  const s = new THREE.Shape();
  s.moveTo(-0.0085, 0);
  s.lineTo(-0.0092, 0.075);
  s.quadraticCurveTo(-0.009, 0.112, -0.001, 0.120);
  s.quadraticCurveTo(0.007, 0.112, 0.0082, 0.088);
  s.lineTo(0.0085, 0);
  s.closePath();
  return new THREE.ExtrudeGeometry(s,{depth:0.0016, bevelEnabled:true,

}

/* ---- the centrepiece: orchids over black stones --------------- */
function makeCenterpiece(){
  const g = new THREE.Group();

  /* the big open glass vessel */
  const vessel = new THREE.Mesh(turned([
    [0.090,0.000],[0.130,0.020],[0.185,0.100],[0.195,0.180],
    [0.176,0.260],[0.152,0.310],[0.148,0.328]
  ], 40), M.vessel);
  vessel.castShadow = false;
  g.add(vessel);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.092, 0.012, 32), M.vessel);
  base.position.y = 0.006;
  g.add(base);

  /* black river stones, a few pale ones in the mix */
  const pebGeo = new THREE.SphereGeometry(0.026, 10, 8);
  const nP = 64;
  const peb = new THREE.InstancedMesh(pebGeo, M.pebble, nP);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(),
        v = new THREE.Vector3(), sc = new THREE.Vector3();
  for(let i=0;i<nP;i++){
    const rr = 0.145*Math.sqrt(Math.random());
    const a = Math.random()*Math.PI*2;
    v.set(Math.cos(a)*rr, 0.035 + Math.random()*0.075, Math.sin(a)*rr);
    e.set(Math.random()*3, Math.random()*3, Math.random()*3);
    q.setFromEuler(e);
    sc.set(0.7 + Math.random()*0.6, 0.42 + Math.random()*0.25, 0.6 + Math.random()*0.5);
    m4.compose(v, q, sc);
    peb.setMatrixAt(i, m4);
  }
  g.add(peb);
  for(let i=0;i<5;i++){
    const p = new THREE.Mesh(pebGeo, M.pebbleLt);
    const rr = 0.13*Math.sqrt(Math.random()), a = Math.random()*Math.PI*2;
    p.position.set(Math.cos(a)*rr, 0.10 + Math.random()*0.02, Math.sin(a)*rr);
    p.scale.set(0.8, 0.45, 0.7);
    p.rotation.y = Math.random()*3;
    g.add(p);
  }

  /* air plants: silvery rosettes riding on the stones */
  function airPlant(x, z, r, mat){
    const p = new THREE.Group();
    const n = 12;
    for(let i=0;i<n;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.014, r*(0.7 + Math.random()*0.6), 6), mat);
      leaf.geometry.translate(0, r*0.35, 0);
      leaf.scale.z = 0.35;
      leaf.rotation.x = -(0.55 + Math.random()*0.55);
      const holder = new THREE.Group();
      holder.rotation.y = i*(Math.PI*2/n) + Math.random()*0.4;
      holder.add(leaf);
      p.add(holder);
    }
    for(let i=0;i<4;i++){
      const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.012, r*0.8, 6), mat);
      leaf.geometry.translate(0, r*0.3, 0);
      leaf.scale.z = 0.35;
      leaf.rotation.x = -(Math.random()*0.35);
      leaf.rotation.y = Math.random()*Math.PI*2;
      p.add(leaf);
    }
    p.position.set(x, 0.115, z);
    return p;
  }
  g.add(airPlant(-0.055, 0.02, 0.20, M.airplant2));   /* the big silvery one */
  g.add(airPlant(0.075, -0.05, 0.14, M.airplant));
  g.add(airPlant(0.045, 0.09, 0.11, M.airplant));

  /* orchid stems arcing up out of the bowl */
  const bloomPetalGeo = new THREE.SphereGeometry(0.017, 8, 6);
  function bloom(mat){
    const b = new THREE.Group();
    for(let i=0;i<5;i++){
      const petal = new THREE.Mesh(bloomPetalGeo, mat);
      const a = i*Math.PI*2/5;
      petal.position.set(Math.cos(a)*0.018, Math.sin(a)*0.018, 0);
      petal.scale.set(1, 0.62, 0.28);
      petal.rotation.z = a;
      b.add(petal);
    }
    const heart = new THREE.Mesh(new THREE.SphereGeometry(0.007, 8, 6),
      new THREE.MeshStandardMaterial({color:P.orchidHeart, roughness:0.7}));
    heart.position.z = 0.006;
    b.add(heart);
    return b;
  }
  [[-0.16, 0.62, -0.4], [0.10, 0.72, 0.9], [0.05, 0.55, 2.4]].forEach(function(def, s){
    const lean = def[0], top = def[1], yaw = def[2];
    const mat = new THREE.MeshStandardMaterial({color:P.orchid[s % P.orchid.length], roughness:0.65});
    const pts = [
      new THREE.Vector3(0, 0.10, 0),
      new THREE.Vector3(lean*0.35, top*0.5, 0),
      new THREE.Vector3(lean*0.85, top*0.88, 0),
      new THREE.Vector3(lean*1.25, top, 0)
    ];
    const holder = new THREE.Group();
    holder.rotation.y = yaw;
    const stemMesh = new THREE.Mesh(tube(pts, 0.0042, 20), M.stem);
    stemMesh.castShadow = true;
    holder.add(stemMesh);
    const curve = new THREE.CatmullRomCurve3(pts);
    for(let i=0;i<5;i++){
      const t = 0.55 + i*0.11;
      const pos = curve.getPoint(Math.min(t, 1));
      const b = bloom(mat);
      b.position.copy(pos);
      b.position.x += 0.02 + (i%2)*0.015;
      b.rotation.y = -0.6 + Math.random()*1.2;
      b.rotation.x = (Math.random()-0.5)*0.6;
      const k = 0.75 + (i/5)*0.4;
      b.scale.setScalar(k);
      holder.add(b);
    }
    /* one bud at the very tip */
    const bud = new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 6), mat);
    bud.position.copy(curve.getPoint(1));
    bud.scale.set(1, 1.4, 1);
    holder.add(bud);
    g.add(holder);
  });

  g.traverse(function(o){ if(o.isMesh && o.material !== M.vessel){ o.receiveShadow = true; } });
  return g;
}

/* ============================================================
   9c. THE PLACE CARD — the seat that is set for you
   Five of the six settings belong to somewhere I have worked.
   The sixth is the visitor's, and it is laid the same way: mat,
   charger, napkin — and a folded card standing on the glass with
   nothing written on it yet. Pressing it opens the contact form.
